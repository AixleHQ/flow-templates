variables:
- name: STAGING_BASE_URL
  value: '{{inputs.staging_base_url}}'
  description: Base URL of the deployed staging app that Merge and deploy proves and Verify walks in a
    browser.
- name: HEALTH_PATH
  value: '{{inputs.health_path}}'
  description: Path on staging that must answer 200 after a deploy (for example /up or /api/health).
- name: CI_CHECK_NAME
  value: '{{inputs.ci_check_name}}'
  description: |-
    Name of the GitHub Actions workflow (or check) that must be green on a pull request before it moves on.
- name: STAGING_DEPLOY_WORKFLOW
  value: '{{inputs.staging_deploy_workflow}}'
  description: |-
    Name of the GitHub Actions workflow that deploys the staging branch to staging; Merge and deploy watches it.
- name: SPEC_PATH
  value: '{{inputs.spec_path}}'
  description: |-
    Repository path of the product spec / PRD, read on the integration branch and edited only by Scope Change. "unset" = no spec file; the tracker ticket or the card description is the spec.
- name: PLANNING_DIR
  value: '{{inputs.planning_dir}}'
  description: |-
    Repository directory of the planning artefacts epics.md, story-dependency-graph.md and sprint-status.yaml (written by Plan Bootstrap, read by the Planner). "unset" = the board alone is the plan.
- name: DESIGN_SOURCE
  value: '{{inputs.design_source}}'
  description: |-
    Where the UI contract lives: a DESIGN.md path, a Figma file, or the URL of a deployed reference front. "unset" = the existing component library and current screens.
- name: PR_MERGE_POLICY
  value: '{{inputs.pr_merge_policy}}'
  description: |-
    agent = Verify merges the accepted pull request into the integration branch; human = the pull request stays open for a person.
- name: ESCALATION_CHANNEL
  value: '{{inputs.escalation_channel}}'
  description: |-
    Chat channel id (Slack or Teams) where agents post escalations and the unblock digest. "unset" = escalate on the board only.
- name: INTAKE_CHANNEL
  value: '{{inputs.intake_channel}}'
  description: |-
    Chat channel id where Chat Intake listens for messages containing `triage` and where progress reports land. "unset" = board only.
- name: UAT_LOGIN
  value: '{{inputs.uat_login}}'
  description: |-
    Login of an ordinary test user on staging, used by Verify. Password: UAT_PASSWORD. Add more roles as UAT_<ROLE>_LOGIN / UAT_<ROLE>_PASSWORD.
- name: UAT_ADMIN_LOGIN
  value: '{{inputs.uat_admin_login}}'
  description: 'Login of an administrator test user on staging, used by Verify. Password: UAT_ADMIN_PASSWORD.'
requires:
  integrations:
  - github
  repositories:
  - key: app
    purpose: |-
      The application repository the pipeline builds: cards branch from it, pull requests target its integration branch, its CI gates every card, and its staging branch deploys the environment Verify walks.
  secrets:
  - name: UAT_PASSWORD
    description: Password of UAT_LOGIN, the ordinary test user Verify signs in as on staging.
    prompt_at_install: false
  - name: UAT_ADMIN_PASSWORD
    description: Password of UAT_ADMIN_LOGIN, the administrator test user Verify signs in as on staging.
    prompt_at_install: false
