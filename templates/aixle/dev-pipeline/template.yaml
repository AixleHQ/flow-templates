workflows:
- key: planner
  name: Planner
  description: |-
    Scheduled every two hours, unbound. Builds the dependency map from the board itself — `Waits on #N` title prefixes and comments and each card's description — plus, when `PLANNING_DIR` is set, the story dependency graph CSV and `sprint-status.yaml` (read-only), and, when a card carries a tracker key and a tracker tool is available, the ticket's "is blocked by" links. Releases the next mutually independent Backlog cards — including cards it creates for graph-frontier stories that have none — into Tech Design under the {{inputs.wip_cap}}-card work-in-flight cap across Tech Design → Verify; the cap bounds both what may sit in flight and what one cycle may release, but only candidates that pass the dependency and footprint-disjointness tests on their own merits are released. Ranks by what a card unblocks, then priority, then age. Assigns round-robin across the project's agent members, skipping failing ones; checks every column for an existing card or open PR before creating or releasing; triages Blocked (retryable / work-gated incl. base-red and CI infrastructure / human-gated → Human-gated); re-triggers cards stuck in an automated column; reports drift between the board, the tracker, the planning artefacts and GitHub. Does not triage Human-gated or After Deploy (Human action). Read-only on the repository and the tracker; keeps no state file.
  base:
    repositories:
    - app
  steps:
  - key: plan_and_release
    name: Plan & release next batch
    instructions: |-
      ## Task

      One cycle: read the board — and the planning artefacts, when the project has them — release the next
      batch of mutually independent cards into Tech Design, keep total work in flight at
      **{{inputs.wip_cap}} cards or fewer** across Tech Design → Verify, assign round-robin, and unstick what
      can be unstuck.

      The cap is {{inputs.wip_cap}} in both senses: it is the ceiling on what may sit in flight, **and** it is
      the most you may release in a single cycle. An empty pipeline may therefore be filled in one go — but
      only with candidates that pass every test in § B on their own merits. **Never pad a batch to reach the
      cap.** A card released to fill a slot is a card Tech Design has to reject.

      Many cycles release nothing. That is normal — and a quiet cycle must also be a **silent** one.

      **Chat:** every escalation in this pipeline goes to the escalation channel (`ESCALATION_CHANNEL`),
      yours included; when it is `unset`, the `blocked` comment and the column move *are* the escalation —
      post nothing and do not report an unsent message as a finding. The intake channel (`INTAKE_CHANNEL`),
      where Chat Intake listens and the reports land, is never used for a blocker. A human's answer reaches
      the board only when it is said to Chat Intake in a message containing the word `triage`, or when a
      human moves the card — say so when you ask.

      ## Cost discipline

      This step runs every two hours, forever, and every token it spends it spends again on the next cycle.

      1. **You keep no state file.** Do not create one under any name. Everything you need is on the board,
         § D.
      2. **You are read-only on the repository and on the tracker.** You do not commit, you do not push, you
         do not open or merge PRs, you never write `sprint-status.yaml`, and you never edit, comment on or
         transition a tracker ticket. The board is the only thing you write.
      3. **Read narrowly.** The board (titles, descriptions, tags, priority, `Waits on` lines) — plus, when
         `PLANNING_DIR` is set, the graph CSV and `sprint-status.yaml` — answers "what is eligible" on its
         own. Open a card's tracker ticket, its linked tickets, `epics.md`, the spec at `SPEC_PATH` or the
         repo docs only for the cards you are actually releasing this cycle, or to resolve a dependency you
         cannot settle from the board. A full batch is {{inputs.wip_cap}} reasons to keep this rule, not a
         licence to read the whole tracker project or the epics file end to end. The latest `decision`
         comment of each Backlog card is part of "what is eligible" — read it; the rest of a card's thread
         only if you are releasing it this cycle.

      ## Board

      `Backlog → Tech Design → [Design] → Implementation → CI check → Code Review → Merge and deploy to
      staging → [After Deploy (Human action)] → Verify → Done`, with **Needs Planning** (asks too large or
      too unformed to enter the pipeline as-is — never yours to release), **Blocked** and **Human-gated**
      off to the side. Done is terminal.

      **Where a released card goes.** You release **only into Tech Design**. Tech Design writes the
      technical approach and itself routes the card to **Design** (when the UI change is big enough to need
      a design from the design source, `DESIGN_SOURCE`) or straight to **Implementation**. You never move a
      new card into Design or Implementation yourself, and never decide a card's design need. The only moves
      you make into later columns are returning a Blocked card to the column it was blocked in (§ E), or a
      cleared base-red or CI-infrastructure card to Implementation. A card too large or too unformed for a
      Tech Design session (an epic-sized ask, several surfaces with no acceptance criteria) is not released:
      leave it in Backlog and name it under § G.3 as scope-shaped.

      **`Human-gated` is not yours in either direction.** It holds the cards whose blocker is a person — a
      decision, a ruling, a credential, an access grant — and **you never triage it, never bounce a card out
      of it, and never release from it**. Your only two dealings with it: you *move* a human-gated card there
      when you triage Blocked (§ E), and you *list its contents* in the report (§ G.4). Nothing in it ages
      out, retries or comes back on its own, which is exactly why it is not in Blocked.

      **`After Deploy (Human action)` is not yours either.** Merge and deploy to staging parks a card there
      when the change is deployed to staging but a person must run a hand-run step (its `ops_runbook`
      comment) before Verify can walk it; the person posts `ops_done` and moves it to Verify. No automation
      is bound to it. **Never move, bounce, watchdog or comment on a card in it.** Two rules follow:

      - **It holds no slot** in the {{inputs.wip_cap}}-card cap — like Blocked and Human-gated, it is waiting
        on a person.
      - **Its footprint still counts** for every collision check in § B — the branch is merged into
        `{{inputs.staging_branch}}` and its PR into `{{inputs.integration_branch}}` is still open, so new
        work on the same files would conflict.

      You list its contents in the report (§ G.4), with how long each card has waited.

      **Branches.** A card's branch is cut from `{{inputs.integration_branch}}` and its PR targets
      `{{inputs.integration_branch}}`; Merge and deploy merges the branch into `{{inputs.staging_branch}}`,
      which `STAGING_DEPLOY_WORKFLOW` deploys to staging (`STAGING_BASE_URL`). `main` / the production
      branch is released only by a human — no stage touches it. What happens to the PR after Verify accepts
      is set by `PR_MERGE_POLICY`: `agent` — Verify merges it into `{{inputs.integration_branch}}`, so a
      card in Done is merged; `human` — the PR stays open for a person, so a card in Done may still be
      unmerged, and the stacked-branch rule in § A applies.

      ## Inputs

      | | | Read when |
      |---|---|---|
      | **The board** | every column: titles, descriptions, tags, priority, comments | every cycle |
      | **Planning artefacts** (`PLANNING_DIR`, when set) | `story-dependency-graph.md` (the CSV), `sprint-status.yaml` (**read-only**) | every cycle |
      | `epics.md` and the spec at `SPEC_PATH` | the story text and acceptance criteria | a story you are creating a card for this cycle, or the off-graph check (§ B.3); the spec only when the epic text is not enough |
      | Tracker ticket | the key in the card title — description, acceptance criteria, parent epic, **"is blocked by" links** | a card you are releasing now, or a dependency you cannot settle from the board — **only if a tracker tool is available in this session** |
      | Repo docs | `CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md`, `docs/`, the architecture docs | only to compute a footprint or judge whether a description is actionable |
      | Ground truth | the board, open PRs, and the code on `{{inputs.integration_branch}}` | work whose code is already on `{{inputs.integration_branch}}` is done, whatever a description or status key says |

      The spec for a card, in order of precedence before anything is asked of a human: (1) the product spec
      at `SPEC_PATH` and the planning artefacts in `PLANNING_DIR`, when set; (2) the tracker ticket, its
      epic and links, when the title carries a key and a tracker tool is available; (3) the repository's own
      docs; (4) `decision` comments on the card and linked cards. A product decision by
      {{inputs.product_owner}} beats an engineering ruling. With none of (1) and (2), the card's own
      description is the spec.

      **No tracker tool in this session?** Skip every tracker check — do not guess links or ticket status —
      and say in the report, once, that tracker "is blocked by" links were not read this cycle. A card whose
      title carries no key is specified by its description alone; nothing is missing. **`PLANNING_DIR` is
      `unset`?** The board alone is the plan: skip § A.3, § B.3 and every mention of the graph and
      `sprint-status.yaml`.

      ## A. Build the dependency map

      The board is the map; the graph and the tracker add edges to it. A card's dependencies are the union
      of:

      1. **`Waits on #N` prefixes** in its title, and `Waits on #N` / `Waits on <KEY>` lines in its
         comments (including the `blocked` / `ci` comments other stages write, e.g. `Waiting on #N
         (base-red)`).
      2. **Its own description** — explicit statements such as "depends on", "after <KEY> lands", "needs
         the endpoint from #N".
      3. **Graph edges — when `PLANNING_DIR` is set.** `PLANNING_DIR/story-dependency-graph.md` holds a
         machine-readable `story,depends_on,cross_epic` CSV, verified acyclic. **Parse the CSV; do not
         re-derive the graph from the prose in `epics.md`** — rebuilding it from prose gets it wrong and
         blocks runnable work. Edge `A → B` means **B depends on A**: the `depends_on` column is the
         dependency, not the dependent. Only CSV rows are build edges; relationships the file's prose draws
         beside them (runtime seams, waves) are not. Graph ids are `E.S` (`1.1`); `sprint-status.yaml` keys
         are slugs — map them explicitly, and map each id to its card on the board (title starts with
         `E.S `, or tag `story-E.S`).
      4. **Tracker "is blocked by" links** on the ticket named in its title — only if the title carries a
         key and a tracker tool is available. Resolve each blocking key to its card by searching every
         column for that key.

      A dependency is **satisfied** when the card it points to is in **Done**. For a dependency with no card
      on the board: a story is satisfied when its `sprint-status.yaml` key reads `done` (`PLANNING_DIR`
      set); a tracker key when its ticket is done (which you can only know with a tracker tool). A `done`
      key or done ticket whose card is still live in an earlier column is drift — report it under § G.6 and
      do not count it as satisfied. A dependency in any other column — After Deploy, Blocked and
      Human-gated included — is unsatisfied. A dependency you cannot resolve (a key with no card and no
      readable ticket, an id with no card and no status key) is unsatisfied: skip the card and say why.

      **Satisfied is not always merged.** With `PR_MERGE_POLICY` = `agent`, Done means merged and the rest
      of this paragraph is moot. With `human`, a card in Done is on `{{inputs.staging_branch}}` but its PR
      into `{{inputs.integration_branch}}` may still be open. A dependency is **merged** when its PR is
      merged (`gh pr view <n> --json state,mergedAt`). A card may be released when **at most one** of its
      satisfied dependencies is unmerged: write a line `Base: #N (<branch from #N's branch comment>)` into
      its description before you move it — Implementation branches from that card's branch, stacks its PR on
      it, and retargets to `{{inputs.integration_branch}}` after the parent merges. Two or more unmerged
      dependencies → not eligible this cycle; report it as `waits for merge of #A, #B`.

      Edges are transitive: if A waits on B and B waits on C, A depends on C. Build the map once per cycle;
      the edges are also what § B.2 counts.

      The map carries no **conflict edges** — cards with no ordering that touch the same files and so cannot
      be in flight together. Derive those yourself: the rule is in § B, the footprint sources in § D.

      ## B. Select an independent batch

      Candidates are **Backlog cards** (§ B.1) and — when `PLANNING_DIR` is set — the **frontier of the
      story graph** (§ B.3), which you turn into Backlog cards before releasing. One pool, ranked together
      by § B.2.

      Eligible: a card in **Backlog**, every dependency satisfied (§ A), an actionable description (§ B.1),
      and **no other card for the same work in any column and no open PR for it — § B.0.**

      Pick up to the free slots with no dependency path between any two in either direction (including
      paths through cards outside the batch), pairwise disjoint footprints, and no collision with anything
      in flight — including cards created by other workflows or a human, **and cards sitting in After Deploy
      (Human action)**, whose footprints are still live. **Rank them by how much they unblock — § B.2.**

      **The pairwise tests are what bound the batch, not the cap.** Disjointness is quadratic: a batch of
      *n* candidates is *n(n−1)/2* pairs to check, and one unchecked pair puts two cards on the same files.
      Check them all, in rank order. Shared generated files (lockfiles, generated
      catalogues, generated API clients) are a collision unless the repository's docs say the file merges
      cleanly per section — then the footprint is the section, and name the section each card owns.

      **One pool, fill every free slot.** The Backlog cards, the graph frontier and the off-graph stories are **one candidate pool**, not a ladder you climb only when a rung is empty — the frontier is never empty, so a ladder never reaches Backlog. Rank the whole pool by § B.2, walk it in rank order and test each candidate against what is in flight, After Deploy, and what you have already picked; **a collision skips that candidate, it never ends the cycle.** Stop when the free slots are filled or the **candidate budget** is spent: test at most the free slots + 10 candidates, in rank order, and derive footprints only for those. Stopping with free slots left is allowed when the budget is spent — say so in the report — or with each refused candidate named in the report with the exact card and file it collided with, or the eligibility rule it failed. Within the budget, "not read" or "not checked" is never a reason for a refusal. Free slots are still a ceiling, never a quota: a colliding or ineligible card is never released to fill one.

      **A footprint is a list of files, not an area.** Two cards collide only when both would edit the **same file** — or, for a shared generated file the repository's docs say merges cleanly per section, the same section. "The billing module", "the API package", "the background workers" are areas, not footprints: never refuse a candidate on an area label. Take each side's file list from the `paths:` line, the footprint in the description, or the branch diff. For a candidate with none, derive it from its spec and the code — the controllers, models, services, jobs, pages, components, migrations and tests it would edit — at file level, at worst one directory deep. Files both sides only read or only call are not a collision. A refusal names the shared file(s) and the card holding them.

      **Archived cards are not on the board.** Depending on the Flow version, `board_list_tasks` either hides archived cards or returns them with `archived: true`. Drop every row with `archived: true`, if any appear, **before anything else** — the cap count, footprint collisions, Backlog candidates, the Blocked scan and stuck-card re-triggers. An archived card holds no slot, has no live footprint and is never released, re-triggered or watchdogged. Two exceptions. **Duplicate checks (§ B.0) include archived cards:** list with `include_archived: true` — a person archived that card to say "not doing this", so an archived card for the same work blocks creating or releasing it again; create nothing and name the archived card in the report. **Dependencies:** a dependency whose card was archived from **Done** is satisfied — when a dependency's card is missing from the list, look it up with `board_list_tasks` and `include_archived: true` before calling it unresolved.

      **Respect the {{inputs.wip_cap}}-card cap.** Archived cards never count. Count what already sits in Tech Design → Verify first;
      release only up to the difference. A full pipeline means release nothing, however eligible the queue
      looks. Cards in **Blocked**, **Human-gated** and **After Deploy (Human action)** hold no slot. After
      Deploy cards still count for footprint collisions (above).

      Nothing eligible → release nothing and say so in one line. Do not reach into Needs Planning,
      Human-gated or After Deploy to fill the batch.

      ## B.1 Which Backlog cards are releasable

      Humans, other workflows and you (§ B.3 and § E, work-gated) all create cards in Backlog. A Backlog
      card is releasable when it has a spec a Tech Design session could act on — the tracker ticket's
      description and acceptance criteria, the story text from `epics.md`, or, for a card with neither, its
      own description — its dependencies are satisfied, and its footprint is disjoint from everything in
      flight. Set the assignee, add the footprint to its description if it carries none, and move it
      Backlog → Tech Design. Do not create a duplicate.

      **A recorded human decision outranks the card's own description.** A card often comes back from
      Human-gated to Backlog with its description still holding the pre-decision text ("blocked on a product
      decision", "needs product input") — that text is stale, not a hold. So, for every Backlog card, read
      its **latest `decision` comment** (that one comment, not the thread). If it settles the question, and
      nothing newer holds the card — no later `blocked` comment, no `needs-human` / `human-action` tag a
      human added since — the card is a candidate on the ordinary tests, taking its scope and acceptance
      criteria from that decision. Before moving it, reconcile the description yourself: prepend a
      `## Decision — <date> (comments <ids>)` block of at most ten lines — the ruling, what remains, the
      footprint you computed — and move the stale blocker text under `## Superseded (kept for history)`;
      delete nothing. A decision that leaves the question open, or routes the card to Needs Planning, is not
      yours: leave the card and name it under § G.3 with the comment id.

      **Leave a Backlog card alone when** it is younger than one cycle (it may be mid-creation by another
      session — check `session_list` the same way § E does), when it carries a `needs-human`, `blocked` or
      `credentials`-pending marker, when its description is a stub with no acceptance criteria and its
      tracker ticket or epic text (if readable) adds none, when a `Gated by:` line in its text names a
      question still open in the spec's recorded open questions, or when it is scope-shaped (§ Board). A
      card a human parked deliberately is not yours to release; if you cannot tell, leave it and name it
      under § G.3.

      **Procure-and-configure cards live here and stay here.** A card that is credential- or access-gated
      but is real work once the access exists is a release candidate rather than a parked question — do not
      move it to `Human-gated`, and do not release it into Tech Design either while the access is still
      missing.

      Follow-ups other stages raise: plain defects arrive in **Backlog** tagged `follow-up` + `bug` and are
      released like any other Backlog card; follow-ups that need a decision sit in **Human-gated** tagged
      `follow-up` + `needs-human-decision` and are never yours. A follow-up a person approves comes back
      through Backlog.

      ## B.2 Ranking: take what unblocks the most, always

      **This is the primary rule, for Backlog cards and frontier stories alike.** Between two releasable
      candidates, the one that frees more work wins — however much easier or tidier the other looks. With a
      full batch the ranking still matters: it decides which candidates get the slots when the disjointness
      test cuts the batch short, and the order you check pairs in.

      Count, in this order:

      1. **Cards stuck in Blocked that this work would free** (§ E, *work-gated*, base-red included).
         Highest weight there is: those cards are already specified, sometimes already built, and nothing
         but this work stands between them and Done. Read their `blocked` comments and match. **Cards in
         `Human-gated` do not count** — your releasing anything cannot free them.
      2. **Transitive dependants** — how many cards or stories, directly or indirectly, wait on this one
         (§ A edges: `Waits on`, description statements, graph descendants, tracker links if read). A card
         nothing waits on ranks last.
      3. **Pending work that cannot ship without it** — for a card with no recorded dependants, the Backlog
         cards, tickets or stories of the same epic whose acceptance criteria assume the capability it adds.

      Only when those tie: the card's **priority** field (highest first), then a `bug` tag over feature /
      `tech-debt`, then — when the graph provides them — keystone ranking, critical path and wave, then the
      **oldest card**.

      **Say the number and where it came from.** Blocked cards are counted by id; board and graph dependants
      are counted; a pending-work figure is estimated — say which, and never fabricate a figure.

      **Never take from Needs Planning.** Those asks are awaiting scope work and belong to Scope Change —
      releasing one puts an unformed ask into Tech Design, which is the failure that column exists to
      prevent. **Never take from `Human-gated` or `After Deploy (Human action)` either**: nothing there is
      waiting on the board.

      ## B.3 The graph frontier — only when `PLANNING_DIR` is set

      Stories live in `PLANNING_DIR/epics.md`, their edges in the graph CSV (§ A.3), their status in
      `sprint-status.yaml`. There is no intermediate "released" state in that file — Implementation moves a
      story straight from `backlog` to `in-progress` when it cuts the branch — so **a card existing on the
      board is what marks a story as released**.

      A **frontier story** is one whose status is `backlog` (or that has no key yet), every graph ancestor
      `done` transitively (a card in Done counts — § A), with **no card for the story in any column — archived
      cards included — and no open PR for it (§ B.0)**, and with no `Gated by:` line naming a question still open in the spec's
      recorded open questions (list those under Skipped). For each frontier story you intend to release this
      cycle, read its text in `epics.md` (the spec at `SPEC_PATH` only when that is not enough), compute its
      footprint, and **create its card in Backlog per § C** — title `<story-id> <title>`, tag
      `story-<story-id>`, the acceptance-criteria summary, the spec path and the footprint. From then on it
      is a Backlog card: the same tests, the same ranking, the same release comment.

      **Off-graph stories.** Scope Change slices new stories into `epics.md`, and a story added after the
      graph was last regenerated has no node, so § A.3 can never see it. A story whose id is absent from
      both `sprint-status.yaml` and the CSV, and whose prose dependencies are satisfied, is a frontier story
      too: release it the same way and say in the report that it is **off-graph** — a human owes the graph a
      regeneration, and that line is how they learn it.

      A `done` key with a live card in an earlier column is drift (§ A, § D): report it, do not count it as a
      satisfied ancestor, and do not fix the line. A story whose card is tagged `superseded`, or whose latest
      `decision` comment says the behaviour is not wanted, is never re-created.

      ## B.0 One piece of work, one card — check before every create and every release

      Duplicate cards become duplicate implementations with their own PRs, and conflict with code already on
      `{{inputs.staging_branch}}`. They come from two blind spots: a branch or PR that exists while its card
      sits elsewhere, and a first card sitting in a column this workflow does not triage (Human-gated, or
      Backlog tagged `superseded`). With `PLANNING_DIR` set there is a third: a story's `in-progress` key is
      written on its **branch**, so until that PR merges, `sprint-status.yaml` on
      `{{inputs.integration_branch}}` still shows `backlog` or no key at all — the file alone says "never
      started".

      **Before you create a card — and before you release a Backlog card — do all of this:**
      1. List the tasks of **every** column: Backlog, Needs Planning, Tech Design → Verify, After Deploy
         (Human action), Blocked, **Human-gated** and Done. "You do not triage Human-gated" means you never
         move it or comment on it. It does **not** mean you skip it when looking for an existing card.
         List with `include_archived: true`: an **archived** card for the same work counts too — a person
         archived it to say "not doing this" — so create and release nothing for that work and name the
         archived card under § G.3.
      2. **The work's card** is one whose title contains the same tracker key `<KEY>` (a title like
         `<KEY> follow-up: …` is a different card) or carries the tag `<KEY>`; or, for a story, one whose
         title starts with `<story-id> ` (the id and then a space; `<story-id> follow-up: …` is a different
         card) or carries the tag `story-<story-id>`. For a card with neither, compare titles and
         descriptions and say in the report that the match was by text. If another card for the same work
         exists in any column, create nothing and release nothing for it:
         - If that other card is itself a releasable Backlog card, release that one.
         - Otherwise name both under § G.3, for example "<KEY> — card N in Human-gated, Backlog card M not
           released".
      3. **Look for an open PR or branch for the key or story id** (`gh pr list --search <KEY>`, the id in
         the PR title or branch name). An open PR with no card past Backlog is drift: report it and release
         nothing for that work.
      4. **Work {{inputs.product_owner}} has cancelled is never re-created or released.** That means its
         card is tagged `superseded`, or its latest `decision` comment says the behaviour is not wanted.
      5. **Tag every card you do create with its `<KEY>` (when it has one) or `story-<story-id>`**, so the
         next cycle's check is exact.

      ## C. Create and assign

      Assignees are the project's **agent members** (the users the board assigns automated work to). Do not
      hard-code a list: read the current agent members from the board (`board_list_members`) every cycle.

      Rotation comes **from the board**: find the most recently created card carrying an agent assignee,
      give the first of this batch to the next agent member in the cycle, and continue round-robin down the
      batch. Empty board → start with the first agent member. A full batch therefore spreads evenly across
      the members, not all on one.

      **Skip an agent that is failing.** Agent subscriptions and logins change, so no member is permanently
      good or bad. Before assigning, look at the latest workflow runs of cards assigned to each member
      (`session_list`, then `session_log` for the error message). A member whose latest run shows one of these signs — "Quota exceeded", "login has expired", "no output for 30 minutes" / a spend-limit dialog, or a run cancelled with 0 steps (an ordinary cancel after steps ran does not count) — is skipped in the rotation until a later run of theirs
      succeeds. If every member is failing, assign by the rotation anyway and say so in your report.

      **`board_create_task` targets Backlog.** Entry into an automated column fires that workflow
      immediately, against whatever the card holds at that instant. Create it, fill it in, then move it.

      A released Backlog card already exists: set the assignee, add the footprint to its description if it
      carries none, then move it **Backlog → Tech Design**. Do not create a duplicate.

      You create a card only for a frontier story that has none (§ B.3) or for work-gated work that has
      none (§ E). Create in Backlog with `assignee_id` at creation time; title `<story-id> <title>` for a
      story, `<KEY> <title>` when a tracker ticket exists, otherwise a plain imperative title; the matching
      tag (`story-<story-id>` / `<KEY>`); and a description carrying the acceptance-criteria summary (from
      `epics.md`, the tracker ticket, or the blocked card's own words), the spec path, the card it unblocks
      when there is one, **and the footprint you computed**. The card on the board *is* the release record;
      you change nothing in the tracker or the repository.

      The footprint in the description is what makes the next cycle's collision check possible.

      ## D. State lives on the board

      You keep no file and write no status anywhere but the board. The tracker, `sprint-status.yaml`, open
      PRs and the board can disagree — a card in Done whose ticket is still open, a ticket or key done while
      its card is still in an earlier column, an open PR with no card past Backlog, a branch that died while
      its card sits in Implementation. That is **drift you report, not drift you fix**: name it under § G.6
      with the stage or person that owns the fix. Treat the board as ground truth for eligibility: a
      dependency whose card is not in Done is unsatisfied, whatever the tracker or the file says.

      **`sprint-status.yaml`, when `PLANNING_DIR` is set, is an input to you and an output of other stages.**
      `backlog → in-progress` is written by Implementation at branch-cut and `in-progress → review` in the
      PR, both on its branch; `review → done` by Verify once it has accepted the story. You write none of it;
      nothing writes `done → review`, because only acceptance writes `done`. A released card with no key in
      the file — a bug, a debt item, a work-gated card — is not drift: Implementation adds a key only for a
      story that has one in `epics.md`; do not invent one and do not report its absence. A card in
      `Human-gated` or `After Deploy (Human action)` whose key still reads `review` is expected, not drift —
      its acceptance is unwritten because Verify has not finished; name the column's contents once under
      § G.4 instead. Silently rewriting another stage's line is how two writers start disagreeing about the
      same story.

      ### Where each fact comes from

      | What you need | Where to read it |
      |---|---|
      | **Footprint** of a card in flight or in After Deploy | its `branch` comment's `paths:` line, else the footprint in its description, else compute it from the branch diff against `{{inputs.integration_branch}}` — and say in the report that you computed it |
      | **Footprint** of a candidate | its description, else its tracker ticket, epic text and `tech_design` comment if any, else derive a file list from its spec and the code — at file level, at worst one directory deep, never a bare package or top-level directory — say it was computed |
      | **Retry count** for a stuck card | count your own `watchdog`-tagged comments on that card. Two already there → the next move is Blocked, not a third bounce |
      | **Escalation age** | the timestamp of your last escalation comment on that card |
      | **After Deploy wait** | the timestamp of the card's latest `ops_runbook` comment |
      | **Rotation** | the most recently created card carrying an agent assignee (§ C) |
      | **Story status** (`PLANNING_DIR` set) | `sprint-status.yaml` on `{{inputs.integration_branch}}`, read-only; a card on the board outranks it |
      | **What a candidate unblocks** | the `blocked` comments it would answer, its dependants in the § A map, and the pending work whose criteria assume it (§ B.2) |

      ## E. Unstick what can be unstuck

      **Stuck in an automated column** — the run finished without producing its expected comment, or
      failed. **Check first that no run for that card is still in flight**; you will often wake mid-session,
      and a long step is not a stuck one. `session_list` then `session_log` settles it: read `idle_seconds`
      and the terminal tail. **Never treat a missing run as a finished one.** A session whose tail ends in a
      provider spend or quota error is dead, not busy — and bouncing the card to the same assignee
      reproduces it, so hand it to the next healthy agent member instead and say so in the report.
      Re-trigger by bouncing Backlog → its column. After **2** tries (counted per § D), `blocked` comment +
      escalate (§ F) + move to **Blocked**.

      **After Deploy (Human action) is not an automated column and its cards are never stuck in this sense**
      — a card waiting there is waiting for a person to run its `ops_runbook`. Never bounce or watchdog it;
      name it under § G.4.

      **A card sitting in CI check is usually waiting on its gate, not stuck.** The gate resolves when GitHub
      reports the `CI_CHECK_NAME` run; check the card's gates (`board_list_gates`) before treating a quiet
      CI check card as a failure. A gate that has gone `stale` is a human's call, not a bounce.

      **A card bounced back into Verify re-walks the change on staging from a cold start.** That is cheap
      and safe — it writes nothing until it accepts — so Verify is a normal watchdog target like any other
      automated column.

      ### Read every `blocked` comment and classify it — three kinds, and only two of them stay here

      **1. Retryable — the cause is the environment, not a missing decision.** Move the card back to the
      column it was blocked in and name the cause and attempt number. Typical: the development machine's
      window expired mid-card (the branch exists; Implementation continues on it), no machine or no Docker
      on the one allocated, an unusable repository mount, a run that died without leaving its comment,
      staging unreachable for a Verify walk, a `STAGING_DEPLOY_WORKFLOW` run that failed on a transient.

      **2. Work-gated — the blocker is code that does not exist yet.** This is the class worth hunting for,
      because it is the one the pipeline can clear on its own: the card is blocked on a capability, an
      endpoint, a migration, a page or a fixture that another card or story owns. Nobody is waiting on a
      human. Do this:

      - Name the work. It is usually quoted in the `blocked` comment ("no endpoint returns it", "no job
        populates that table", "the policy would have to allow it").
      - **Find its card** — in Backlog, via the key the comment names, or as a graph story with no card
        (§ B.3). (A `follow-up` card in Human-gated is not yours to release: name it under § G.3 as the
        human decision that would clear the blocked card.) Release it **this cycle, ranked first** under
        § B.2, if the cap leaves room.
      - **No card exists** → create one in Backlog per § C, with the blocked card's own words as the
        evidence, the footprint you computed, and a line naming which card it unblocks. Release it if there
        is room, otherwise leave it in Backlog for the next cycle — it will rank first there too.
      - **Leave the blocked card in Blocked**, with one `watchdog` comment naming the releasing card and what
        it will clear. Do not bounce it now: the work it needs is not there yet, and a bounce just burns a
        session to reproduce the same message.
      - **Once that work reaches Done**, move the blocked card back to the column it was blocked in on that
        cycle, saying which release cleared it.

      **Base-red is work-gated.** A card whose `blocked` / `ci` comment says "Waiting on #N (base-red)" — CI
      on the base (`{{inputs.integration_branch}}` or `{{inputs.staging_branch}}`) is red for a reason
      unrelated to the card — waits on that bug, not on a person: rank #N first in this cycle's release
      (§ B.2) if it is not already in flight, leave the card in Blocked with one `watchdog` comment, and when
      #N is Done move the card to **Implementation** (rebase onto `{{inputs.integration_branch}}` and gate
      again), saying which release cleared it. Never move a base-red card to Human-gated.

      **CI infrastructure blocks are not retryable.** A `blocked` comment from CI Check saying the CI jobs
      never started — a billing or spending-limit annotation, no matching runner, a queue timeout — is not a
      transient failure, and bouncing the card only burns a run. It waits on the infrastructure, not on the
      card: leave it in Blocked with one `watchdog` comment naming the card that tracks the CI-infrastructure
      problem (find it in any column, or create one in Backlog per § C from the comment's own words — it is
      usually human-gated and moves on under kind 3; the cards waiting on it stay here). Move such a card
      back to **Implementation** only once CI runs again: a `CI_CHECK_NAME` run created after the block, on
      any branch, has jobs with executed steps (`gh run list --workflow <name> --limit 20`, then `gh api
      repos/<owner>/<repo>/actions/runs/<id>/jobs`). Say in the comment that CI is back and the PR needs a
      fresh CI run. This block is not a return to Implementation and does not count toward the CI loop cap
      or the 2-retry cap.

      **3. Human-gated — MOVE IT TO THE `Human-gated` COLUMN, and never triage it again.** A missing
      third-party credential or access grant, a permission the pipeline deliberately lacks, a product or
      scope decision ({{inputs.product_owner}}'s), a legal ruling, a requirement no assumption can settle.
      **A Verify card blocked on a missing `UAT_*` / `STAGING_BASE_URL` config item is human-gated** — a
      person provisions those.

      The move is the whole point of that column, and it is not optional. Left in Blocked, these cards get
      *"do not retry"* re-derived every two hours forever, and crowd Blocked until it stops meaning "the
      pipeline is stuck". Before moving, leave one `blocked`-tagged comment naming what is missing and from
      whom — and if the blocking agent's comment already says both, say nothing and just move it. After the
      move the card is out of your loop: § G.4 lists it, and nothing else you do touches it.

      **Both kinds that remain in Blocked come back on their own**, which is the test for whether a card
      belongs there: retryable on your next cycle, work-gated when the naming card reaches Done (or CI runs
      again) and its `watchdog` fires. If neither is true, it is human-gated and it moves.

      **Procure-and-configure is the exception.** A card that is real work once the access exists stays in
      **Backlog** as a release candidate. The test: after the person answers, is there anything left to
      build? Yes → Backlog. The answer *is* the deliverable → `Human-gated`.

      Ambiguous between 2 and 3: if the missing thing is code someone here could write, it is work-gated; if
      it is a decision, a secret or an access grant, it is human-gated. Say which you chose and why.

      **Cap retries at 2 per blocker.** On the third, leave it in Blocked and say automatic retry is
      exhausted and it needs a human. A cause that recurs twice is not transient.

      Any kind: if a human has answered on the card since it was blocked — including a `credentials` or
      `decision` comment, or a decision that changed the rule the card was blocked under — move it back to
      its pipeline column regardless, **from `Human-gated` as readily as from Blocked**, and say so. That is
      the one time you touch that column's cards. (After Deploy is different: a person moves those cards out
      themselves, with an `ops_done` comment — you never do.)

      ## F. Signal discipline, with hard caps

      Comment only when **that card's situation changed**: you released, moved or reconciled it; you learned
      something genuinely new about it; a human replied and you acted. Never comment because you re-verified
      and everything matched — that belongs in the report.

      | Comment | Cap | Must contain |
      |---|---|---|
      | release | **≤ 5 lines** | tracker key or story id (if any), why it is independent of what is in flight, what it unblocks, assignee |
      | bounce / watchdog | **≤ 10 lines** | card, cause, attempt N of 2, that no run was in flight — or, on a work-gated block, the card that will clear it |
      | blocked | **≤ 15 lines** | what is missing, from whom, what you tried |

      The release cap is **per card and does not scale with the batch**: a full batch is that many
      five-line comments, not one long one and not a batch summary pasted onto every card.

      No cycle numbers in prose, no emoji headers, no minute-by-minute chronology, no restating what an
      earlier comment on the same card already says.

      **Never comment on a card sitting in `Human-gated` or `After Deploy (Human action)`.** It has not
      changed, and the report is where it is named.

      **One comment per card per blocker. Escalate once per blocker**, re-escalating only on changed
      severity or after **12 hours** with no human response. An escalation is a `chat_post_message` to the
      escalation channel (`ESCALATION_CHANNEL`) — or, when that is `unset`, the `blocked` comment and the
      column move alone. Escalations name the card id, title and tracker key or story id; product decisions
      go to {{inputs.product_owner}}, delivery and access questions to {{inputs.delivery_lead}}. Say in the
      message that the answer has to come back through Chat Intake with the word `triage`, or by moving the
      card.

      ## G. Report — fixed shape, ≤ 30 lines

      What someone reads to understand one cycle. Seven headings, one line per item, nothing outside them.
      The ceiling is 30 lines because a full batch needs one line per released card under **Released**
      alone; a cycle that releases two still costs two lines, not thirty.

      1. **Released** — card ids with their tracker keys or story ids, one clause on why they are mutually
         independent, **what each unblocks and whether that count was read or estimated** (§ B.2,
         blocked-card ids where it applies), where each came from (a Backlog card, the graph frontier, or
         off-graph), the `Base: #N` line when one was written, and whether tracker links were checked for it.
      2. **Assignment** — who got what, the card the rotation was read from, and any agent member skipped as
         failing.
      3. **Skipped** — eligible-looking card → the dependency or footprint that excluded it (name it when the
         footprint belongs to an After Deploy card; `waits for merge of …` when two dependencies are
         unmerged); Backlog cards left alone → why (too young, parked, stub description, scope-shaped,
         duplicate key or id, unresolved dependency, gated by an open question, **or decided but held —
         name the tag or comment that holds it**). When the batch stopped short of the free slots, say
         which test stopped it. Say how many releases the § B.0 duplicate check stopped. If no tracker tool
         was available, one line saying tracker links were not read.
      4. **Blocked, Human-gated and After Deploy** — for **Blocked**: card → retryable / **work-gated** /
         base-red / CI infrastructure → what you did, retried (attempt N) or released/created the card that
         will clear it (id). Then, for **Human-gated**: anything you moved there this cycle with the person
         or decision it waits on, and **a one-line inventory of what is already sitting there with each
         card's owner** — ids and owners only, no re-classification and no per-card comments. Then, for
         **After Deploy (Human action)**: **a one-line inventory** — ids, assignee, and hours since the
         `ops_runbook` was posted. Nothing in either column ages out or retries, so those inventory lines
         are the only thing keeping a card from being invisible for weeks.
      5. **Needs Planning** — what is parked, and for how long.
      6. **Status drift** — card / key → what the board says → what the tracker, `sprint-status.yaml` or
         GitHub says → who owns the fix. An off-graph story released from `epics.md` belongs here too: the
         graph owes a regeneration. A `review` key belonging to a `Human-gated` or `After Deploy` card is
         not drift — omit it.
      7. **Escalated** — including an explicit line when you deliberately did not re-escalate or re-comment.

      Nothing to say under a heading → omit the heading.
    agent: planner_sm
    tools:
    - board_get_board_info
    - board_list_tasks
    - board_get_task
    - board_get_comments
    - board_get_task_assets
    - board_add_comment
    - board_update_task
    - board_move_task
    - board_attach_asset
    - board_manage_tags
    - board_create_task
    - board_list_members
    - board_list_gates
    - session_list
    - session_log
    - chat_post_message
    - promote_asset
    config_items:
    - PLANNING_DIR
    - SPEC_PATH
    - PR_MERGE_POLICY
    - ESCALATION_CHANNEL
    - INTAKE_CHANNEL
    - CI_CHECK_NAME
    - STAGING_DEPLOY_WORKFLOW
    - STAGING_BASE_URL
    - DESIGN_SOURCE
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
    sub_steps:
    - name: Build the dependency map from the board and the graph
      instructions: |-
        Collect every card's dependencies from (1) `Waits on #N` prefixes in its title and `Waits on #N` / `Waits on <KEY>` lines in its comments (including `Waiting on #N (base-red)` in `blocked` / `ci` comments), (2) explicit statements in its own description ("depends on", "after <KEY> lands"), and (3) when `PLANNING_DIR` is set, the `story,depends_on,cross_epic` CSV in `PLANNING_DIR/story-dependency-graph.md` — parse it, never re-derive it from `epics.md`; edge `A → B` means B depends on A; map graph ids `E.S` to `sprint-status.yaml` slugs and to their cards (title starts with `E.S `, tag `story-E.S`) explicitly. Read `sprint-status.yaml` read-only; never write it. Resolve each `#N` / key / id to its card by searching every column. Edges are transitive. A dependency is satisfied when its card is in **Done** (no card: its story key reads `done`, or its ticket is done); a `done` key with a live card is drift, not satisfied; anything you cannot resolve is unsatisfied — skip the card and say why. With `PR_MERGE_POLICY` = `human`, at most one satisfied-but-unmerged dependency per released card, written as `Base: #N (<branch>)` in its description; two or more → skip (`waits for merge of …`). With `agent`, Done means merged. Do not invent edges from guesswork.
      required: true
    - name: Read tracker "is blocked by" links, read-only, if a tracker tool is available
      instructions: |-
        If a Backlog card's title carries a tracker key and a tracker tool is available in this session, read that ticket: its "is blocked by" links (add them to the map), its status, and — for cards you release this cycle — its description and acceptance criteria. A blocking key with no card on the board is satisfied only if its ticket is done. You never edit, comment on or transition a ticket. **No key or no tracker tool → skip this sub-step, do not guess links or statuses, and say once in the report that tracker links were not read this cycle.**
      required: true
    - name: Count work in flight against the cap
      instructions: |-
        Drop any row with `archived: true` first — an archived card holds no slot. Count cards sitting in Tech Design → Verify. **Cards in After Deploy (Human action), Blocked and Human-gated hold no slot** — they wait on a person — but After Deploy cards' footprints still count for every collision check (their PR into `{{inputs.integration_branch}}` is still open). Release only up to the difference from the **{{inputs.wip_cap}}-card cap** — both the ceiling on work in flight and the most you may release in one cycle. A full pipeline means release nothing. **Free slots are a ceiling, never a quota:** never pad a batch. The board is ground truth: a mismatch between the board, the tracker, `sprint-status.yaml` and open PRs is drift to report, never to fix.
      required: true
    - name: Select the independent batch
      instructions: |-
        Drop any row with `archived: true` first. Candidates: **Backlog cards**, plus — when `PLANNING_DIR` is set — **frontier stories** (status `backlog` or no key, every graph ancestor done, no card anywhere, no open PR, no `Gated by:` an open question) and off-graph stories in `epics.md` (no status key, no graph node; report them as off-graph). Each needs every dependency satisfied and an actionable spec; leave alone a card younger than one cycle (check `session_list`), one with a `needs-human` / `blocked` / pending-`credentials` marker, a stub, or a scope-shaped card. Read each Backlog card's latest `decision` comment: a settled decision outranks a stale description — reconcile it (`## Decision — <date> (comments <ids>)` on top, stale text under `## Superseded (kept for history)`, delete nothing) before moving. Procure-and-configure cards stay in Backlog until their access exists.

        Pick up to the free slots with no dependency path between any two, pairwise disjoint footprints, and no collision with anything in flight **or in After Deploy (Human action)**. **The pairwise tests bound the batch, not the cap** — *n* candidates are *n(n−1)/2* pairs; check them in rank order. Rank by what a card unblocks (§ B.2): Blocked cards it frees (work-gated, base-red), then transitive dependants, then pending work assuming it; ties → priority, `bug`, keystone / critical path / wave when the graph has them, oldest. Say whether each count was counted or estimated. Release only into **Tech Design**. **Never take from Needs Planning, Human-gated or After Deploy (Human action).** Nothing eligible → release nothing, one line.

        **One pool, fill every free slot.** The Backlog cards, the graph frontier and the off-graph stories are **one candidate pool**, not a ladder you climb only when a rung is empty — the frontier is never empty, so a ladder never reaches Backlog. Rank the whole pool by § B.2, walk it in rank order and test each candidate against what is in flight, After Deploy, and what you have already picked; **a collision skips that candidate, it never ends the cycle.** Stop when the free slots are filled or the **candidate budget** is spent: test at most the free slots + 10 candidates, in rank order, and derive footprints only for those. Stopping with free slots left is allowed when the budget is spent — say so in the report — or with each refused candidate named in the report with the exact card and file it collided with, or the eligibility rule it failed. Within the budget, "not read" or "not checked" is never a reason for a refusal. Free slots are still a ceiling, never a quota: a colliding or ineligible card is never released to fill one.

        **A footprint is a list of files, not an area.** Two cards collide only when both would edit the **same file** — or, for a shared generated file the repository's docs say merges cleanly per section, the same section. "The billing module", "the API package", "the background workers" are areas, not footprints: never refuse a candidate on an area label. Take each side's file list from the `paths:` line, the footprint in the description, or the branch diff. For a candidate with none, derive it from its spec and the code — the controllers, models, services, jobs, pages, components, migrations and tests it would edit — at file level, at worst one directory deep. Files both sides only read or only call are not a collision. A refusal names the shared file(s) and the card holding them.
      required: true
    - name: 'One piece of work, one card: search every column before creating or releasing'
      instructions: |-
        For every card you are about to create or release, list the tasks of every column, including Human-gated, Blocked, Needs Planning, After Deploy (Human action) and Done. Another card whose title contains the same `<KEY>` or starts with `<story-id> ` (`… follow-up:` is a different card), or that carries the tag `<KEY>` / `story-<story-id>`, means create and release nothing new: release the existing card if it is the releasable Backlog card, otherwise name both in the report. No key or id → compare titles and descriptions and say the match was by text. Also skip work with an open PR or branch (`gh pr list --search …`) whose card is not past Backlog — drift to report — and work whose card is tagged `superseded` or whose latest `decision` comment cancels it. List with `include_archived: true`: an archived card for the same work counts — create and release nothing for it and name the archived card in the report. Write in the report how many releases this check stopped.
      required: true
    - name: Create missing cards in Backlog
      instructions: |-
        You create a card only for a frontier or off-graph story with no card (§ B.3) or for work a Blocked card is waiting on that has no card (§ E). Run § B.0 first. Create in Backlog with `assignee_id` set at creation (rotation over the board's agent members, skipping failing ones), title `<story-id> <title>` / `<KEY> <title>` / a plain imperative title, tag `story-<story-id>` or `<KEY>`, and a description carrying the acceptance-criteria summary, the spec path, the card it unblocks (if any) and the footprint you computed. Never write to the tracker or the repository. Nothing to create → skip.
      required: false
    - name: Move released cards to Tech Design
      instructions: |-
        For each released card: set the assignee round-robin over the agent members from `board_list_members`, continuing from the most recently created assigned card (skip a member whose latest run shows one of these signs — "Quota exceeded", "login has expired", "no output for 30 minutes" / a spend-limit dialog, or a run cancelled with 0 steps (an ordinary cancel after steps ran does not count); all failing → assign by rotation and say so), add the footprint and any `Base: #N (<branch>)` line to its description, then move it Backlog → **Tech Design**. Entry fires that workflow immediately, so the card must be complete first. One ≤ 5-line release comment per card. Nothing released → skip.
      required: false
    - name: Watchdog cards stuck in an automated column
      instructions: |-
        Confirm no run for the card is still in flight (`session_list`, `session_log`) — a long step is not a stuck one, a missing run is not a finished one, and a card in CI check is usually waiting on its gate (`board_list_gates`; a `stale` gate is a human's call). A session dead on a quota/spend error → hand the card to the next healthy agent member. Then bounce Backlog → its column. Two `watchdog` comments already on the card → `blocked` comment, escalate once (`ESCALATION_CHANNEL`, board only when `unset`; never the intake channel), move to Blocked rather than a third bounce. Never watchdog a card in After Deploy (Human action).
      required: true
    - name: 'Triage Blocked: retryable, work-gated, human-gated → Human-gated'
      instructions: |-
        Read every `blocked` comment and classify it.

        **Retryable** — the environment (expired machine window, no Docker, unusable clone, a run that died, staging briefly unreachable, a `STAGING_DEPLOY_WORKFLOW` run that failed on a transient) → back to the column it was blocked in, naming cause and attempt. Cap 2 per blocker; on the third, leave it and say retry is exhausted.

        **Work-gated** — code that does not exist yet another card or story owns → find or create (§ C) its card and release it this cycle, ranked first, if the cap allows; leave the blocked card in Blocked with one `watchdog` comment naming it; when that work reaches Done, move the card back. **Base-red** ("Waiting on #N (base-red)") is work-gated: rank #N first, watchdog, and when #N is Done move the card to Implementation (rebase onto `{{inputs.integration_branch}}`, gate again). Never to Human-gated.

        **CI infrastructure** — a CI Check `blocked` comment saying the jobs never started (billing, no runner, queue timeout) is not retryable: leave it in Blocked with one `watchdog` comment naming the CI-infrastructure card; move it back to Implementation only when a later `CI_CHECK_NAME` run on any branch has executed jobs, saying the PR needs a fresh run. Not counted as a return or a retry.

        **Human-gated** — credential, access grant, a permission the pipeline lacks, a product or scope decision ({{inputs.product_owner}}), a legal ruling; a Verify card missing a `UAT_*` / `STAGING_BASE_URL` config item → one `blocked` comment naming what is missing and from whom (skip it if the blocking comment already says both) and **move it to Human-gated**; never triage that column. Procure-and-configure work stays in Backlog. Ambiguous → code someone here could write is work-gated; a decision, secret or access grant is human-gated; say which and why. A human's answer since the block → move it back to its pipeline column, from either column. **Never touch After Deploy (Human action).**
      required: true
    - name: Write the cycle report
      instructions: |-
        Seven headings — Released, Assignment, Skipped, Blocked / Human-gated / After Deploy, Needs Planning, Status drift, Escalated — one line per item, ≤ 30 lines total; omit any heading with nothing under it. Under heading 4, include the one-line inventories of Human-gated (ids + owners) and After Deploy (Human action) (ids, assignee, hours since `ops_runbook`). If no tracker tool was available, say once that tracker links were not read. No cycle numbers, no emoji headers, no chronology.
      required: true
- key: scope_change
  name: Scope Change
  description: |-
    Bound to the Needs Planning column. Owns changes to what the product is. Handles three kinds of card: oversized asks parked by Chat Intake or the Planner, which it checks against the product spec (SPEC_PATH), the planning artefacts (PLANNING_DIR), the tracker ticket and the code on the integration branch, then closes as already covered, slices into Backlog cards with acceptance criteria and acyclic dependencies (plus stories and graph edges when PLANNING_DIR is set), or escalates as a product decision to Human-gated; bug reports filed by Chat Intake or a person (tag bug-report), triaged as duplicate, not a bug, a bug for Backlog, or a decision for Human-gated; and Spec update cards filed by Merge and deploy, for which it amends the spec through a docs/spec branch and a PR into the integration branch, or files a bug when the code drifted. Records every outcome as a decision comment, never writes to the tracker, and merges its PR itself only when PR_MERGE_POLICY is agent and CI is green. The Planner releases the new cards on its next cycle.
  base:
    repositories:
    - app
  steps:
  - key: slice_the_ask
    name: Slice the ask & record the decision
    instructions: |-
      ## Archived cards

      Ignore archived cards: drop any board row with `archived: true` before acting on it, and if the card this run was started for is archived, do nothing and end with a one-line report. Duplicate checks are the exception: look with `include_archived: true` — archiving is a person's "not doing this", so an archived card for the same work means create nothing; name it in the report.

      ## Task

      A card sits in **Needs Planning**. It is one of three kinds — read the title and tags first:

      - **An ask** parked by Chat Intake (or moved here by the Planner) because it is too large to enter the
        pipeline as-is → sections 1–4: turn it into planned work, or establish that it should not be built.
      - **A bug report** filed by Chat Intake or by a person (tag `bug-report`) → section 5: triage it.
      - **A spec update** (title `Spec update:`, tag `spec-update`, filed by Merge and deploy after a spec
        check found drift) → section 6: change the product spec in the repository.

      **You are the only agent that changes the product's scope, and the only one that edits the product
      spec and the planning artefacts.** Everything downstream executes a plan; you change what the plan says.
      A card you create will be built, tested, deployed and paid for.

      You never write to the tracker (no comments, no transitions). You write to the project repository
      (`/workspace/repo`) **only** for the product spec at `SPEC_PATH` and, when `PLANNING_DIR` is set, for
      `epics.md` and `story-dependency-graph.md` there — always on a `docs/spec-…` branch and through a PR into
      `{{inputs.integration_branch}}` (section 6). Never `sprint-status.yaml`: its only writers are
      Implementation and Verify. Read `CLAUDE.md`, `AGENTS.md` and `CONTRIBUTING.md` at the repository root —
      whichever exist — before changing anything; they are binding. Your other outputs are board cards,
      comments and, where needed, a note that a tracker ticket needs updating by a human.

      **Chat.** If the card came from a chat message (its description or a comment links the thread), every
      message about it is a reply in that thread. A new top-level message goes only to the escalation channel
      (`ESCALATION_CHANNEL`) and only for an escalation (a card you move to Blocked or Human-gated). When the
      channel is `unset`, escalate on the board only — comment plus column — and do not report "message not
      sent" as a finding. Never mention the Flow bot yourself: a mention starts a workflow. A human's answer
      reaches the board only when it is said to Chat Intake on the intake channel with the word `triage`, or
      when a human moves the card; say so when you ask.

      ## Inputs

      The card and **all** its comments — Chat Intake quoted the original message and linked the thread, and
      that quoted text is your mandate; nothing beyond it is. Then, in this order of precedence:

      1. **The product spec** at `SPEC_PATH`, read on `{{inputs.integration_branch}}` (`{{inputs.staging_branch}}`
         is a test branch; a spec change only there is not in force yet). `unset`, or missing on that branch →
         write `spec: not available` in your comment and rely on 2–5. Read each requirement with every
         `[AMENDED …]` / `[NEW …]` block under it; a later block beats the text above it. Open questions are
         recorded in the spec; a requirement that cites one is gated. When `PLANNING_DIR` is set, also
         `epics.md`, the `story,depends_on,cross_epic` CSV in `story-dependency-graph.md` and
         `sprint-status.yaml` (read-only) there.
      2. **The tracker ticket**, when the card title carries a tracker key (`PROJ-123`) and a tracker tool is
         available in the session: description, acceptance criteria, parent epic, linked tickets. Read it;
         never write to it.
      3. **The repository's own docs**: `CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md`, `docs/`, the architecture
         docs.
      4. **The code on `{{inputs.integration_branch}}`** — what the product has. Check the ask against the
         code, not only against documents: what the product does today is in the code, and documents lag
         behind it. Say what you checked (`git log` / `git grep` on `origin/{{inputs.integration_branch}}`,
         file paths). Something on `{{inputs.staging_branch}}` but not on `{{inputs.integration_branch}}` is
         **not shipped** — it is covered only if a card carries it (in flight, or in Done with its PR still
         open under `PR_MERGE_POLICY` `human`); name the card. An orphan commit on the staging branch covers
         nothing.
      5. **The board**: every card in every column, including Done and Human-gated, and the `decision`
         comments on the card and on linked cards.

      A product decision by `{{inputs.product_owner}}` beats an engineering ruling.

      ## 1. Decide before writing (asks)

      **Already covered** — an existing card, a tracker ticket, a story in `epics.md`, a spec requirement, or
      **shipped code on `{{inputs.integration_branch}}`** handles it (or a card in the pipeline carries it).
      Say which, with card ids, tracker keys, story ids, spec section and file paths; close the card; change
      nothing. Most large-sounding asks land here.

      **In scope, unsliced** → section 2. Additive scope inside an existing epic is routine.

      **A product decision** — a new epic, a changed dependency on existing work, a change to a commitment in
      the spec, the plan or a tracker ticket, something that contradicts a recorded decision, moves cost or
      timeline materially, depends on an open question recorded in the spec, or is too vague to formalise
      without guessing → **escalate, do not decide.** `blocked` comment + escalation stating the decision
      needed, who decides (product: `{{inputs.product_owner}}`; delivery, access or credentials:
      `{{inputs.delivery_lead}}`), the options and their cost in cards + card to **Human-gated**. Chat Intake
      brings the answer back when it arrives. A feature that exists only in the design source
      (`DESIGN_SOURCE`) and in no spec requirement is a product decision, not a slice.

      **Formalise, never invent.** Every card you add traces to a specific sentence in the quoted ask. A card
      that would merely be *nice* is scope nobody requested on top of the committed plan. If you cannot say
      when it is done, it is not a card yet; ask one sharp question in the thread and stop.

      ## 2. Slice it into Backlog cards

      **Cards** — each independently buildable: its own acceptance criteria (Given/When/Then), its own
      `Depends on:` line (card ids), in the epic it belongs to, with a footprint (the files or modules it will
      touch) so the Planner can keep released batches disjoint. If the work comes from a tracker ticket, the
      card title carries that key and the description says which part of the ticket it is; otherwise the card
      description is its spec. If the ask mentions a screen, put the link into the design source on the card;
      a *big* UI change (new screen or panel, new pattern or component, changed navigation or flow) with no
      design in the design source is still sliced, and the card says `Design: needed` so Design routes it to
      Human-gated with `design-needed` instead of inventing it — a *small* one (a new state, copy, a field in
      an existing component) is decided from the existing components. Known edge cases go into a
      `## Edge cases` block in the description, each bullet marked `(Scope Change)`.

      Create the cards in **Backlog**. Leave `assignee_id` empty; the Planner assigns and releases them. Do
      not move them out of Backlog yourself.

      **Dependencies** — state them on the new cards. **Never retitle or re-key an existing card**, and
      **never rewrite an existing card's dependencies to fit yours.** Check that the result is still acyclic
      and say so: a cycle deadlocks the Planner, which will simply report nothing runnable.

      **When `PLANNING_DIR` is set, the plan too.** The same slice lands as stories in `PLANNING_DIR/epics.md`
      and edges in `PLANNING_DIR/story-dependency-graph.md`, in the same PR as any spec change (section 6):

      - **Stories** — stable `E.S` ids, the next free number in their epic; acceptance criteria; the spec
        requirement ids they realise; `Depends on`; a `Gated by:` line naming every open question recorded in
        the spec that they wait on (none → `Gated by: none`); and, when `DESIGN_SOURCE` is set, a
        `Design source screens:` line (`none` for a story without UI).
      - **The graph** — add nodes and edges to the `story,depends_on,cross_epic` CSV (edge `A → B` means B
        depends on A), mark cross-epic edges, place the stories in a wave. **Never renumber an existing
        story** — ids are stable labels that `sprint-status.yaml`, the board and every past comment refer to —
        and never rewrite an existing story's dependencies. Verify the result is still acyclic and say so.
      - **The cards** carry the tag `story-<id>` and a `Story: E.S` line, so the Planner does not create a
        second card for the same story from the graph frontier. A bug is a card, not a story: it never enters
        `epics.md`.
      - **`sprint-status.yaml`** is not yours: Implementation adds a story's key when it cuts the branch and
        Verify marks it `done`; never seed or regenerate it. If a story lands in an epic the file shows as
        `done`, say so in the close comment (`epic <E> shows done — reopened by <E.S>`) so a human corrects the
        epic line.
      - Before the first file change, a comment tagged `branch`: `branch: docs/spec-<card-id>-<slug>`,
        `base: {{inputs.integration_branch}} @ <sha>`, `stage: Scope Change`, `paths: <files you will touch>`.
        Then land it as in section 6.

      ## 3. Record the decision

      Post a comment tagged `decision` on the card: the ask in one line, what you decided (covered / sliced /
      needs a decision) and why, with sources (spec section, tracker key, story id, file and section on
      `{{inputs.integration_branch}}`, comment id).

      **When the scope of a tracker ticket changes** — the slicing splits it, adds to it, narrows it, moves an
      acceptance criterion between cards, or lands work under an epic the tracker already shows as done — say
      in that same comment, on its own line: `Tracker update needed (human): <KEY> — <what to change>`. Never
      edit the tracker yourself. **When the ask changes what the product spec says**, also create a
      `Spec update:` card (section 6 format) in Backlog and move it to Needs Planning with an assignee, so the
      spec is changed by its own run — a card in Needs Planning with no assignee never starts its workflow.

      After slicing, one reply in the source thread (or, with no thread, one message in the escalation
      channel; `unset` → the close comment is the notice): what it changes, what it costs in cards, which
      existing work it delays, and which tracker tickets need a human update. A notice, not a request — do not
      wait for an answer.

      ## 4. Close (asks)

      Comment tagged `scope_change`: outcome on the first line (`COVERED` / `SLICED (n cards)` /
      `NEEDS DECISION`); card ids, titles and epics added (story ids and edges when `PLANNING_DIR` is set) and
      confirmation the dependencies are still acyclic; tracker tickets that need a human update, or `none`;
      spec sections touched and the PR link, or `none`; **what this costs** in cards and which existing work
      it delays if it sits on the critical path; what the Planner will do next.

      Covered, or sliced into Backlog (with the plan PR merged, or left open for a person under
      `PR_MERGE_POLICY` `human` — link it) → **Done**. Needing a decision → **Human-gated**. A plan PR you
      could not land (section 6) → **Blocked**.

      ## 5. Bug reports (`bug-report`)

      The card holds one defect a person reported — through Chat Intake (the message quoted, the thread
      linked, screenshots attached) or as a hand-made card. It may name the card whose work it concerns
      (`Fixes #M`). Check it against that card's acceptance criteria and `## Edge cases`, the spec, the code on
      `{{inputs.integration_branch}}` (and, for what the reporter saw, the sha deployed on staging from
      `{{inputs.staging_branch}}`), and the open cards. Exactly one outcome:

      - **Duplicate** — an open card already covers it → comment on that card with the new evidence, comment
        `decision` here naming it, card → **Done**. If the duplicate is not linked to the source card yet, add
        `Fixes #M` to its description. A defect in a card still in flight (not yet Done) takes this route too:
        the evidence goes on that card, whose own stage acts on it.
      - **Not a bug** — the behaviour is what the spec, the acceptance criteria or a recorded decision say →
        comment `decision` with a **Source:** line, reply in the report's thread, card → **Done**.
      - **A bug** → make the card well-formed (bug form: **What's wrong / Where / Evidence / Steps to
        reproduce / Expected / Done when**, `task_type: bug`, tags `bug` and `bug-report`, `Fixes #M` kept in
        the description when known, a footprint), comment `decision`, card → **Backlog**. The Planner releases
        it.
      - **Needs a decision** — the fix needs a product choice → bug form plus the options and who decides,
        tag `needs-human-decision`, escalation, card → **Human-gated**.

      ## 6. Spec updates (`Spec update:`)

      The card names a spec section and its current text, what the deployed code does (files, route), the
      source card and its tracker key. Decide:

      - **The code is right, the spec lags** (the source card's acceptance criteria or a recorded decision
        changed the behaviour) → amend the spec.
      - **The spec is right, the code drifted** → do not touch the spec: create a bug card in Backlog (bug
        form, `Fixes #<source card>`), comment `decision`, card → **Done**.
      - **Unclear which is right** → product decision: escalation, card → **Human-gated**.

      **Amending the spec** — the spec is the file at `SPEC_PATH` in the project repository:

      ```
      git fetch origin
      git checkout -b docs/spec-<card-id>-<short> origin/{{inputs.integration_branch}}
      # edit the file at SPEC_PATH: never rewrite a requirement in place — add a block directly under it:
      #   [AMENDED <YYYY-MM-DD> — card #<id>, source card #<id> / <tracker key>] <the new text>
      # a new requirement goes in the right section as [NEW <YYYY-MM-DD> — card #<id>] <text>
      # PLANNING_DIR set: the matching story and graph changes (section 2) go in the same commit
      git commit -m "docs(spec): [<tracker key or card id>] <what changed>"
      git push -u origin docs/spec-<card-id>-<short>
      gh pr create --base {{inputs.integration_branch}} --title "docs(spec): <what changed>" --body "<card link, sections, why>"
      ```

      The spec file does not exist on `{{inputs.integration_branch}}` yet → do not create it; escalate
      (`base-gap`) and move the card to **Human-gated**. Never push to `{{inputs.integration_branch}}`,
      `{{inputs.staging_branch}}` or `main` directly; never force-push; never merge the branch into the staging
      branch — the change is in force when the PR merges.

      **Landing the PR** (spec and plan PRs alike):

      - `PR_MERGE_POLICY` is `agent` → `git pull --rebase` onto `origin/{{inputs.integration_branch}}` and push,
        so the checks run against today's base; read the conclusion of `CI_CHECK_NAME` for the PR's **current
        head sha** (`gh pr checks <n>`); `queued` / `in_progress` → wait; a missing run is never green.
        `success` → merge it (`gh pr merge`). A failing job whose output names a file your PR changed is
        **yours**: fix it on the branch and go back to the rebase. A failing job that names only files you did
        not touch was red on the base before you (`base-red`) → merge anyway and name the job and the file in
        the close comment. Cannot get it green, or the checks never resolve → `blocked` comment naming the
        failing job + escalation + card → **Blocked**.
      - `PR_MERGE_POLICY` is `human` → leave the PR open for a person; name it in the close comment, and the
        card still closes.

      Then: comment `scope_change` with the sections changed, the PR link and, when merged, the merge sha →
      card → **Done**.

      **Never leave the card in Needs Planning** — one that stays is indistinguishable from one nobody has
      looked at.
    agent: scope_manager
    tools:
    - board_get_board_info
    - board_list_tasks
    - board_get_task
    - board_get_comments
    - board_get_task_assets
    - board_add_comment
    - board_update_task
    - board_move_task
    - board_attach_asset
    - board_manage_tags
    - board_create_task
    - board_list_members
    - chat_post_message
    - promote_asset
    config_items:
    - SPEC_PATH
    - PLANNING_DIR
    - CI_CHECK_NAME
    - PR_MERGE_POLICY
    - ESCALATION_CHANNEL
    - DESIGN_SOURCE
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
- key: tech_design
  name: Tech Design
  description: |-
    Bound to the Tech Design column. Produces an implementation-ready technical spec as a `tech_design` comment on the card — the acceptance criteria restated, the technical approach grounded in the project repository on `{{inputs.integration_branch}}`, the edge cases, the tests per criterion, a per-criterion Verification plan and, when a design source (`DESIGN_SOURCE`) is configured, the screens of the design source the story builds or changes — then routes the card: to Design when the UI change is big or the design source lacks a screen the story needs, otherwise straight to Implementation. A stub spec, a gated requirement or a product question goes to Human-gated for {{inputs.product_owner}}; an unmerged dependency or an unanswerable engineering question goes to Blocked.
  base:
    repositories:
    - app
  steps:
  - key: tech_design_spec
    name: Tech design / spec
    instructions: |-
      ## Archived cards

      Ignore archived cards: drop any board row with `archived: true` before acting on it, and if the card this run was started for is archived, do nothing and end with a one-line report. Duplicate checks are the exception: look with `include_archived: true` — archiving is a person's "not doing this", so an archived card for the same work means create nothing; name it in the report.

      Write the implementation-ready spec for the attached card. The output is a **technical spec posted as a comment on the card, tagged `tech_design`** — do not write spec, plan or planning-artefact files into the repository.

      ## Inputs

      - The card, its tags, and every comment already on it — a previous block may have been answered there.
      - **The spec**, in this order of precedence (a later source never overrides an earlier one; a product decision by {{inputs.product_owner}} beats an engineering ruling):
        1. the product spec at `SPEC_PATH` and, when `PLANNING_DIR` is set, the planning artefacts there — `epics.md` (the story by its id `E.S`, its acceptance criteria and the requirement ids it realises), `story-dependency-graph.md`, `sprint-status.yaml` (read-only here). Read each requirement together with every `[AMENDED <date>]` / `[NEW <date>]` block under it — a later block beats the text above it. `unset` or missing → `spec: not available`;
        2. the tracker ticket: if the card title carries a tracker key (`PROJ-123`) and a tracker tool is available in the session, the ticket — description, acceptance criteria, parent epic, links — is the spec; otherwise the card description is the spec. Agents never write to the tracker (no comments, no transitions);
        3. the repository's own docs: `CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md`, `docs/`, the architecture and testing-strategy documents;
        4. `decision` comments on the card and on the cards it links.
      - **The project repository**, checked out at `/workspace/repo`. Read `CLAUDE.md`, `AGENTS.md` and `CONTRIBUTING.md` at the repository root — whichever exist — before anything else; they are binding. Ground every decision in real files on `{{inputs.integration_branch}}` (see *Code is read on the integration branch* below). Use Context7 for library documentation and the project's skills, if any are attached.

      **Gated stories.** A requirement that cites a question still open in the spec (an open question recorded in the spec, or a `Gated by:` line on the story) is not buildable — do not design or build past the gate: `blocked` comment naming the question and who answers it ({{inputs.product_owner}}), escalation, **Human-gated**. A card whose description is a stub — a title and nothing a developer could build from, with no tracker key and no story id — is handled the same way: say what the spec must contain before the card can enter the pipeline.

      **Conventions.** Follow the conventions in `CLAUDE.md`, `AGENTS.md` and the architecture docs; where they are silent, follow the patterns the repository already uses. Every schema change ships as a committed, reversible migration generated the repository's documented way; two leaf migrations after a rebase or merge are a conflict to resolve the framework's documented way — never edit a migration that is already on `{{inputs.integration_branch}}`.

      ## What the tech design contains

      Attach the tech design as a comment tagged `tech_design`. Cover, for the parts of the repository the card actually touches, with real file paths:
      - **Context**, and the requirement ids (FR-n) the story realises when `SPEC_PATH` or `PLANNING_DIR` names them;
      - **Acceptance criteria** restated as checkable items, quoted from the spec;
      - **Technical approach**: data model and migrations; server-side modules — endpoints, authorisation checks, serialisation, background jobs; the API contract change and the matching update of the API description the repository keeps, if any; the client side — routes, components (existing ones first), data-fetching hooks, the project's formatting helpers for numbers, money and dates (never ad-hoc formatting); any CLI, SDK or tooling package the card touches;
      - **Files to touch**;
      - **Edge cases** (below);
      - **Test plan**: the tests that prove each acceptance criterion — the tests the repository's testing conventions require;
      - **Architecture-doc impact:** `none`, or which architecture document the implementation PR must update and why, when the repository's docs require it. The update itself happens in the PR, not here;
      - **Design source screens**, when `DESIGN_SOURCE` is set (below);
      - **Verification plan** (below);
      - **Risks and open assumptions**, tagged per the rules below.

      ## Edge cases are part of the contract until Code Review

      Edge cases live in the **card description** under a `## Edge cases` heading — one bullet each: the case, the expected behaviour, and `— added by <stage>`. When you find one the acceptance criteria do not cover, **append** it there with `board_update_task` (add the heading at the end of the description if it is missing; append only — never reword, reorder or delete an existing AC or bullet) **and** post a comment tagged `edge-case` with the same text.

      Edge cases added up to and including **Code Review** belong to this card: Implementation builds and tests every one of them, Code Review checks each is handled, Verify walks each. An edge case found **after** Code Review (in Verify or later) does not enter the contract — it is a bug card.

      In the tech design, list the edge cases you see (empty data, the role that must be refused, limits, a source with no data, concurrent edits) and append each one the ACs do not already cover.

      ## Code is read on the integration branch

      `{{inputs.integration_branch}}` is the source of truth: stories branch from it and PRs target it. `{{inputs.staging_branch}}` is the branch that deploys staging; it carries work that is being verified and, when `PR_MERGE_POLICY` is `human`, work that is accepted but not merged yet. **Nothing builds on `{{inputs.staging_branch}}`.** Read existing code on `origin/{{inputs.integration_branch}}` (`git cat-file -e origin/{{inputs.integration_branch}}:<path>`, `git log origin/{{inputs.integration_branch}} -- <path>`); never treat code that is only on `origin/{{inputs.staging_branch}}` as shipped, never copy it into the branch, never merge `{{inputs.staging_branch}}` into it.

      When the card needs something that exists only on `origin/{{inputs.staging_branch}}`, it belongs to another card that is not merged yet, and that card is a **dependency like any other**. Find it (`git log origin/{{inputs.integration_branch}}..origin/{{inputs.staging_branch}} -- <path>` names the commits and their branch; the owning card has a `branch` comment or a PR) and post `Waits on #N` in a comment:
      - #N is in **Done** → when `PR_MERGE_POLICY` is `agent`, Done means merged and this card branches from `{{inputs.integration_branch}}` as usual; when it is `human`, this card stacks on #N's branch — the Planner records `Base: #N (<branch>)` in the description and Implementation branches from it. Name the base in your comment so nobody has to rediscover it;
      - #N is anywhere else → this card cannot proceed yet: `blocked` comment `Waiting on #N` naming the files it needs, escalation, **Blocked** (work-gated: the Planner brings the card back when #N reaches Done).

      No card carries the code → it is not a dependency you can wait on: spec the work as if that code did not exist and name the overlap under Risks.

      `main` / the production branch is released only by a human; no stage touches it.

      ## Design source screens — for every story with UI, when `DESIGN_SOURCE` is set

      `DESIGN_SOURCE` is where the UI contract lives: a design file (a Figma file or similar — a usable link points at a specific frame or screen, not at the whole file), a deployed reference build of the UI, or a `DESIGN.md` path in the repository; `unset` = the existing component library and current screens, and this section is skipped. Read it as far as this step can reach it: a design file through its link on the card, the tracker ticket or its epic, or the exports attached to them; a reference build by its routes, as far as you can read it without a browser (read-only — never create an account on it or submit a form that changes its data); a `DESIGN.md` on `{{inputs.integration_branch}}`. The Design stage has the browser and verifies and screenshots every screen you name; do not guess at a screen you could not open — say so.

      Add a `## Design source screens` section to the `tech_design` comment: for each screen the story builds or changes, its link or route in the design source and what the build must reproduce — fields and their labels, table columns, filters, actions, empty / loading / error states, and where the screen is reached from. Then **Divergences**: every point where the spec differs from the design source, with the requirement id — **the spec wins and the divergence is named**. A feature the design source has and the spec does not is not in scope for this story — note it, do not build it. Then **Missing screens**: every screen or state the story needs that the design source lacks — what it must show and do, from the spec, and the nearest existing screen to model it on (`Missing screens: none` when the source has everything). Do not design them: the Design stage does, and a person approves them. A story with no UI → `Design source screens: none (no UI)`.

      ## How Verify will reach each acceptance criterion

      Before routing, add a **Verification plan** section to the tech design: one row per AC — the staging route (under `STAGING_BASE_URL`) or API entrypoint, the account that walks it (`UAT_LOGIN` / `UAT_PASSWORD` for an ordinary user, `UAT_ADMIN_LOGIN` / `UAT_ADMIN_PASSWORD` for an administrator, or a role the team added as `UAT_<ROLE>_LOGIN` / `UAT_<ROLE>_PASSWORD`), the data it needs, and where that data comes from:
      - **already on staging** — name the record;
      - **created through the UI by Verify** — name the screens;
      - **needs a staging data step** — then this card ships it: an idempotent task (the repository's documented way to run one on staging) that creates only test-marked, card-namespaced data and is removable by a documented cleanup, plus an `ops_runbook` for the person who runs it. Implementation builds it as part of the card, so the card reaches Verify through **After Deploy (Human action)** with its data already there;
      - **needs an external callback, a secret or a vendor sandbox** (a webhook, a provider API key, an OAuth connection, an ingest token) — name the config item it needs and whether it exists; a missing one is raised now, in this comment, not discovered after deploy;
      - **needs a local machine or a device** (behaviour only observable outside the browser and the API — a CLI, a native app) — mark it `device`; Verify accepts the rest and lists the manual check in its comment.

      Credentials come only from the `UAT_*` config items; a role with no credentials is named as missing here — Verify goes Human-gated on it and never invents a value. Refer to config items by name only; never invent values. An AC no plan can reach is a finding in this comment, before any code is written.

      ## Routing

      - **Design** when the UI change is **big** — a new screen or panel, a new pattern or component the design system does not have, a change to navigation or to a flow (its steps, or which roles see it) — or when the design source has a screen for it that must be followed, or lacks a screen the story needs. Say which questions Design owns.
      - **Implementation** otherwise: a backend-only change, or a **small** UI change — a new state (empty, loading, error) of an existing screen, copy, a column, field or control inside an existing component — fully described by the ACs; name the existing components it uses.
      - A stub spec, a gated requirement, or a product or scope question only {{inputs.product_owner}} can answer → `blocked` comment (the question, the options, who decides) + escalation + **Human-gated**.
      - A missing credential or access grant → `blocked` comment + escalation + **Human-gated**; never invent a value.
      - A requirement genuinely unanswerable by assumption for an engineering reason, or a dependency that is not Done (above) → `blocked` comment + escalation + **Blocked**.

      **Chat.** When `ESCALATION_CHANNEL` is set, every escalation (a card you move to Blocked or Human-gated) goes to the escalation channel with `chat_post_message` — card id, title, what is needed, who decides. If the card came from a chat message (its description or a comment links the thread), every message about the card is a **reply in that thread**; a new top-level message is only for an escalation. Never @-mention the Flow bot yourself: a mention starts a workflow. When the channel is `unset`, escalate on the board only (the comment and the column) and do not report the missing message as a finding. A human's answer reaches the board only when it is said to Chat Intake in a message containing the word `triage` on the intake channel (`INTAKE_CHANNEL`), or when a person moves the card — say so when you ask.

      ---

      **A defect goes straight to Backlog; only a decision goes to Human-gated.**

      A non-blocking finding stays in your own comment: debt, a copy nit, a deviation the spec is silent on. That is enough in most cases. If it deserves its own card, decide which kind it is. Before filing either kind, check that no existing card or tracker ticket already covers it; if one does, cite it in your comment instead of filing.

      **A. A bug.** Behaviour that contradicts an acceptance criterion or the spec, an unmet AC, a failing or flaky test, a missing translation, a crash, a wrong figure, or a requirement already written in the spec that the code does not meet. Nobody has to decide anything; someone has to fix it.
      1. Create it in **Backlog**. Title: `<tracker key, story id or card id> follow-up: <what>`. `task_type: bug`. Tags: `follow-up` and `bug`, plus the epic and area. Leave `assignee_id` empty: the Planner assigns an agent when it releases the card. The description is the bug form: **What's wrong / Where** (route, file:line) **/ Evidence** (steps, screenshot, the card and comment it came from) **/ Done when**.
      2. **Leave it in Backlog.** The Planner releases it under rung 1. Do not move it to Human-gated and do not release it yourself.

      **Small decisions: apply your own recommendation.** When a finding needs a choice, you can name the options and you would recommend one, check whether the choice touches any of these:
      1. legal, compliance, privacy or consent text, disclosures, or anything a user accepts;
      2. money: pricing, billing, plan limits, fees, what anyone is charged or paid;
      3. something {{inputs.product_owner}} decided in writing — in the spec, the tracker ticket or a `decision` comment — or an approved design, that your recommendation would contradict or narrow;
      4. a credential, vendor account, access grant, or production infrastructure;
      5. deleting or irreversibly changing real data;
      6. the scope of an epic: a new story or ticket, or dropping or weakening an acceptance criterion.

      **None of them → it is a small decision. Do not file a card.** Take your recommendation as an assumption, carry on with your work on it, and post a comment tagged `assumption` on the card you are working: the question in one line, the options with their cost, what you chose and why, and what reversing it would take. A change to how an AC is worded is recorded in that comment, not by editing the AC. If you are unsure whether it is small: it is small when reversing it later would be an ordinary bug card. Examples of small: a layout or wrapping choice, a label's length, a default sort or count rule, whether an empty value is shown, a browser-native vs custom confirm, which existing component to reuse.

      **Any of them → kind B below.**

      **Look it up before kind B. The product is built as the spec and the repository's docs say; a question they already answer is not a decision.** Before you file a kind B card, search these four, in this order, and quote what you find:
      0. **The product spec** at `SPEC_PATH` and the planning artefacts in `PLANNING_DIR`, read on `origin/{{inputs.integration_branch}}` (a spec change that is only on `{{inputs.staging_branch}}` is not in force yet). Unset, or the file missing there → write `spec: not available` and go on to 1. Read each requirement together with every `[AMENDED <date>]` / `[NEW <date>]` block under it; a later block beats the text above it. An open question recorded in the spec that the story cites and that is still open is a gate, not a decision for you to take.
      1. The tracker ticket (the key in the card title, when a tracker tool is in the session): description and acceptance criteria, its parent epic and its linked tickets. A card with no key: its description. Search by the words of the question.
      2. The repository's own docs on `{{inputs.integration_branch}}`: `CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md`, `docs/`, the architecture docs.
      3. The board: `decision` comments on the card you are working, on its parent and intake cards, and on the cards it cites. A later comment beats an earlier one; a product decision by {{inputs.product_owner}} beats an engineering ruling.
      If any of them answers the question there is no card: post a comment tagged `decision` on the card you are working — the question in one line, the answer, and **Source:** the requirement id with its amendment date, the tracker key and field, the file and section, or the comment id — and carry on under that answer. An acceptance criterion that contradicts a later recorded decision is applied as the decision says, and that same comment states that the AC in the spec or the ticket needs updating by a human (agents never write to the tracker). Only a question none of the four answers is kind B.

      **B. A decision a person must take.** A product or scope choice, a legal or compliance question, a credential or access grant, or a change the spec would have to make first. The answer *is* the deliverable.
      1. Create it in **Backlog** with the same title form. Tags: `follow-up` and `needs-human-decision`. The description states the evidence, the card and comment it came from, the options and what each costs, and who decides (product questions: {{inputs.product_owner}}; delivery, access and credential questions: {{inputs.delivery_lead}}). It also says which of the four sources above you searched and why none of them answers; a kind B card without that line is sent back.
      2. Move it to **Human-gated** in the same session. A person decides there: they move it to Backlog, or archive it.

      A finding that is both (a bug whose fix needs a product choice) is filed as B, and the description says so. Follow-ups go only to Backlog (and, for kind B, Human-gated). Never release a follow-up to Tech Design yourself. Say in your comment which follow-up cards you created, by id and kind (bug or decision).
