      instructions: |-
        The `tech_design` comment's Design source screens, Divergences and Missing screens are claims to check, not the answer. A `design_feedback` comment newer than your last `design` comment is the work order: change exactly what it asks, keep the rest. A newer `design_approved` closes the review: restate the contract (mockups plus corrections) and route to implementation.
