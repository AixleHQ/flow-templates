      required: true
  - key: design_sync_and_route
    name: Design sync & route
    instructions: |-
      ## Archived cards

      Ignore archived cards: drop any board row with `archived: true` before acting on it, and if the card this run was started for is archived, do nothing and end with a one-line report. Duplicate checks are the exception: look with `include_archived: true` — archiving is a person's "not doing this", so an archived card for the same work means create nothing; name it in the report.

      Run the design sync for this card if one is configured for the project, then route the card.

      ## The design sync is optional

      If the container offers a design-sync / design-tool upload capability for this project (a command, skill or MCP tool listed for this step), use it to sync the `design` spec and the attached mockups from the previous step, preparing whatever it needs. If none is configured, the sync is skipped: say `design sync: not configured` in your comment and go on to routing. Never invent a target account, file or project to upload to.

      ## This step always moves the card

      You are the only mover in this workflow, and the move is **unconditional**. Whether the sync succeeded, partly succeeded, was skipped, produced nothing, or failed outright, this session does not end with the card still in **Design**. Treat the move as the last thing you do, and do it even when everything before it went wrong.

      Read the previous step's `design` comment for its `routing:` line and route on it:

      - `routing: implementation`, no routing line at all, or no `design` comment → **Implementation**.
      - `routing: design-review — …` → tag the card `design-review` with `board_manage_tags` and post a comment addressed to {{inputs.product_owner}} asking for the review: which screens were drawn, the attachment names, the open points, and how to answer — a `design_approved` comment (it may carry small corrections the developer applies) or a `design_feedback` comment saying what to change. The answer reaches the board when it is said to Chat Intake in a message containing the word `triage` (Chat Intake posts the comment and moves the card), or when a person posts it and moves the card themselves — back to **Design** on feedback, on to **Implementation** on approval. Escalate (below), then move to **Human-gated**. A drawn screen is never built before a person approves it.
      - `routing: human-gated — design needed: …` → post a `blocked` comment tagged `design-needed` (what must be designed, which screen or flow, who provides the design) and escalate, then move to **Human-gated**. A person attaches the design (a frame link or exports on the card) and moves the card back to Design.
      - `routing: human-gated — decision: …` → post the `blocked` comment (the decision, who owns it — {{inputs.product_owner}} for product questions, {{inputs.delivery_lead}} for access and credentials — and what was tried) and escalate, then move to **Human-gated**. The answer is recorded as a `decision` comment when it arrives, and the card comes back to Design or goes on to Implementation as the decision says.
      - `routing: blocked — …` → post the `blocked` comment (what is unreachable, what was tried) and escalate, then move to **Blocked**; the Planner retries it when the environment is back.

      **Implementation is the default.** An unreadable, missing or contradictory routing line is not a reason to hold the card — move it to Implementation and say in your comment that you did so and why. The one exception is a readable `design-review` or `design needed` routing: it is never downgraded to Implementation.

      ## When the sync fails

      A failed, partial or skipped sync does not change the destination. Post a comment naming what failed and what is therefore missing downstream, then move the card exactly as the routing line says. The design spec from step one is already on the card; the sync is an extra, not a gate.

      **Chat.** When `ESCALATION_CHANNEL` is set, every escalation (a card you move to Blocked or Human-gated) goes to the escalation channel with `chat_post_message` — card id, title, what is needed, who decides. If the card came from a chat message (its description or a comment links the thread), every message about the card is a **reply in that thread**; a new top-level message is only for an escalation. Never @-mention the Flow bot yourself: a mention starts a workflow. When the channel is `unset`, escalate on the board only (the comment and the column) and do not report the missing message as a finding. A human's answer reaches the board only when it is said to Chat Intake in a message containing the word `triage` on the intake channel (`INTAKE_CHANNEL`), or when a person moves the card — say so when you ask.

      Never finish this session without a completed move: Implementation, Human-gated (with its comment and tag) or Blocked (with its `blocked` comment).
    agent: ux_designer
    tools:
    - board_get_task
    - board_get_comments
    - board_get_task_assets
    - board_add_comment
    - board_update_task
    - board_move_task
    - board_attach_asset
    - board_manage_tags
    - chat_post_message
    config_items:
    - DESIGN_SOURCE
    - ESCALATION_CHANNEL
    - INTAKE_CHANNEL
    depends_on:
    - produce_ui_spec
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
    sub_steps:
    - name: Run the design sync (if configured)
      instructions: |-
        Run the project's design sync (an upload to the team's design tool) on the card's `design` spec and attached mockups, preparing whatever it needs — only if such a capability is configured for this step. Not required: if it is not configured, fails or produces nothing, record that and continue to the next sub-step. It is never a reason to leave the card in Design.
      required: false
    - name: Read the routing line and post the outcome comment
      instructions: |-
        Read the previous step's `design` comment for its `routing:` line. Post a comment saying what the sync produced (or that it is not configured), or what failed and what is therefore missing downstream, and which column you are about to move the card to.

        `routing: design-review` → this comment is the review request to {{inputs.product_owner}} (the screens drawn, the attachment names, the open points, how to answer with `design_approved` or `design_feedback`), and the card gets the `design-review` tag. `routing: human-gated — design needed` → this comment is the `blocked` comment tagged `design-needed` (what must be designed, who provides the design). `routing: human-gated — decision` or `routing: blocked` → this comment is the `blocked` comment (the decision or the unreachable thing, who owns it, what was tried). Every Human-gated or Blocked outcome also goes to the escalation channel when `ESCALATION_CHANNEL` is set, with card id and title. Anything else, including a missing or unreadable line, routes to Implementation — say so in the comment rather than holding the card.
      required: true
    - name: Move the card — unconditional
      instructions: |-
        `board_move_task` to **Implementation** (default), **Human-gated** (on `routing: design-review`, `routing: human-gated — design needed` or `routing: human-gated — decision`) or **Blocked** (only on `routing: blocked`). Do this whether the sync succeeded, partly succeeded, was skipped or failed — the card must not end this session in Design.

        This is the last action of the workflow. Do it before you finish, even if an earlier sub-step errored.
      required: true
- key: implementation
  name: Implementation
  description: |-
    Bound to the Implementation column. Implements the card on a `feature/` or `bugfix/` branch off `{{inputs.integration_branch}}` — or off a parent card's branch when the card is stacked and `PR_MERGE_POLICY` is `human` — following the repository's own rules (`CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md`), writes the tests the repository's testing conventions require, lints with the documented commands, rebases the branch onto its current base when it has gone stale (force-with-lease), opens a PR into `{{inputs.integration_branch}}`, creates the CI gate for `CI_CHECK_NAME` on the PR head sha and moves the card to CI check. Never waits on CI: no suite run as evidence, no polling for a verdict, no mergeability precondition on the gate — the session finishes as soon as the gate exists and the card has moved. When `PLANNING_DIR` is set it also writes the story's line in `sprint-status.yaml` (`backlog → in-progress` at the start, `→ review` when the PR opens). Cards return here from CI check (red run or merge conflicts), Code Review (blocking findings) or Verify (rejected walk); one that has come back from CI more than twice gets a development machine (Coder), when the project has the integration, to reproduce the failure locally; three returns after the last human decision send the card to Human-gated.
  base:
    repositories:
    - app
  steps:
  - key: implement_and_open_pr
    name: Implement the card, open PR
    instructions: |-
      ## Archived cards

      Ignore archived cards: drop any board row with `archived: true` before acting on it, and if the card this run was started for is archived, do nothing and end with a one-line report. Duplicate checks are the exception: look with `include_archived: true` — archiving is a person's "not doing this", so an archived card for the same work means create nothing; name it in the report.

      Implement the card. **The spec:** if the card title carries a tracker key (`PROJ-123`) and a tracker tool is available in the session, the tracker ticket — description, acceptance criteria, parent epic, links — is the spec; otherwise the card description is the spec. When `PLANNING_DIR` is set, the story in `epics.md` and, when `SPEC_PATH` is set, the spec sections it cites are read with it. Precedence when they disagree: the product spec and the planning artefacts, then the tracker ticket with its epic and links, then the repository's own docs, then `decision` comments on the card and linked cards; a product decision by `{{inputs.product_owner}}` beats an engineering ruling. Agents never write to the tracker (no comments, no transitions). The card's `tech_design` comment and, for UI work, its `design` comment with any attached mockups are the contract.

      Before the first change, read `CLAUDE.md`, `AGENTS.md` and `CONTRIBUTING.md` at the root of the project repository (checked out at `/workspace/repo`) — whichever exist — and every per-area rule file they point at. Those rules are binding. The project's skills, if any are attached, apply the same way; the Context7 MCP server answers the library questions the repository's docs do not.

      The card could be brand new OR returned from CI check, Code Review or Verify — read its comments to understand which. Fully implement the card and write the tests the repository's testing conventions require. Lint with the repository's documented lint commands before every commit. Do not run the full test suite as evidence — CI is the gate, and its run is the evidence every later stage relies on; create the PR and the gate once the work is ready. Running the one test file you are writing while you work is fine; a run on your own machine is never cited as proof.

      Follow the sub-steps.

      If the card has come back from CI more than twice — use a development machine (Coder), when the project has the integration, to run the failing job's commands exactly as the repository documents them, reproduce the failure and fix it before pushing again. Without the integration, reproduce from the run's log and the repository's documented test command in your workspace, and say in the `implementation` comment which you did.

      ## Loop cap: three returns after the last human decision, then a person decides

      Do this first, before any file change. Find the latest human `decision` comment on the card (author type human). Count the returns to Implementation after it: `ci` comments that send the card back for a red run or for no run (not the ones that only name merge conflicts), `review_findings` comments with blocking findings, and `verify_findings` comments that reject the walk. Three or more → do not implement and do not push. Post a `blocked` comment titled "Loop cap reached" that lists each return (stage, comment id, head sha, the reason in one line) and says what you think is wrong — the spec, the tests, the environment or the stage that keeps returning it. Add the tag `needs-human-decision` and move the card to **Human-gated**. A new human `decision` comment resets the count.

      ## Repo rules every change must satisfy

      - **The repository's own rules** — `CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md` and the architecture and area docs they point at, read on your base branch, win over this list. Where they are silent, match the surrounding code: naming, structure, idioms, comment density.
      - **API contract** — any added or changed endpoint, parameter or response shape is reflected in the API description the repository maintains (an OpenAPI file, a schema, typed clients) in the same PR, when it has one.
      - **Authorization** — every new or changed action that reads or writes a user's or an organisation's data goes through the authorization layer the repository uses, with a test for an allowed and a denied role.
      - **Migrations** — a schema change ships as a committed migration generated with the repository's documented command, never hand-named, reversible where the framework allows. Two leaf migrations after a rebase are a conflict: resolve them with the documented merge command or renumber your own unmerged one — never edit a migration that is already on `{{inputs.integration_branch}}`.
      - **Serialization and formatting** — API responses go through the repository's serializer layer; numbers, money, percentages and durations shown in the UI go through its shared formatters, not ad-hoc code — wherever the repository has such a layer.
      - **UI** — reuse the existing component library and current screens; build to the `design` comment and the design source (`DESIGN_SOURCE`) — see *UI work* below.
      - **Architecture records** — when the change alters a documented decision, data flow or component, update the document that describes it (`docs/`, the architecture docs) in the same PR.
      - **Generated files** — regenerated with the repository's documented command, never hand-edited and never hand-merged.

      Code Review checks each of these on the diff; a miss comes back as a blocking finding.

      ## Edge cases are part of the contract until Code Review

      Edge cases live in the **card description** under a `## Edge cases` heading — one bullet each: the case, the expected behaviour, and `— added by <stage>`. When you find one the acceptance criteria do not cover, **append** it there with `board_update_task` (add the heading at the end of the description if it is missing; append only — never reword, reorder or delete an existing AC or bullet) **and** post a comment tagged `edge-case` with the same text.

      Edge cases added up to and including **Code Review** belong to this card: Implementation builds and tests every one of them, Code Review checks each is handled, Verify walks each. An edge case found **after** Code Review (in Verify, or by a person on staging) does not enter the contract — it is a bug card.

      Build every bullet of the card's `## Edge cases` block and cover each with a test; name the test per edge case in the `implementation` comment. An edge case you discover while building is appended the same way and built in this card.

      ## Base branch: `{{inputs.integration_branch}}`, or the parent card's branch

      A card normally branches from `{{inputs.integration_branch}}`. Stacking exists only when `PR_MERGE_POLICY` is `human`: a card in Done may then still have an unmerged PR, and the Planner releases a card whose dependency is Done but not merged with `Base: #N (<branch>)` in its description. When `PR_MERGE_POLICY` is `agent`, Verify merges the accepted PR, Done means merged, `Base: #N` never appears and the rest of this section is moot — every card branches from `{{inputs.integration_branch}}`.

      A card branches from **another card's branch** — its *parent* — when its description says `Base: #N` **and** that parent's PR is not merged into `{{inputs.integration_branch}}` yet (`gh pr view <parent PR> --json state` is not `MERGED`). Then:

      - read the parent's `branch` comment for its branch name; branch from `origin/<parent-branch>`; your `branch` comment says `base: <parent-branch> @ <sha>` and `parent: #N`;
      - open the PR **into the parent's branch** (`gh pr create --base <parent-branch>`), and say in the PR body `Stacked on #<parent PR> — merge that first`;
      - keep it current against the parent, not `{{inputs.integration_branch}}`: if `origin/<parent-branch>` moved, rebase onto it; if the parent was force-pushed (its head no longer contains the `base` sha you recorded) use `git rebase --onto origin/<parent-branch> <recorded base sha>`; record the new base sha in a fresh `branch` comment;
      - if the parent got merged while you work, rebase onto `{{inputs.integration_branch}}` (`git rebase --onto origin/{{inputs.integration_branch}} <recorded base sha>`) and retarget the PR (`gh pr edit <n> --base {{inputs.integration_branch}}`) — when the person merging deletes the parent branch, GitHub retargets your PR by itself, but the rebase is still yours;
      - the parent's branch does not exist → `blocked` comment naming the parent card → **Blocked**.

      Never stack on two parents. A card that names two unmerged parents is a Planner error: `blocked` comment saying so → **Blocked**. A `Base: #N` whose parent PR is already merged is ignored: branch from `{{inputs.integration_branch}}` and say so in the `branch` comment.

      Everything below that says `{{inputs.integration_branch}}` means **your base branch** — `{{inputs.integration_branch}}`, or the parent's branch when you are stacked.

      ## `{{inputs.staging_branch}}` is a test branch — code that is only there does not exist

      `{{inputs.integration_branch}}` is the source of truth. `{{inputs.staging_branch}}` is where cards are tested; it also holds work that was never merged into `{{inputs.integration_branch}}`. **Nothing builds on `{{inputs.staging_branch}}`.** Read existing code on `origin/{{inputs.integration_branch}}` (`git cat-file -e origin/{{inputs.integration_branch}}:<path>`, `git log origin/{{inputs.integration_branch}} -- <path>`), never treat code that is only on `origin/{{inputs.staging_branch}}` as shipped, never copy it into your branch, and never merge `{{inputs.staging_branch}}` into it.

      When the card needs something that exists on `origin/{{inputs.staging_branch}}` but not on `origin/{{inputs.integration_branch}}`, find the card that carries it (its `branch` comment or PR; `git log origin/{{inputs.integration_branch}}..origin/{{inputs.staging_branch}} -- <path>` names the commits and their branch):

      - **a card in the pipeline whose PR is not merged yet** → it is a dependency: post `Waits on #N` in a comment; if that card is already in Done and `PR_MERGE_POLICY` is `human`, this card stacks on its branch (`Base: #N`, see *Base branch*); otherwise post a `blocked` comment naming the card and move this card to **Blocked** — it is work-gated, and the Planner returns it when the dependency is Done;
      - **no card carries it** (an orphan commit on `{{inputs.staging_branch}}`) → `blocked` comment tagged `base-gap` naming the files and the commits → **Human-gated**. `{{inputs.delivery_lead}}` decides: the work gets a card and reaches `{{inputs.integration_branch}}` through the pipeline, or `{{inputs.staging_branch}}` is reset to `{{inputs.integration_branch}}`.

      ## Never wait on CI

      This step does not run the suite and does not wait for it. Once the PR is open, create the CI gate, move the card to **CI check**, post the `implementation` comment and finish the session. Do not poll the CI run, do not poll `gh pr view` or `gh pr checks` for a verdict, do not sleep waiting for a run to appear, and do not hold the session open "until CI is green". The gate is what carries the wait; **CI Check** is the step that reads the resolved run and routes the card — green to Code Review, red or conflicted back here with a `ci` comment naming what to fix.

      Mergeability is not this step's precondition either. Do not block the gate or the move on `mergeable` / `mergeStateStatus`, and do not retry until GitHub stops saying `UNKNOWN`. If the PR turns out to be conflicted, CI Check sees it and sends the card back with a `ci` comment listing the conflicted files.

      **When the card comes back here with a `ci` comment about conflicts**, that comment is the work order: rebase onto current `origin/{{inputs.integration_branch}}` (the parent branch when stacked), resolve, push, then gate and move again without waiting. Mechanical conflicts: adjacent independent edits take both; `sprint-status.yaml` keeps both lines; a generated file (a migration-order clash, a regenerated schema or API description) is regenerated with the repository's documented command, not hand-merged. A behaviour conflict on the same lines that you genuinely cannot resolve → leave the card here with a `ci` comment saying so.

      ## Returned from CI: check that CI really ran

      Before you change any file on a CI return, read the latest `ci` comment and the failed jobs of the run it names (`gh run view <id>`, `gh api repos/<owner>/<repo>/actions/runs/<id>/jobs`, the check-run annotations).

      - **CI did not run.** No job executed a step, no runner was assigned, or an annotation says the job was not started (a billing or spending limit, no runner matching the labels, a queue timeout). No code change can fix this. Commit nothing, push nothing, create no gate. Post a `blocked` comment with the PR, head sha, run id and the exact annotation, and move the card to **Blocked**; `{{inputs.delivery_lead}}` owns the fix.
      - **Green on the development machine, red in CI.** If the card has come back from CI more than twice, you ran the failing job's commands on a development machine and they pass there while CI stays red on the same job, do not push another guess. Post a `blocked` comment listing each attempt (head sha, failing job, first failure line) and what the machine showed, add the tag `needs-human-decision` and move the card to **Human-gated**.
      - **The base is red** → *A red base is not your failure*, below.
      - Otherwise the `ci` comment is the work order: fix the real failure it names. Do not add commits that only reformat or touch status to make red CI go away.

      ## Ship the staging data the Verification plan asks for

      If the tech design's **Verification plan** names a staging data step, build it in this card: an idempotent task, run the way the repository documents one-off commands on staging, that creates only test-marked, card-namespaced records and can be removed again by a documented cleanup (say how), with tests — and post an `ops_runbook` comment telling the person exactly what to run on staging, and list the same step under `ops_needed:` in the `implementation` comment. Merge and deploy then routes the card through **After Deploy (Human action)**, and Verify finds the data in place.

      ## A red base is not your failure

      When the card comes back from CI red, first check whether the same job fails on current `origin/{{inputs.integration_branch}}` (its latest CI run — `gh run list --branch {{inputs.integration_branch}}` — or the same test run locally on a development machine). If it does, nothing in this PR can fix it, so do not push a workaround and do not move the card to Human-gated:

      1. find the open bug for that failure (tag `base-red`) or create it in **Backlog**: bug form, tags `bug`, `base-red`, `ci`, priority high, the failing job and first failure as evidence;
      2. post a `blocked` comment: "Waiting on #N (base-red): <job> fails on `{{inputs.integration_branch}}` too; nothing to fix in this PR";
      3. move the card to **Blocked**. The Planner releases the base-red bug first and, when it is Done, returns this card to Implementation to rebase and gate again.

      ## Always ship a branch that is current with its base

      Not waiting on CI is not the same as ignoring the base branch. Before the PR goes out — on the first pass and on every return pass — check whether your branch is behind `{{inputs.integration_branch}}` (or the parent branch when stacked), and rebase it if it is:

      ```
      git fetch origin {{inputs.integration_branch}}
      git rev-list --left-right --count origin/{{inputs.integration_branch}}...HEAD   # left > 0 means stale
      git rebase origin/{{inputs.integration_branch}} && git push --force-with-lease
      ```

      `--force-with-lease`, never a bare `--force`. A stale branch makes CI prove the wrong tree and makes Code Review read a diff against a base that has moved, so a green run on it means little. This is a local check against `origin/{{inputs.integration_branch}}` and costs one fetch — it is not a wait on CI, and it does not replace the gate. Never push to `{{inputs.integration_branch}}`, `{{inputs.staging_branch}}` or `main` / the production branch directly; the production branch is released only by a human, and no stage touches it.

      ## Staging environment — you do not touch it; you declare what it needs

      Staging (`STAGING_BASE_URL`) is deployed only by `STAGING_DEPLOY_WORKFLOW` on a push to `{{inputs.staging_branch}}`, which *Merge and deploy to staging* owns. This step has no environment credential and needs none: it never deploys, never runs commands on the deployed environment, and never creates infrastructure.

      What the environment needs is part of your deliverable, written down, not done:

      - **Migrations** that the staging deploy runs by itself (the repository's deploy docs or `STAGING_DEPLOY_WORKFLOW` say whether it does) need no entry. A migration or data step the deploy does not run is an `ops_needed:` entry.
      - **Hand-run steps** — a seed, a backfill, a one-off task or script the card's acceptance criteria depend on — go in the `implementation` comment under `ops_needed:`, one entry each: the exact command, where it runs (the way the repository documents one-off commands on staging), expected output, and how to tell it worked. Merge and deploy turns that list into the card's `ops_runbook` and routes the card to **After Deploy (Human action)**, where a person runs it before Verify walks the card.
      - **New infrastructure or variables** (a bucket, a service variable, an identity-provider or vendor setting) — same `ops_needed:` list, variable **names** only, never values. A person provisions them.

      Prefer code that makes a hand-run step unnecessary — an idempotent migration or a boot-time default — when the card allows it. No hand-run step → write `ops_needed: none`.

      ## UI work — the `design` comment and the design source are the contract

      Only when the card carries a `design` comment or the change touches UI. The `design` comment, with its attached mockups and the corrections of the latest `design_approved` comment when there is one, is the UI contract: routes, fields, labels, copy, table columns, filters, actions, states, entry points and navigation. Build it from the design source (`DESIGN_SOURCE`) — a design doc in the repository, a design-tool file, or a deployed reference build of the UI; `unset` means the existing component library and current screens. Reuse an existing component before adding one; a new shared component or a one-off variant gets a one-line reason in the `implementation` comment. Colours, spacing and typography come from the project's tokens and formats from its shared formatters, wherever it has them. A deployed reference build is read and navigated only — never create an account on it and never submit a form that changes its data.

      Precedence: the spec (and its answers to open questions recorded in it) first, then the `design` comment, then the design source, then your own judgement. Where the design source contradicts the spec, follow the spec and name the divergence; a feature the design source shows and the spec does not is not in scope for this card — note it, do not build it. A big UI change (a new screen or panel, a new pattern or component, changed navigation or flow) that neither the `design` comment nor the design source covers is not yours to invent: `blocked` comment, tag `design-needed`, card to **Human-gated**. A small one (a new state, copy, a field in an existing component) is decided from the existing components and recorded as an `assumption` comment.

      Before you push, when you can run the app (a development machine, when the project has the integration), put each changed screen next to its mockup or design-source screen — same fields, labels, columns, filters, actions, states and entry points, except the divergences the `design` comment lists — attach one screenshot pair per screen to the card, and list in the `implementation` comment every difference you left and why. When you cannot run it, say so there; Verify compares the screens on staging.

      ## Blocked

      Nothing you can proceed on — no machine, an unusable clone, a run that died, a requirement no assumption can settle → `blocked` comment (what is missing, from whom, what you tried) + an escalation in the escalation channel (`ESCALATION_CHANNEL`) with `chat_post_message` — card id, title, what is needed, who decides — + card to **Blocked**. A missing credential, access grant or product decision is not Blocked but **Human-gated**: same comment and escalation, that column instead, never an invented value. Check the card's comments first: the answer is often already there.

      The escalation channel takes every escalation in this pipeline; the intake channel (`INTAKE_CHANNEL`) takes none. If the card came from a chat message (its description or a comment links the thread), every message about the card is a reply in that thread; a new top-level message is only for an escalation. Never @-mention the pipeline's bot yourself: a mention starts a workflow. `ESCALATION_CHANNEL` unset → escalate on the board only (the comment plus the column) and do not report "message not sent" as a finding. Say what you need and who from — the answer reaches the card only when it is posted in the intake channel with the word `triage` (Chat Intake puts it on the card) or when a person moves the card; say so when you ask.

      A red or conflicted CI run where the jobs ran is **not** a Blocked case — it comes back here as a `ci` comment and is ordinary work, up to the loop cap. Neither is a step the environment needs after deploy — that is an `ops_needed:` entry.

      ---

      ## Follow-ups: a bug goes to Backlog, a small decision is your assumption, a big one goes to Human-gated

      **A defect goes straight to Backlog; only a decision goes to Human-gated.**

      A non-blocking finding stays in your own comment: debt, a test gap, a copy nit, a deviation the spec is silent on, a small bug outside this card. That is enough in most cases. If it deserves its own card, decide which kind it is.

      **A. A bug.** Behaviour that contradicts an acceptance criterion or the spec, an unmet AC, a failing or flaky test, a missing translation, a crash, a wrong figure, or a requirement `{{inputs.product_owner}}` already stated in writing (the tracker ticket, the spec, a `decision` comment) that the code does not meet. Nobody has to decide anything; someone has to fix it.
      1. Create it in **Backlog**. Title: `<key> follow-up: <what>`, where `<key>` is the tracker key, else the story id from `PLANNING_DIR`, else `card-<N>`. `task_type: bug`. Tags: `follow-up` and `bug`, plus the epic and area. Leave `assignee_id` empty: the Planner assigns an agent when it releases the card. The description is the bug form: **What's wrong / Where** (route, file:line) **/ Evidence** (steps, screenshot, the card and comment it came from) **/ Done when**.
      2. **Leave it in Backlog.** The Planner releases it. Do not move it to Human-gated and do not release it yourself.

      **Small decisions: apply your own recommendation.** When a finding needs a choice, you can name the options and you would recommend one, check whether the choice touches any of these:
      1. legal, compliance, consent or privacy text, disclosures, or anything a user agrees to;
      2. money: billing, pricing, plan limits, what anyone is charged or paid, or how a cost figure shown to users is calculated;
      3. the role or permission model — who may see or do what;
      4. something `{{inputs.product_owner}}` asked for in writing, or a vocabulary or design `{{inputs.product_owner}}` approved, that your recommendation would contradict or narrow;
      5. a credential, vendor account, access grant, or production infrastructure;
      6. deleting or irreversibly changing real data;
      7. the scope of an epic: a new story, or dropping or weakening an acceptance criterion.

      **None of them → it is a small decision. Do not file a card.** Take your recommendation as an assumption, carry on with your work on it, and post a comment tagged `assumption` on the card you are working: the question in one line, the options with their cost, what you chose and why, and what reversing it would take. A change to how an AC is worded is recorded in that comment, not by editing the AC. If you are unsure whether it is small: it is small when reversing it later would be an ordinary bug card. Examples of small: a layout or wrapping choice, a label's length, a default sort or count rule, whether an empty value is shown, a browser-native vs custom confirm, which existing component to reuse.

      **Any of them → kind B below.**

      **Look it up before kind B. A question the spec or the repository's docs already answer is not a decision.** Before you file a kind B card, search these four, in this order, and quote what you find:
      0. **The product spec and the planning artefacts** — `SPEC_PATH` and `PLANNING_DIR`, read on `origin/{{inputs.integration_branch}}` (`{{inputs.staging_branch}}` is a test branch — a spec change that is only there is not in force yet). Both unset, or the file missing there → write `spec: not available` and go on to 1. Read each requirement together with every `[AMENDED <date>]` / `[NEW <date>]` block under it — a later block beats the text above it — and the open questions recorded in the spec for any question the story cites.
      1. **The tracker ticket** (when the title carries a key and a tracker tool is available): description and acceptance criteria, its parent epic, and its linked tickets. Search by the key and by the words of the question.
      2. **The repository's own docs** on the base branch: `CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md`, `docs/`, the architecture docs, and the decisions section of the design source (`DESIGN_SOURCE`) when it is a doc in the repository.
      3. **The board**: `decision` comments (including answers from `{{inputs.product_owner}}`) on the card you are working, on its parent and intake cards, and on the cards it cites. A later comment beats an earlier one; a product decision by `{{inputs.product_owner}}` beats an engineering ruling.
      If any of them answers the question there is no card: post a comment tagged `decision` on the card you are working — the question in one line, the answer, and **Source:** the tracker key and field, or the file and section (with the amendment date when there is one), or the comment id — and carry on under that answer. An acceptance criterion that contradicts a spec amendment is applied as the spec says, and the AC change is recorded in that same comment. Only a question none of the four answers is kind B.

      **B. A decision a person must take.** A product or scope choice (`{{inputs.product_owner}}`), a legal or compliance question, a credential or access grant (`{{inputs.delivery_lead}}`), or a change the spec would have to make first. The answer *is* the deliverable.
      1. Create it in **Backlog** with the same title form. Tags: `follow-up` and `needs-human-decision`. The description states the evidence, the card and comment it came from, the options and what each costs. It also says which of the four sources above you searched and why none of them answers; a kind B card without that line is sent back.
      2. Move it to **Human-gated** in the same session. A person decides there: they move it to Backlog, or archive it.

      A finding that is both (a bug whose fix needs a product choice) is filed as B, and the description says so. Never release a follow-up to Tech Design yourself and never leave a kind B card parked in Backlog. Say in your comment which follow-up cards you created, by id and kind (bug or decision).
    agent: developer
    tools:
    - board_get_task
    - board_get_comments
    - board_get_task_assets
    - board_add_comment
    - board_update_task
    - board_move_task
    - board_attach_asset
    - board_manage_tags
    - board_create_task
    - board_create_gate
    - chat_post_message
    mcp_servers:
    - context7
    config_items:
    - SPEC_PATH
    - PLANNING_DIR
    - DESIGN_SOURCE
    - CI_CHECK_NAME
    - PR_MERGE_POLICY
    - STAGING_BASE_URL
    - ESCALATION_CHANNEL
    - STAGING_DEPLOY_WORKFLOW
    - INTAKE_CHANNEL
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
    sub_steps:
    - name: Post the `branch` comment
      instructions: |-
        Before the first file change: pick the base — `origin/{{inputs.integration_branch}}`, or the parent card's branch when the description says `Base: #N`, `PR_MERGE_POLICY` is `human` and that parent's PR is not merged yet (see *Base branch*) — and create the branch from it as `feature/<key>-<short-slug>` (`bugfix/<key>-<short-slug>` for a bug), where `<key>` is the tracker key from the card title, else the story id (`E.S`) from `PLANNING_DIR`, else `card-<N>`. Then post the `branch` comment: `branch`, `base: <{{inputs.integration_branch}} or parent-branch> @ <sha>` (plus `parent: #N` when stacked), `stage`, and a complete honest `paths:` line — that line is the footprint the Planner reads to decide what may run alongside this card. A `branch` comment already on the card → reuse that branch and post the head sha you continue from.
      required: true
    - name: Set `backlog → in-progress` in `sprint-status.yaml` (`PLANNING_DIR` set, first pass only)
      instructions: |-
        Only when `PLANNING_DIR` is set, and on the first pass only: one line in `sprint-status.yaml` under `PLANNING_DIR`, on your branch — your story's key only, value kept as `key: state`. Never the header, `last_updated` or an epic rollup line; never regenerate the file from `epics.md`. Return pass (from CI check, Code Review or Verify): if the line already reads `review`, leave it — do not flip it to `in-progress` and back; a status-only commit is noise in the PR. `PLANNING_DIR` unset → skip; there is no status file.
      required: false
    - name: Implement in spec order
      instructions: |-
        The spec's acceptance criteria, the `tech_design` and `design` comments and the attached specs are the contract; returning from a later stage, the `ci` / `review_findings` / `verify_findings` comment is the work order. `CLAUDE.md`, `AGENTS.md` and `CONTRIBUTING.md` are binding, including the *Repo rules* list in the step (API description in sync, authorization on every data-touching action, generated and reversible migrations, shared serializers and formatters, architecture docs updated). Write the test that would fail against a wrong implementation: request or API tests for behaviour and authorization (allowed and denied roles), component or end-to-end tests for UI behaviour, in the frameworks the repository's testing conventions name; anything scoped to an organisation or account gets a test that another one's data is not reachable.

        The card's `## Edge cases` block is part of the spec: build and test every bullet in it, and append any edge case you discover (append only, plus an `edge-case` comment).
      required: true
    - name: Build UI work to the `design` comment and the design source
      instructions: |-
        Only when the card carries a `design` comment or the change touches UI: build from the `design` comment with its mockups (and the latest `design_approved` corrections) and from the design source (`DESIGN_SOURCE`; `unset` → the existing component library and current screens). Reuse an existing component before adding one; a new shared component or a one-off variant gets a one-line reason in the `implementation` comment; numbers and dates through the shared formatters, colours through the tokens, where the project has them. When you can run the app, attach one screenshot pair per changed screen (yours, the mockup or design-source screen) and list the differences you left and why; a big change nothing designed → `design-needed`, **Human-gated**. No UI in the change → skip.
      required: false
    - name: Sync the docs that travel with the code
      instructions: |-
        Before opening the PR, commit on the branch every document the change makes stale — a board comment is not a reviewable artifact and does not travel with the code:

        - the API description the repository maintains, for any added or changed endpoint, parameter or response shape;
        - the architecture or decision doc that describes what the change alters (`docs/`, the architecture docs);
        - when `DESIGN_SOURCE` is a design doc in the repository and this card builds a pattern a person approved (`design_approved`), its line in that doc's decisions section;
        - any other doc `CLAUDE.md` / `AGENTS.md` / `CONTRIBUTING.md` require to be updated with this kind of change.

        Nothing became stale → say so in the `implementation` comment. Write your half of the verification honestly in that comment too — which acceptance criteria your tests cover and which still need a browser on staging — so Verify has a real list to walk.
      required: true
    - name: Lint, commit and push (set `→ review` when `PLANNING_DIR` is set)
      instructions: |-
        Run the repository's documented lint commands for the areas you touched and fix what they report before committing. Commits follow Conventional Commits, with the tracker key in the subject when there is one: `type(scope): [<KEY>] imperative description` (types feat/fix/refactor/test/docs/chore/perf/ci; scopes as the repository's history uses them).

        `PLANNING_DIR` set: `in-progress → review` on your story's line in `sprint-status.yaml`, in the same commit as the code change, never in a commit of its own; never `done` — that is Verify's, after acceptance. A return pass with the line already at `review` changes nothing.

        The PR tip must already include the doc updates from the previous sub-step. Push to the card's branch only — never to `{{inputs.integration_branch}}`, `{{inputs.staging_branch}}` or the production branch.
      required: true
    - name: Rebase onto the current base if the branch is stale
      instructions: |-
        Before opening or updating the PR, check whether your branch is behind **its base** — `{{inputs.integration_branch}}`, or the parent branch when stacked — and bring it up to date if it is. CI on a stale branch proves the wrong tree, and Code Review reads a diff against a base that has moved.

        ```
        git fetch origin {{inputs.integration_branch}}
        git rev-list --left-right --count origin/{{inputs.integration_branch}}...HEAD
        ```

        Left number `0` → up to date, nothing to do. Anything above `0` → `git rebase origin/{{inputs.integration_branch}}` and `git push --force-with-lease` — always `--force-with-lease`, never a bare `--force`; the lease is what stops you from erasing a commit someone else pushed to your branch. Stacked: replace `{{inputs.integration_branch}}` with `<parent-branch>`; a force-pushed parent → `git rebase --onto origin/<parent-branch> <recorded base sha>`; a parent merged meanwhile → `--onto origin/{{inputs.integration_branch}}` and `gh pr edit <n> --base {{inputs.integration_branch}}`; record the new base sha in a fresh `branch` comment.

        Conflicts during the rebase are ordinary work, resolve them here: adjacent independent edits take both; `sprint-status.yaml` keeps both lines; generated files are regenerated with the repository's documented command, not hand-merged. A behaviour conflict on the same lines that you cannot resolve → `git rebase --abort`, leave the card in Implementation with a `ci` comment naming the files and what collides, and finish. Do not open or gate a PR you know is unrebaseable.

        This is a local check against `origin/{{inputs.integration_branch}}`, not a wait on CI. Do it once, act on it, move on — do not poll `gh pr view` for `BEHIND` and do not re-check after the push.
      required: true
    - name: Open the PR into the integration branch
      instructions: |-
        Open the pull request into your base: `{{inputs.integration_branch}}` (`gh pr create --base {{inputs.integration_branch}}`), or, when stacked, the parent's branch (`gh pr create --base <parent-branch>`, body: `Stacked on #<parent PR> — merge that first`). Title with the tracker key when there is one; link the ticket, or the card, in the body. A PR that already exists from an earlier pass is reused — push to it instead of opening a second one.

        Do not check `mergeable` / `mergeStateStatus` here and do not wait for GitHub to make up its mind. Mergeability is CI Check's problem: a conflicted PR comes back to this column with a `ci` comment naming the files.
      required: true
    - name: Create the CI gate for `CI_CHECK_NAME`
      instructions: |-
        `board_create_gate` for the check `CI_CHECK_NAME` on the PR's head sha, immediately after the PR is open. No precondition, no mergeability query, no waiting for the run to appear.

        The gate is what holds the card in CI check until the run resolves — without it the next column starts against a branch nothing has checked. The gate is TTL-bounded, so it resolves even when no run ever starts (a conflicted PR); CI Check then reads the state and routes the card. A missing run is never green.

        You do not run the suite yourself, and you do not wait on the gate in this session.
      required: true
    - name: Move the card to CI check
      instructions: |-
        Move the card to **CI check** as soon as the gate exists. Unconditional — do not hold it here waiting for CI, and do not hold it here because the PR might be conflicted.

        The gate keeps it in that column until the run resolves. CI Check then routes it: green → Code Review, red → back here with the failing job named, conflicted → back here with the conflicted files named, no run → back here with the PR and head sha named.
      required: true
    - name: Post the `implementation` comment
      instructions: |-
        Tracker key or card id, branch and head commit, PR link (and `Stacked on #<parent PR>` when stacked); files added / modified / deleted; migrations added; API description / architecture docs / design doc updated (or `none stale`); any new service the repository's local dev setup needs; the test per edge case; an **`ops_needed:`** list — every hand-run step or piece of infrastructure the deployed environment needs before this card can be verified (exact command, where it runs, expected output, done-when; variable names only, never values), or `ops_needed: none`; which acceptance criteria the tests cover and which need a browser on staging; the UI differences left against the mockups; attached patches and the ACs they leave unmet; every deviation from the spec with the constraint that forced it; the follow-up cards created, by id and kind.

        Finish the session here. Do not wait for the CI gate, the run, or the card's next column — CI Check owns the verdict and will send the card back if it is red, conflicted or has no run.
      required: true
    - name: |-
        Follow-ups: a bug goes to Backlog, a small decision is your assumption, a big one goes to Human-gated
      instructions: |-
        **A defect goes straight to Backlog; only a decision goes to Human-gated** — the full rule is in the step. A non-blocking finding stays in your own comment. If it deserves a card:

        - **A. A bug** (contradicts an AC, the spec or a written requirement; a failing or flaky test; a crash; a wrong figure) → **Backlog**: title `<key> follow-up: <what>`, `task_type: bug`, tags `follow-up`, `bug`, the epic and area, no assignee, the bug form (What's wrong / Where / Evidence / Done when). Leave it there for the Planner.
        - **A choice** → check the big-decision list first (legal or consent text; money; the role and permission model; a written product-owner requirement; a credential or production infrastructure; irreversible data changes; epic scope). None → your recommendation becomes an `assumption` comment and you carry on, no card. Any → look it up first in the spec and planning artefacts, the tracker ticket, the repository's docs and the board's `decision` comments, and post a `decision` comment with its **Source** when one answers.
        - **B. An unanswered big decision** → **Backlog** card tagged `follow-up`, `needs-human-decision`, with the evidence, the options and their costs and the four sources you searched, moved to **Human-gated** in the same session. A bug whose fix needs a product choice is filed as B.

        Never release a follow-up to Tech Design yourself. Say in your `implementation` comment which follow-up cards you created, by id and kind.
      required: true
- key: ci_check
  name: CI Check
  description: |-
    Bound to the CI check column, behind the CI gate Implementation created for the PR's `CI_CHECK_NAME` run. Implementation creates that gate unconditionally and never waits on GitHub, so this column is where every verdict is read — including a conflicted PR and the case where no run ever started. Reads the resolved run for the PR head sha: conflicted or wrong base → back to Implementation with a `ci` comment naming the files; green → Code Review; red because of the card → back to Implementation with the failing job named and the return counted; red because the base branch is red → Blocked behind a `base-red` bug; CI jobs never started (billing, no runner, queue timeout) → Blocked with `ci-infrastructure`; a stale gate → a human's call. Runs nothing itself and holds no machine.
  base:
    repositories:
    - app
  steps:
  - key: ci_check
    name: CI Check
    instructions: |-
      ## Archived cards

      Ignore archived cards: drop any board row with `archived: true` before acting on it, and if the card this run was started for is archived, do nothing and end with a one-line report. Duplicate checks are the exception: look with `include_archived: true` — archiving is a person's "not doing this", so an archived card for the same work means create nothing; name it in the report.

      The gate has resolved — read it, route the card, finish the session. Nothing here runs a suite, and nothing here holds a machine.

      **What to read.** `board_list_gates` for the card gives the gate Implementation created for the PR's `CI_CHECK_NAME` run and its state (resolved, expired on its TTL, or `stale`). The verdict itself comes from GitHub, for the PR head sha and no other commit: `gh pr view <n> --json headRefOid,baseRefName,mergeable,mergeStateStatus`, `gh pr checks <n>`, `gh run list --commit <head sha> --workflow "<CI_CHECK_NAME>"`, and `gh api repos/<owner>/<repo>/actions/runs/<id>/jobs` for the jobs and their annotations. Every required job of that run counts; a run on an older sha is not this head's verdict.

      Implementation does not check mergeability before handing the card over, so a conflicted PR reaches this column normally and it is this step's job to spot it.

      **Merge conflicts and the base first.** Before treating the verdict as green or red, check the PR is still mergeable into its base. `CONFLICTING` / `DIRTY` is not a failed test run — GitHub never built the merge ref, so the workflow did not start (or the check is a missing merge-ref error). Post a `ci` comment naming the conflicted files and move the card back to **Implementation**. Do not send it to Code Review. The base must be `{{inputs.integration_branch}}` — or, when the card's description says `Base: #N (<branch>)` and that parent PR is still open, the parent's branch (stacked branches exist only while `PR_MERGE_POLICY` is `human`; under `agent`, Done means merged and every PR targets `{{inputs.integration_branch}}`). Any other base goes back to Implementation too, with a `ci` comment saying so. A conflict-only or wrong-base return does not count toward the loop cap below.

      **CI did not run (infrastructure, not code).** Before routing on red, read the failed jobs and their check-run annotations. If the jobs never started — no job has an executed step, no runner name, or an annotation such as "The job was not started because recent account payments have failed or your spending limit needs to be increased", "No runner matching the specified labels", or a queue timeout — this is not a test failure and no code change can fix it. Find the open card for the CI infrastructure problem (tag `ci-infrastructure`, in Blocked or Backlog) or create one in **Backlog** (the annotation, the run link, what a person must fix; tags `ci-infrastructure`, `ci`; a procure-and-configure card stays in Backlog). Post a `blocked` comment with the PR, head sha, run id and the exact annotation, naming that card; tag this card `ci-infrastructure` and move it to **Blocked** — not to Implementation and not to Human-gated. This is not a return and does not count toward the loop cap: the Planner holds the card with a `watchdog` comment until CI runs again, then sends it back to Implementation for a fresh run.

      **Loop cap: three returns, then a person decides.** Find the latest human `decision` comment on the card. Count the returns to Implementation after it: `ci` comments for red CI or for no run (not conflict-only ones, not base-red, not infrastructure blocks), `review_findings` with blocking findings, and Verify rejections. If there are already three, do not send the card back again: post a `blocked` comment titled "Loop cap reached" that lists each return (stage, comment id, head sha, reason in one line) and the current red job with its first failure line, add the tag `needs-human-decision` and move the card to **Human-gated** — `{{inputs.delivery_lead}}` decides, or `{{inputs.product_owner}}` when the comment says the spec is what keeps failing. A new human `decision` comment resets the count.

      - **Green** (every required job on the head sha, mergeable, right base) → **Code Review**.
      - **Red** (mergeable, the jobs ran, a job failed, under the loop cap) → `ci` comment naming the failing job and the first real failure in its log (`file:line` where the log gives one) and which return this is ("return 2 of 3"), card back to **Implementation**. A card that has come back from CI twice already gets a development machine (Coder) in Implementation, when the project has the integration, instead of another blind push — say so in the comment.
      - **No run at all** — the gate expired on its TTL and GitHub has no `CI_CHECK_NAME` run for this PR head, with the PR mergeable → `ci` comment saying exactly that (PR number, head sha, that no run was found), card back to **Implementation**; it counts as a return. Never treat a missing run as green. A run still queued when the gate expired is not green either — report it the same way, with the run link — unless it shows the signs above, which make it an infrastructure block.
      - **Stale gate** — no webhook ever arrived. That is a human's call, not a retry: if GitHub shows a completed `CI_CHECK_NAME` run for the head sha, route on it as above; otherwise post a `blocked` comment (gate id, PR, head sha, what `gh pr checks` shows), tag `needs-human-decision` and move the card to **Human-gated**.

      **Red because the base is red.** Before sending a red card back, check whether the same job also fails on the PR's base — the latest `CI_CHECK_NAME` run on current `{{inputs.integration_branch}}` (`gh run list --branch {{inputs.integration_branch}} --workflow "<CI_CHECK_NAME>"`), or on the parent branch when stacked — or shows the same failure on other PRs opened since. If it does, the card is not the cause: find the open `base-red` bug for it or create one in **Backlog** (bug form, tags `bug`, `base-red`, `ci`, priority high), post a `ci` comment "Waiting on #N (base-red): <job> fails on `{{inputs.integration_branch}}` too", and move the card to **Blocked** — not to Implementation and never to Human-gated. It is not a return. The Planner releases the base-red bug first and returns the card when that bug is Done.

      This step has no chat tool and never writes to the tracker: it escalates on the board only — the comment and the column — and the Planner's cycle report names the card. Do not wait here for a run to appear and do not re-create the gate. After the move, finish the session.
    tools:
    - board_get_task
    - board_get_comments
    - board_add_comment
    - board_move_task
    - board_manage_tags
    - board_create_task
    - board_list_gates
    config_items:
    - CI_CHECK_NAME
    - PR_MERGE_POLICY
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
    sub_steps:
    - name: Bounce a conflicted or wrong-base PR back to Implementation
      instructions: |-
        Before routing on green/red: `gh pr view <n> --json mergeable,mergeStateStatus,baseRefName`. `CONFLICTING` / `DIRTY`, or a base that is neither `{{inputs.integration_branch}}` nor the parent branch the description declares with `Base: #N (<branch>)` → `ci` comment naming the conflicted files (or the wrong base), card back to **Implementation**. This is not a red suite and not a counted return. Only then read the gate verdict.
      required: true
    - name: Red base → Blocked with the base-red bug named
      instructions: |-
        If a red job also fails on the PR's base (current `{{inputs.integration_branch}}`, or the parent branch when stacked), do not send the card to Implementation or Human-gated: name or create the `base-red` bug in Backlog (priority high), post the `ci` comment "Waiting on #N (base-red)", and move the card to **Blocked**. Not a counted return.
      required: true
- key: code_review
  name: Code Review
  description: |-
    Bound to the Code Review column. Statically reviews the card's open PR against the spec — the product spec and planning artefacts when set, the tracker ticket or the card description, the `tech_design` / `design` comments and the `## Edge cases` block — and against the repository's own rules (`CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md`, architecture docs): no app run, no suite run, no merge. The CI gate already proved the branch green, so the question here is coverage and rule compliance — whether every acceptance criterion maps to a real assertion. Posts a `review_findings` comment and routes the card back to Implementation on blocking findings, forward to Merge and deploy to staging when clean, or to Human-gated when only `{{inputs.product_owner}}` can answer. The last stage that may add to the card's contract.
  base:
    repositories:
    - app
  steps:
  - key: review_diff_and_route
    name: Review diff & route
    instructions: |-
      ## Archived cards

      Ignore archived cards: drop any board row with `archived: true` before acting on it, and if the card this run was started for is archived, do nothing and end with a one-line report. Duplicate checks are the exception: look with `include_archived: true` — archiving is a person's "not doing this", so an archived card for the same work means create nothing; name it in the report.

      Review the card's open PR (`gh pr view <n>`, `gh pr diff <n>`) against the spec and against the repository's rules. Read the code, not just the summary: the implementation comment is a claim, not evidence. Use the project's skills, if any are attached, and Context7 when a finding depends on a library's documented behaviour.

      **The spec, in order of precedence:** (1) the product spec at `SPEC_PATH` and the planning artefacts in `PLANNING_DIR` when set, read on `{{inputs.integration_branch}}` — each requirement together with every `[AMENDED …]` / `[NEW …]` block under it, a later block beats the text above it; (2) if the card title carries a tracker key (`PROJ-123`) and a tracker tool is available in the session, the tracker ticket — description, acceptance criteria, parent epic, links — otherwise the card description; (3) the card's `tech_design` and `design` comments and its `## Edge cases` block; (4) `decision` comments on the card and the cards it cites. A product decision by `{{inputs.product_owner}}` beats an engineering ruling. Agents never write to the tracker.

      **The repository's rules:** `CLAUDE.md`, `AGENTS.md` and `CONTRIBUTING.md` at the repository root — whichever exist — and the `docs/` / architecture docs for the touched areas, as they are on the PR's base. They are binding and override generic taste.

      Comment tagged `review_findings`:

      - **Verdict** first line: `BLOCKING (n)` or `CLEAN`.
      - **Blocking** — one bullet each: `file:line` · what is wrong · what would fix it.
      - **Non-blocking notes** — same shape, clearly separated, unpadded.
      - **Evidence** — the CI gate already proved the branch green, so weigh coverage, not whether the checks ran. Every acceptance criterion must map to a named test and assertion that would fail if the criterion broke; an AC with no assertion behind it, or one that would pass against a wrong or empty implementation, is blocking. Look for the tests that were not written: deleted assertions, disabled checks, lowered thresholds, mocks of the system under test. A new or changed endpoint with no test for its authorization (allowed and denied roles) is blocking.
      - **Authorization and data isolation** — on anything that reads or writes user-, account- or organisation-scoped data: no request returns or changes data outside the caller's scope, and every new or changed action carries the permission check the repository's rules or roles matrix require. A schema change without its migration, a migration that cannot apply after the base branch's latest, an unscoped query on scoped data, raw SQL with interpolated input — blocking. N+1 queries on list views, or missing attribution on money and identity operations the spec asks to be attributed — a note, unless the repository's rules make them rules.
      - **Repo rules** — the line from the repo-rules sub-step: `Repo rules: CLEAN` or `Repo rules: BLOCKING (n) — …`.
      - **Design** — for a UI story, the templates and components against the `design` comment and its attached mockups (`board_get_task_assets`), and against the design source (`DESIGN_SOURCE`; unset → the existing component library and current screens). A field, column, filter, action or state the design has and the diff lacks, without a listed divergence or an `assumption` comment, is blocking; so is a hand-built look-alike of a component the library has, a hard-coded colour or size where the design source defines tokens, an internal word in user-facing copy, or a big UI change (new screen or panel, new pattern or component, changed navigation or flow) that no `design` comment covers — that one needed the design source first, not a guess. Accessibility of new UI (labelled controls, keyboard reach, contrast) as the repository's rules or the design source require. Static only — Verify compares the rendered screens. Write `Design: CLEAN`, `Design: BLOCKING (n) — …` or `Design: no UI`.
      - **Edge cases** — each bullet of the card's `## Edge cases` block: handled and tested → name the test; missing → blocking.
      - **Branch & status** — declared vs PR head; the PR base is `{{inputs.integration_branch}}`, or the parent's branch when the description says `Base: #N (<branch>)` and that parent PR is still open (any other base is blocking; under `PR_MERGE_POLICY` = `agent` Done means merged and there are no stacked PRs); the branch-name and commit-subject conventions the repository documents (deviations are a non-blocking note); when `PLANNING_DIR` is set, what the diff did to `sprint-status.yaml` — only this story's line, moved to `review`; a regenerated file or another story's line changed is blocking.

      ## Edge cases are part of the contract until Code Review

      Edge cases live in the **card description** under a `## Edge cases` heading — one bullet each: the case, the expected behaviour, and `— added by <stage>`. When you find one the acceptance criteria do not cover, **append** it there with `board_update_task` (add the heading at the end of the description if it is missing; append only — never reword, reorder or delete an existing AC or bullet) **and** post a comment tagged `edge-case` with the same text.

      Edge cases added up to and including **Code Review** belong to this card: Implementation builds and tests every one of them, Code Review checks each is handled, Verify walks each. An edge case found **after** Code Review (in Verify, or by a person on staging) does not enter the contract — it is a bug card.

      Check each bullet of the card's `## Edge cases` block against the diff and its tests: handled and tested → note it; missing → a review finding that sends the card back to Implementation. An edge case you see that is not in the block yet is appended now (you are the last stage that may add one) and also sends the card back to Implementation.

      ## Chat

      If the card came from a chat message (its description or a comment links the thread), every message about the card is a **reply in that thread** (`chat_post_message` on the intake channel `INTAKE_CHANNEL`). A new top-level message is only for an **escalation** — a card you move to Blocked or Human-gated — and goes to the escalation channel (`ESCALATION_CHANNEL`): card id, title, what is needed, who decides. When a channel is `unset`, escalate on the board only (comment + column) and do not report "message not sent" as a finding. Never @-mention the Flow bot yourself: a mention starts a workflow.

      ## Routing

      Any blocking finding → **Implementation**; the comment is the work order, specific enough that the developer need not re-derive it. Clean → **Merge and deploy to staging**. Cannot read the diff or the PR → `blocked` comment + escalation + **Blocked** (check the card for already-granted access first). A verdict that cannot be given until `{{inputs.product_owner}}` answers a product question → `blocked` comment naming the question, tag `needs-human-decision`, **Human-gated**; a question that does not block the verdict travels on a follow-up card (below) and this card routes on its findings. Never review from the implementation comment alone, never run the app or the suite, never merge.

      ## Follow-ups: a defect goes straight to Backlog; only a decision goes to Human-gated

      A non-blocking finding stays in your own comment: debt, a copy nit, a test gap outside the ACs, a deviation the spec is silent on, a small bug outside this story. That is enough in most cases. If it deserves its own card, decide which kind it is.

      **A. A bug.** Behaviour that contradicts an acceptance criterion or the spec, an unmet AC, a failing or flaky test, a crash, a wrong figure, or a requirement `{{inputs.product_owner}}` already stated in writing (the tracker ticket or a `decision` comment) that the code does not meet. Nobody has to decide anything; someone has to fix it.
      1. Create it in **Backlog**. Title: `<tracker key or card id> follow-up: <what>`. `task_type: bug`. Tags: `follow-up` and `bug`, plus the epic and area. Leave the assignee empty: the Planner assigns an agent when it releases the card. The description is the bug form: **What's wrong / Where** (route, file:line) **/ Evidence** (steps, screenshot, the card and comment it came from) **/ Done when**.
      2. **Leave it in Backlog.** The Planner releases it ranked first. Do not move it to Human-gated and do not release it yourself.

      **Small decisions: apply your own recommendation.** When a finding needs a choice, you can name the options and you would recommend one, check whether the choice touches any of these:
      1. legal, compliance, consent or privacy text, disclosures, or anything a user agrees to or signs;
      2. money: billing, pricing, fees, rates, plan limits, refunds, what anyone is charged or paid, or how a figure shown to users is calculated;
      3. something `{{inputs.product_owner}}` asked for in writing, or an approved vocabulary or design, that your recommendation would contradict or narrow;
      4. a credential, vendor account, access grant, or production infrastructure;
      5. deleting or irreversibly changing real data;
      6. the scope of an epic: a new story, or dropping or weakening an acceptance criterion.

      **None of them → it is a small decision. Do not file a card.** Take your recommendation as an assumption, carry on with your work on it, and post a comment tagged `assumption` on the card you are working: the question in one line, the options with their cost, what you chose and why, and what reversing it would take. A change to how an AC is worded is recorded in that comment, not by editing the AC. If you are unsure whether it is small: it is small when reversing it later would be an ordinary bug card. Examples of small: a layout or wrapping choice, a label's length, a default sort or count rule, whether an empty value is shown, a browser-native vs custom confirm, which existing component to reuse.

      **Any of them → kind B below.**

      **Look it up before kind B. A question the spec or the repo docs already answer is not a decision.** Before you file a kind B card, search these four, in this order, and quote what you find:
      0. **The product spec in the repo** at `SPEC_PATH`, read on `{{inputs.integration_branch}}` (a spec change on any other branch is not in force yet), and the planning artefacts in `PLANNING_DIR` with the open questions recorded in the spec. Unset, `unset`, or the file missing → write `spec: not available` and go on to 1. Read each requirement together with every `[AMENDED …]` / `[NEW …]` block under it; a later block beats the text above it.
      1. The tracker ticket (when the card title carries a key and a tracker tool is available): description and acceptance criteria, its parent epic, and its linked tickets. Search by the key and by the words of the question.
      2. The repo docs on the base branch: `CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md`, `docs/` and the architecture docs; for a UI question also the design source (`DESIGN_SOURCE`) and the decisions recorded in it.
      3. The board: `decision` comments (including answers from `{{inputs.product_owner}}`) on the card you are working, on its parent and intake cards, and on the cards it cites. A later comment beats an earlier one; a product decision by `{{inputs.product_owner}}` beats an engineering ruling.
      If any of them answers the question there is no card: post a comment tagged `decision` on the card you are working — the question in one line, the answer, and **Source:** the tracker key and field, or the file and section (with the amendment's date), or the comment id — and carry on under that answer. An acceptance criterion that contradicts a later spec amendment is applied as the spec says, and the AC change is recorded in that same comment, never by editing the AC. Only a question none of the four answers is kind B.

      **B. A decision a person must take.** A product or scope choice (`{{inputs.product_owner}}`), a legal or compliance question, a credential or access grant, or a change the spec would have to make first. The answer *is* the deliverable.
      1. Create it in **Backlog** with the same title form. Tags: `follow-up` and `needs-human-decision`. The description states the evidence, the card and comment it came from, the options and what each costs. It also says which of the four sources above you searched and why none of them answers; a kind B card without that line is sent back.
      2. Move it to **Human-gated** in the same session. A person decides there: they move it to Backlog, or archive it.

      A finding that is both (a bug whose fix needs a product choice) is filed as B, and the description says so. Never release a follow-up to Tech Design yourself and never leave a kind B card parked in Backlog. Say in your comment which follow-up cards you created, by id and kind (bug or decision).
    agent: code_reviewer
    tools:
    - board_get_task
    - board_get_comments
    - board_get_task_assets
    - board_add_comment
    - board_update_task
    - board_move_task
    - board_attach_asset
    - board_manage_tags
    - board_create_task
    - chat_post_message
    mcp_servers:
    - context7
    config_items:
    - SPEC_PATH
    - DESIGN_SOURCE
    - CI_CHECK_NAME
    - ESCALATION_CHANNEL
    - PLANNING_DIR
    - PR_MERGE_POLICY
    - INTAKE_CHANNEL
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
    sub_steps:
    - name: Repo-rules check on the diff (CLAUDE.md / AGENTS.md / CONTRIBUTING.md)
      instructions: |-
        Run on every PR. Read `CLAUDE.md`, `AGENTS.md` and `CONTRIBUTING.md` — whichever exist — on the PR's base and walk the **added and changed lines** of the diff against them. At minimum, check these rows (skip a row only when the diff has nothing it applies to):

        API contract — an added or changed endpoint, parameter or response shape with no matching change to the API schema or docs the repository keeps · authz — a new or changed action on user-, account- or organisation-scoped data without the permission check and scoping the rules require, or a policy change with no test for the denied role · serialization — a response built by hand where the rules mandate a serializer layer · migration — not reversible, not generated the documented way, or unable to apply after the base branch's latest · formatting — a number, money figure, percentage or duration rendered without the repository's formatting helpers where it has them · ui — a hand-rolled element where the component library has one, or a new shared component / one-off variant with no reason in the PR · architecture docs — a change to a documented decision, data flow or component with no update to the doc that describes it · any further rule the files state.

        Each hit on an added or changed line is a **blocking** finding (`file:line · rule · fix`) unless the story's spec states the exception in words. Problems in lines the PR did not touch are **not** blocking: list them once under non-blocking notes as `pre-existing`. Add a **Repo rules** line to the `review_findings` comment: `Repo rules: CLEAN` or `Repo rules: BLOCKING (n) — authz, migration…`.
      required: true
    - name: |-
        Follow-ups: a bug goes to Backlog, a small decision is your assumption, a big one goes to Human-gated
      instructions: |-
        Walk every non-blocking finding that deserves its own card (the rules are in the step): **bug** → Backlog, title `<tracker key or card id> follow-up: <what>`, `task_type: bug`, tags `follow-up` + `bug`, the bug form, no assignee, left in Backlog for the Planner · **small decision** (none of the six criteria) → no card, an `assumption` comment on the card you are working · **big decision** → first search the spec at `SPEC_PATH`, the tracker ticket, the repo docs and the board's `decision` comments, and quote the answer as a `decision` comment when one exists; only then a Backlog card tagged `follow-up` + `needs-human-decision` with the evidence, options, costs and the sources searched, moved to **Human-gated** in the same session for `{{inputs.product_owner}}`. A finding that is both a bug and a decision is kind B. Say in the `review_findings` comment which follow-ups you created, by id and kind.
      required: true
- key: merge_and_deploy
  name: Merge and deploy to staging
  description: |-
    Bound to the Merge and deploy to staging column. Merges the card's feature branch into `{{inputs.staging_branch}}` (merge commit `Merge branch '<branch>' into {{inputs.staging_branch}}`), pushes, and watches the `STAGING_DEPLOY_WORKFLOW` run for the pushed sha until its deploy jobs finish — every staging deployment comes from that branch and nowhere else. Runs no suite: the CI gate on the PR (`CI_CHECK_NAME`) is the evidence. Proves the deployment healthy (`STAGING_BASE_URL` + `HEALTH_PATH` answers 200, the card's own route responds, the project's error tracker shows nothing new), compares the deployed behaviour with the spec sections the card references when `SPEC_PATH` is set, records the deployed sha and the criteria that still need a browser, and hands the card to After Deploy (Human action) when a hand-run step is required, otherwise to Verify. The PR into `{{inputs.integration_branch}}` stays open; this stage never writes `{{inputs.integration_branch}}` or the production branch and never merges the PR. Red PR CI or a merge conflict → Implementation; failed deploy or migration, base-red → Blocked; missing credential or access → Human-gated.
  base:
    repositories:
    - app
  steps:
  - key: merge_into_staging_and_deploy
    name: Merge into the staging branch & deploy
    instructions: |-
      ## Archived cards

      Ignore archived cards: drop any board row with `archived: true` before acting on it, and if the card this run was started for is archived, do nothing and end with a one-line report. Duplicate checks are the exception: look with `include_archived: true` — archiving is a person's "not doing this", so an archived card for the same work means create nothing; name it in the report.

      ## Task

      Merge the card's feature branch into `{{inputs.staging_branch}}`, push, watch the staging deploy workflow (`STAGING_DEPLOY_WORKFLOW`) for the pushed sha until its deploy jobs (build, migrations, rollout) finish, prove the deployment answers, then hand the card to **After Deploy (Human action)** (hand-run ops required) or **Verify** (otherwise).

      Two things you do **not** do: run the suite (the CI gate on the PR already did) and merge the PR into `{{inputs.integration_branch}}` (or into a parent branch, for a stacked PR). When `PR_MERGE_POLICY` is `agent`, Verify merges the PR once it accepts; when it is `human`, the PR stays open for a person. Either way it is not this stage. A stacked branch (its `branch` comment names a `parent:`, the card description a `Base: #N`) is merged into `{{inputs.staging_branch}}` the same way; its parent is already there.

      **Branches you may write:** `{{inputs.staging_branch}}`, and only by a merge commit. Never push to `{{inputs.integration_branch}}`, `main` or a release branch; `main` / the production branch is released only by a human, and no stage of this board touches it.

      **Escalation.** Every `blocked` comment is also escalated. When the escalation channel (`ESCALATION_CHANNEL`) is set, post one message with `chat_post_message` — card id, title, what is needed, who decides (`{{inputs.delivery_lead}}` for access, credentials and delivery questions; `{{inputs.product_owner}}` for a product decision). If the card came from a chat message (its description or a comment links the thread), every message about the card is a **reply in that thread**; a new top-level message is only for an escalation. When the channel is `unset`, escalate on the board only — the comment plus the column — and do not report "message not sent" as a finding. Never @-mention the Flow bot yourself: a mention starts a workflow. A human's answer reaches the board only through Chat Intake (a message containing `triage` on the intake channel, `INTAKE_CHANNEL`, when it is set) or when a person moves the card; say so when you ask.

      ## Inputs

      The spec: if the card title carries a tracker key (`PROJ-123`) and a tracker tool is available in the session, the tracker ticket — description, acceptance criteria, parent epic, links — is the spec; otherwise the card description is. You never write to the tracker (no comments, no transitions). Then the `tech_design`, `implementation` and `branch` comments — branch, PR, what changed, and the **`ops_needed:`** list in the `implementation` comment (hand-run steps and infrastructure the environment needs). Credentials arrive tagged `credentials` or as `UAT_*` config items; refer to them by name only and never invent a value.

      The project repository is checked out at `/workspace/repo`. Read `CLAUDE.md`, `AGENTS.md` and `CONTRIBUTING.md` at the repository root — whichever exist — before changing anything; they are binding. No build machine is needed: a shell with `git` and `gh` for the project repository is enough.

      ## 1. Read the PR's CI run before you merge anything

      Read the `CI_CHECK_NAME` conclusion for the PR's **current head sha**, not the sha the CI gate resolved against: Implementation may have pushed since the gate closed.

      ```
      gh pr checks <pr-number>
      gh api repos/{owner}/{repo}/commits/<head-sha>/check-runs
      ```

      - `success` → merge.
      - `failure`, `cancelled`, `timed_out`, `action_required` → **do not merge.** `deploy` comment naming the failing job and the head sha, card back to **Implementation**. This is not Blocked: the branch is red and it already has an owner.
      - `queued` or `in_progress` → wait for it to finish. Never merge against a result you have not seen, and never treat a missing run as green; if it never resolves, that is the stale-gate case — `blocked` comment + escalation → **Blocked**.

      Merging into `{{inputs.staging_branch}}` is not gated by any check on the PR, so this read is the only evidence that what lands on staging was ever green. Record the conclusion and the head sha for the `deploy` comment.

      ## 2. Merge into `{{inputs.staging_branch}}`

      `{{inputs.staging_branch}}` is the only branch this stage writes. Every staging deployment is built from it.

      ```
      git fetch origin
      git checkout -B {{inputs.staging_branch}} origin/{{inputs.staging_branch}}
      git merge --no-ff origin/<feature-branch> -m "Merge branch '<feature-branch>' into {{inputs.staging_branch}}"
      git push origin {{inputs.staging_branch}}
      ```

      **Merge, never rebase; never force-push; never touch `{{inputs.integration_branch}}` or the production branch.**

      **A merge conflict is reported, never resolved here.** `git merge --abort`, push nothing. For every conflicting file list the `{{inputs.staging_branch}}` commits that touch it and whether they are already in `{{inputs.integration_branch}}` (`git log --oneline origin/{{inputs.integration_branch}}..origin/{{inputs.staging_branch}} -- <file>`; a merge commit's message names the branch, and so the card, that brought them). Post a `deploy` comment naming every conflicting file, those commits and the card they belong to, and move the card to **Implementation**. Say in the comment that the fix is made on the feature branch — rebase on `{{inputs.integration_branch}}`, or stack on the branch that owns the colliding commits when that card's PR is still open (`Base: #N`) — and **never by merging `{{inputs.staging_branch}}` into the feature branch**: the PR into `{{inputs.integration_branch}}` would then carry other cards' unreviewed work. Generated files and lockfiles are no exception: Implementation regenerates them after the rebase; nobody hand-edits them. Colliding commits that belong to no card and no open PR get a line in the comment and in the escalation: whether `{{inputs.staging_branch}}` is reset to `{{inputs.integration_branch}}` is `{{inputs.delivery_lead}}`'s call, not yours — the card still goes to Implementation.

      The one conflict you do resolve: `sprint-status.yaml` in `PLANNING_DIR`, when `PLANNING_DIR` is set — every branch edits it, so it is the expected conflict. **Keep both lines, each with its own status.** Never drop the other story's line, never take "ours" wholesale, never touch the header or an epic line. Name the resolution in the `deploy` comment. If any other file conflicts in the same merge, abort the whole merge as above.

      Record the resulting `{{inputs.staging_branch}}` merge commit sha. That sha is what Verify proves is live before it clicks anything.

      ## 3. Watch the staging deploy run until the deploy jobs finish

      A push to `{{inputs.staging_branch}}` triggers `STAGING_DEPLOY_WORKFLOW`, which builds, runs the migrations and deploys staging (`STAGING_BASE_URL`).

      ```
      gh run list --branch {{inputs.staging_branch}} --workflow "<STAGING_DEPLOY_WORKFLOW>" --limit 5
      gh run watch <run-id>
      gh run view <run-id> --log-failed
      ```

      Pick the run whose head sha is your merge sha and watch it until the deploy jobs have finished — a green test half with the deploy still running is not done. A missing run is never green.

      - Run **success**, deploy jobs included, for your `{{inputs.staging_branch}}` sha → continue.
      - A **deploy or migration job fails** / the run is **cancelled** → `deploy` comment with the failing job and a log summary → `blocked` comment + escalation → **Blocked** (retryable: the Planner retries it). Do not revert `{{inputs.staging_branch}}` yourself.
      - A job fails for a reason this card cannot explain (the same job fails on the previous `{{inputs.staging_branch}}` run or on `{{inputs.integration_branch}}`) → **base-red**: find the open `base-red` bug card or create one in **Backlog** with `board_create_task` (bug form; tags `bug`, `base-red`, `ci`; priority high; the failing job and the first failure quoted as evidence), `deploy` comment naming it, `blocked` comment + escalation → **Blocked**. It is not this card's failure.
      - A job fails because of this card's change → `deploy` comment naming the job and the failure → **Implementation**.
      - The run never starts → `blocked` comment naming that the workflow did not fire → **Blocked**.
      - A credential or access you do not have (a secret the workflow needs that nobody set, a deploy target you cannot reach) → `blocked` comment + escalation → **Human-gated**; never invent a value.

      **Do not** deploy any other way — no console clicks, no ad-hoc commands against the environment, nothing this stage has no credentials for. The `STAGING_DEPLOY_WORKFLOW` run is the deploy path.

      ## 4. Hand-run ops — write the runbook, never run it

      This stage **does not** create infrastructure, storage or service variables, and does not run seeds, backfills or one-off tasks on the environment. Migrations are already inside the deploy run; anything else goes to a person.

      Build the runbook from Implementation's `ops_needed:` list, plus anything the diff plainly needs that the list missed (say which entries you added). If the list says `none` and the diff agrees, there is no runbook.

      When there is one, post it as its **own comment tagged `ops_runbook`** — separate from `deploy`, so Verify and the person in After Deploy can find it. One numbered entry per step: the exact command (the repository's documented one), where to run it (which service or one-off task, per the repository's docs), expected output, done-when criterion, and variable **names** only, never values. End it with: *"When done, post a comment tagged `ops_done` with what was run and the observed output, then move the card to Verify."* Never claim you ran any of it.

      ## 5. Prove it answers — exactly this much

      - the `STAGING_DEPLOY_WORKFLOW` run **success**, deploy jobs included, for the `{{inputs.staging_branch}}` sha you pushed
      - `STAGING_BASE_URL` + `HEALTH_PATH` returns **200** — record the status code
      - **the card's own route or endpoint answers**, not just the health path — a green health check proves the app booted, not that this card shipped. A route that only works after the runbook is expected to fail now: record it and name the runbook entry it waits on.
      - runtime errors after the deploy: the project's error tracker, if one is configured, shows no new errors; otherwise the deploy run's logs

      **Not verified here and not to be claimed:** rendered content, copy, layout, client-side behaviour, or that a flow works end to end. Say "deployed and responding", never "working".

      **Name the unverified as a list.** Every acceptance criterion whose proof needs a browser goes under its own heading in the `deploy` comment — that list is Verify's queue. Something you noticed that the acceptance criteria do not cover (a migration that rewrites existing rows, a route that behaves differently until the runbook has run) → an `edge-case` comment and a bullet under `## Edge cases` in the card description, naming this stage; Verify walks every one of them.

      You write no status line of your own in `sprint-status.yaml` (keeping both sides of a merge conflict, § 2, is not a status change) and post no announcement — both belong to Implementation and Verify.

      ## 6. Spec check — only the sections this card touches

      After a healthy deploy and before you route, compare what you deployed with the product spec — **only the spec sections this card references** (the tracker ticket, the tech design or the card description name them; none named → the section that describes the card's surface). The spec is the file at the config item `SPEC_PATH`, read on `origin/{{inputs.integration_branch}}` (a spec change that exists only on `{{inputs.staging_branch}}` is not in force yet). `SPEC_PATH` unset, `unset`, or the file missing → write `spec check: not available` in the `deploy` comment and route as usual.

      Compare behaviour, not wording: what the code now does (routes, permissions, figures, states, limits) against what those sections and their `[AMENDED …]` / `[NEW …]` blocks say.

      - **Match** → `spec check: ok — <sections>` in the `deploy` comment.
      - **Drift** (the code does or allows something the spec does not say, or the spec promises something the card deliberately changed) → do **not** edit the spec; only Scope Change changes it, through a PR into `{{inputs.integration_branch}}`. First look for an open card titled `Spec update:` that already names the same section; if there is one, add a comment there instead of a new card. Otherwise create one with `board_create_task` — in **Backlog**, complete: title `Spec update: <section> — <one line>`, tags `spec-update` and `spec-drift`, `assignee_id` the agent assigned to this card, description with the spec section and its current text, what the deployed code does (files, route), the source card and its tracker key, and what the spec should probably say — then move it to **Needs Planning** (a card there with no assignee never starts its workflow). Post a comment tagged `spec-drift` on this card naming the new card, and `spec check: drift — <card id>` in the `deploy` comment. Drift never blocks this card.

      ## Close

      Comments first, move last. Lead the `deploy` comment with DEPLOYED / FAILED / BLOCKED.

      **Healthy, and the card needs a hand-run step** → `deploy` comment (deploy run URL/id, **the deployed `{{inputs.staging_branch}}` sha**, URL, observed status codes, **the PR CI conclusion and head sha from § 1**, the spec check line, and one line pointing at the `ops_runbook` comment) + the **`ops_runbook`** comment (§ 4) → **After Deploy (Human action)**.

      **Healthy, no hand-run ops** → the same `deploy` comment, no `ops_runbook` → **Verify**.

      **A red or unresolved PR CI run (§ 1)** → `deploy` comment naming the failing job and head sha → **Implementation**. Nothing was merged.

      **A merge conflict (§ 2)** → merge aborted, `deploy` comment naming the files, the commits and the card they belong to → **Implementation**. Nothing was pushed.

      **Failed deploy or migration, base-red** → failure logs in a `deploy` comment, `blocked` comment + escalation → **Blocked**. Do not roll forward blindly and do not revert `{{inputs.staging_branch}}` yourself. **Missing credential or access** → `blocked` comment + escalation → **Human-gated**.

      **Card arrived back from Verify with a stale-commit finding** → the running deployment does not contain this card's `{{inputs.staging_branch}}` merge. Wait for, or re-trigger, the `STAGING_DEPLOY_WORKFLOW` run on the latest `{{inputs.staging_branch}}` tip, then route again per Close above. An `ops_runbook` already marked by an `ops_done` comment is not re-issued unless the new tip changes what it has to do.
    agent: release_engineer
    tools:
    - board_get_task
    - board_get_comments
    - board_add_comment
    - board_update_task
    - board_move_task
    - board_attach_asset
    - board_manage_tags
    - board_create_task
    - board_list_members
    - chat_post_message
    config_items:
    - STAGING_BASE_URL
    - HEALTH_PATH
    - STAGING_DEPLOY_WORKFLOW
    - CI_CHECK_NAME
    - SPEC_PATH
    - ESCALATION_CHANNEL
    - PLANNING_DIR
    - PR_MERGE_POLICY
    - INTAKE_CHANNEL
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
    sub_steps:
    - name: Read the PR's CI run, then merge into the staging branch (conflict → Implementation)
      instructions: |-
        **First, read the PR's `CI_CHECK_NAME` conclusion for its CURRENT head sha** — `gh pr checks <n>` or `gh api repos/{owner}/{repo}/commits/<head-sha>/check-runs`. The sha the CI gate resolved against may be stale if Implementation pushed since, and merging into `{{inputs.staging_branch}}` is not gated by any check, so this read is the only evidence that what lands on staging was ever green.

        - `success` → merge.
        - `failure` / `cancelled` / `timed_out` / `action_required` → **do not merge**; `deploy` comment naming the failing job and head sha, card to **Implementation**. Not Blocked — the branch is red and has an owner.
        - `queued` / `in_progress` → wait; never merge against a result you have not seen, and never treat a missing run as green. Never resolving is the stale-gate case: `blocked` comment + escalation → **Blocked**.

        Record the conclusion and the head sha for the `deploy` comment.

        Then: `git fetch origin`, `git checkout -B {{inputs.staging_branch}} origin/{{inputs.staging_branch}}`, `git merge --no-ff origin/<feature-branch> -m "Merge branch '<feature-branch>' into {{inputs.staging_branch}}"`, `git push origin {{inputs.staging_branch}}`. **Merge, never rebase; never force-push; never push to `{{inputs.integration_branch}}`, `main` or a release branch.** The PR into `{{inputs.integration_branch}}` is not yours to merge (Verify merges it when `PR_MERGE_POLICY` is `agent`; a person when it is `human`). A stacked branch (`parent:` in its `branch` comment) merges the same way.

        **A merge conflict goes back to Implementation; do not resolve it here.** `git merge --abort`, push nothing, `deploy` comment naming every conflicting file, the `{{inputs.staging_branch}}` commits that touch it (`git log --oneline origin/{{inputs.integration_branch}}..origin/{{inputs.staging_branch}} -- <file>`) and the card they belong to, card to **Implementation**. Say in the comment that the fix is a rebase on `{{inputs.integration_branch}}` (or a stack on the owning card's branch, `Base: #N`, while its PR is open) — never merging `{{inputs.staging_branch}}` into the feature branch. Colliding commits owned by no card → also a line in the escalation for `{{inputs.delivery_lead}}`. The only exception is `sprint-status.yaml` in `PLANNING_DIR` (when set): keep both lines, each with its own status, and name the resolution.

        Record the resulting `{{inputs.staging_branch}}` merge sha: it is what Verify proves is live before it clicks anything.
      required: true
    - name: Write the `ops_runbook`; never run ops or provision infrastructure yourself
      instructions: |-
        Build the runbook from the `ops_needed:` list in Implementation's `implementation` comment, plus anything the diff plainly needs that the list missed (say which you added). This stage does **not** create infrastructure, storage or service variables and does not run seeds, backfills or one-off tasks — migrations are already inside the `STAGING_DEPLOY_WORKFLOW` run. Post the runbook as its **own comment tagged `ops_runbook`**, separate from `deploy`: numbered entries, each with the exact command (the repository's documented one), where to run it (which service or one-off task, per the repository's docs), expected output, done-when, variable names only. End it with the instruction to post an `ops_done` comment and move the card to Verify when done. Never claim you ran any of it. `ops_needed: none` and the diff agrees → skip.
      required: false
    - name: Watch the staging deploy run until the deploy jobs finish
      instructions: |-
        A push to `{{inputs.staging_branch}}` triggers `STAGING_DEPLOY_WORKFLOW`, which builds, runs migrations and deploys staging. Find the run for the `{{inputs.staging_branch}}` sha you pushed with `gh run list --branch {{inputs.staging_branch}} --workflow "<STAGING_DEPLOY_WORKFLOW>" --limit 5`, then `gh run watch <run-id>` until the deploy jobs have finished (`gh run view <run-id> --log-failed` on failure). A green test half with the deploy still running is not done.

        - Success, deploy jobs included → continue.
        - Deploy or migration job failed / run cancelled → `deploy` comment with the failing job and a log summary, `blocked` comment + escalation → **Blocked** (retryable); do not revert `{{inputs.staging_branch}}`.
        - A job red for a reason this card cannot explain (also red on the previous `{{inputs.staging_branch}}` run or on `{{inputs.integration_branch}}`) → base-red: find or create the `base-red` bug card in **Backlog** (tags `bug`, `base-red`, `ci`, priority high, the failing job and first failure as evidence), `deploy` comment naming it, `blocked` comment + escalation → **Blocked**.
        - A job red because of this card's change → `deploy` comment → **Implementation**.
        - Run never starts → `blocked` comment → **Blocked**.
        - A credential or access you do not have → `blocked` comment + escalation → **Human-gated**; never invent a value.

        **Do not** deploy by any other route (console, ad-hoc commands). Never treat a missing run as green.
      required: true
    - name: Prove it answers, and name what you did not prove
      instructions: |-
        The `STAGING_DEPLOY_WORKFLOW` run success, deploy jobs included, for your sha; `STAGING_BASE_URL` + `HEALTH_PATH` returns 200, with the status code recorded; **the card's own route or endpoint answers**, not just the health path (a route that only works after the runbook may fail now — record it and name the runbook entry it waits on); runtime errors checked (the project's error tracker if one is configured, otherwise the deploy run's logs). Rendered content, copy, layout, client behaviour and end-to-end flows are **not** verified here — say "deployed and responding", never "working". Every acceptance criterion whose proof needs a browser goes in the comment as its own list (Verify's queue). Anything you noticed that the criteria do not cover → `edge-case` comment + a bullet under `## Edge cases` in the description, naming this stage. You write no status line in `sprint-status.yaml` and post no announcement.
      required: true
    - name: Post the deploy comment, then route After Deploy or Verify
      instructions: |-
        Comments first, move last. Before routing, run the **spec check** (§ 6) on the sections this card references, only when `SPEC_PATH` is set: `spec check: ok — <sections>` / `drift — <Spec update card id>` / `not available` goes into the `deploy` comment. Drift creates (in Backlog, complete, with an assignee, then moved to Needs Planning) or extends a `Spec update:` card, leaves a `spec-drift` comment here, and never blocks this card; you never edit the spec.

        The `deploy` comment, led by DEPLOYED / FAILED / BLOCKED: deploy run URL/id, **the deployed `{{inputs.staging_branch}}` sha**, URL, observed status codes, the PR CI conclusion and head sha, the spec check line, and — when there is a runbook — one line pointing at the separate `ops_runbook` comment (posted per the earlier sub-step).

        - `ops_runbook` posted → **After Deploy (Human action)**
        - No hand-run ops → **Verify**

        The PR into `{{inputs.integration_branch}}` stays open. Red PR CI or a merge conflict → **Implementation** (nothing merged or pushed). Failed deploy or migration, or base-red → `blocked` comment + escalation → **Blocked**, no revert of `{{inputs.staging_branch}}`. Missing credential or access → `blocked` comment + escalation → **Human-gated**. Back from Verify with a stale-commit finding → wait for, or re-trigger, the deploy run on the latest `{{inputs.staging_branch}}` tip and route again; an `ops_runbook` already answered by `ops_done` is not re-issued unless the new tip changes it.
      required: true
- key: verify
  name: Verify
  description: |-
    Bound to the Verify column. Goes to the real staging app (`STAGING_BASE_URL`), reads the `UAT_*` config items, logs in as the role each acceptance criterion names, sets up whatever data the card needs through the UI as a user would, walks each acceptance criterion and every `## Edge cases` item in a browser (an API-only card against the deployed endpoint), compares each changed screen with the design source (`DESIGN_SOURCE`) when one is linked, and attaches a screenshot per criterion. No suite, no diff. Cards with an outstanding `ops_runbook` belong in After Deploy (Human action), not here — if Verify finds missing data that only a hand-run command can create, return the card there. A card with no UI and no API surface cannot be tested and passes straight through. Accepted or untestable: re-read the PR's `CI_CHECK_NAME` for the current head sha, post the `verify_report`, land the PR per `PR_MERGE_POLICY` (`agent` = merge into `{{inputs.integration_branch}}` and, when `PLANNING_DIR` is set, set the story `done` in `sprint-status.yaml`; `human` = the PR stays open for a person), report short in the card's intake thread when it has one, card to Done. Rejected: numbered findings and card to Implementation. Stale live commit → Merge and deploy to staging; missing credential, access or decision → Human-gated; staging unreachable or an un-sandboxed external service → Blocked.
  base:
    repositories:
    - app
  steps:
  - key: verify_on_staging
    name: Verify the card on real staging
    instructions: |-
      ## Archived cards

      Ignore archived cards: drop any board row with `archived: true` before acting on it, and if the card this run was started for is archived, do nothing and end with a one-line report. Duplicate checks are the exception: look with `include_archived: true` — archiving is a person's "not doing this", so an archived card for the same work means create nothing; name it in the report.

      ## Task

      Open the deployed staging app (`STAGING_BASE_URL`), prove the card does what its spec promises, and say **ACCEPTED**, **REJECTED** or **BLOCKED**. No suite, no diff — CI proved the branch, Code Review read it. Use the Playwright MCP browser tools (or the browser tools attached to this stage) for every walk; the project's skills, if any are attached, say how the team likes them driven.

      **The spec.** If the card title carries a tracker key (`PROJ-123`) and a tracker tool is available in the session, the tracker ticket — description, **acceptance criteria**, parent epic, links — is the spec. Otherwise the card description is the spec. You never write to the tracker (no comments, no transitions). Read `CLAUDE.md`, `AGENTS.md` and `CONTRIBUTING.md` at the repository root (`/workspace/repo`) — whichever exist — for anything the walk depends on; they are binding. The card's `## Edge cases` block is part of its contract: every bullet added up to Code Review is walked like an acceptance criterion.

      **Chat.** Verdicts go to the card's source thread only: when `INTAKE_CHANNEL` is set and the card came from a chat message (its description or a comment links the thread), post two or three lines there with `chat_post_message` as a **reply in that thread** — never a new top-level message. A card with no thread, or an unset `INTAKE_CHANNEL`, gets no chat verdict; the board comment is the record. Escalations — a card you move to Blocked or Human-gated — go to the escalation channel (`ESCALATION_CHANNEL`): card id, title, what is needed, who decides, and how the answer gets back (a message containing `triage` in the intake channel when `INTAKE_CHANNEL` is set, otherwise a human moves the card). When a channel is `unset`, escalate on the board only (comment + column) and do not report "message not sent" as a finding. Never @-mention the Flow bot yourself: a mention starts a workflow.

      **Hand-run ops come first.** Before anything else, look for comments tagged `ops_runbook` and `ops_done`. An `ops_runbook` counts as done only when an `ops_done` comment was posted **after** it. An `ops_runbook` with no later `ops_done`, or a walk that needs data only a hand-run command creates → `verify_blocked` naming the runbook entry or the missing data → **After Deploy (Human action)**. Do not invent a shell path and do not skip the criterion quietly. When `ops_done` reports a deviation from the runbook, read it and walk against what was actually done.

      ## How

      - **Live commit contains this card.** Take the card's staging merge sha (from the `deploy` comment, or from a later `sweep` comment when it names one) and the head sha of the latest `STAGING_DEPLOY_WORKFLOW` run on `{{inputs.staging_branch}}` whose deploy jobs **succeeded** (`gh run list --workflow <STAGING_DEPLOY_WORKFLOW> --branch {{inputs.staging_branch}} --limit 5`, then `gh run view <id>`), and check `git merge-base --is-ancestor <merge-sha> <deployed-sha>`; plus `STAGING_BASE_URL` + `HEALTH_PATH` answers 200. If the app exposes a release/version identifier, use it as the deployed sha. **Later deploys of other cards are expected** — a deployed sha that descends from the merge is a match. Only when the merge is not contained → `verify_blocked` naming both shas, card to **Merge and deploy to staging**. Never treat a missing run as green. Staging not answering at all is **Blocked** (retryable), not a finding against the card.
      - **Credentials** come only from the `UAT_*` config items: `UAT_LOGIN` / `UAT_PASSWORD` (an ordinary test user) and `UAT_ADMIN_LOGIN` / `UAT_ADMIN_PASSWORD` (an administrator); a team may add more roles as `UAT_<ROLE>_LOGIN` / `UAT_<ROLE>_PASSWORD`. Check the card's `credentials` comments too. Log in through the app's own login flow, as a user would. Never invent or substitute a value; a role the walk needs that no item covers → `blocked` naming the item → **Human-gated**. A login challenge you cannot complete with the provided credentials (a second factor, a one-time code, a captcha, a single-sign-on step) is **BLOCKED**, not a defect: the walk stops, the card goes to Human-gated naming what the challenge needs.
      - **Roles.** Walk each AC as the role it names. Roles and memberships below the administrator are set up **through the UI** with the admin account, on data namespaced to this card (an organisation, project or workspace you created for it; the ordinary account given the role the AC needs). A role you cannot set up through the UI is a finding or an unexercised AC with the reason — never a DB edit. For permission ACs, walk the allowed role **and** at least one role that must be refused, and quote the refusal the user sees.
      - **Data isolation.** When the product separates data by organisation, account or workspace and the card touches that boundary, check as a user of a **second** one that the first one's data is not visible by navigation or by direct URL. A leak is blocking.
      - **Prepare your own data through the UI**, as a user would. A criterion reachable only by an unlinked URL, an internal API or a DB edit is a finding, not a shortcut for you to take. Data that only arrives through an integration (an ingest endpoint, a CLI, a webhook) is created the way the card or the repository docs describe; if that needs a credential you do not have, the AC is unexercised with the reason or the card is Human-gated.
      - **Walk every acceptance criterion**, screenshot each, attach with `board_attach_asset`. API-only card: call the deployed endpoint on `STAGING_BASE_URL` with a real session or token and paste request and response. Two states per criterion — **observed** or **unexercised** with the reason. Record the broken copy, raw i18n keys and 500s you pass on the way, and check the project's error tracker, if one is configured, for errors raised during your walk — the UI check below decides which of them block.
      - **Use the Verification plan** in the `tech_design` comment when there is one: it names the account, the data and its source for each AC. Data it says a staging data step creates and that is missing → `verify_blocked` → **After Deploy (Human action)**, naming the `ops_runbook`.
      - **Edge cases:** walk every bullet of the card's `## Edge cases` block (and every `edge-case` comment) like an acceptance criterion — observed or unexercised with the reason, a screenshot each. A failed edge case is a failed criterion. An edge case you discover here is **not** added to the card: file it as a bug (below) and say so in the report.
      - **Device-only criteria do not hold the card.** A criterion that only a real phone can show (a native back gesture, switching apps, push, the native keyboard, safe areas) is not walked here: walk everything a browser can show, including the 375 px view, mark the AC `unexercised — needs a device` in your table, and accept on everything else — unless `{{inputs.product_owner}}` ruled in writing that it must be seen on a device before acceptance.
      - **Staging is shared:** namespace what you create to this card, **delete nothing**, never change another card's data, and never change a shared test account's password, second factor, language or settings — put back anything you had to switch (a language, a theme) before you log out. Mail the walk cannot read is **unexercised**, not failed. Never complete, or simulate as completed, a real payment, signature or other external side effect; stop at the last safe step and record the criterion unexercised. An external service that is not sandboxed or not available on staging → the criterion is unexercised naming the service; when the card's promise cannot be shown at all without it → **Blocked**.
      - **No UI and no API surface** (a background job, a workflow definition, a migration, an architecture guard, a lint rule, a refactor) → nothing to test here: say so, name where each criterion's proof lives, pass through.

      ## UI check — a card that works but looks broken is not accepted

      Walking the ACs proves the card works; this section proves it can be shown to users. Run it on **every screen the card adds or changes** (skip it only for a card with no UI). Do it after the AC walk, on the same data.

      **What to compare against** — read these before you look, in this order:
      1. the **design source** (`DESIGN_SOURCE`), when the card, the tracker ticket, the `tech_design` comment or the `design` comment links a screen in it — a frame in a design file, a page of a deployed reference build (open it in a second tab, read-only, with the ordinary `UAT_*` account), or a section of a `DESIGN.md`; then the card's `design` comment, with the corrections of a `design_approved` comment when there is one;
      2. the existing component library and the current screens of the app;
      3. one existing screen of the same kind (another list, another settings form, another dashboard widget) — the new screen must look like its siblings.
      No design for the screen → compare against 2 and 3 and say so in the report. A linked design you cannot open (no tool for it, no exports attached to the card, the URL does not answer) → the design comparison is **unexercised** with that reason in the UI table — not a rejection, and not a pass.

      **Walk each screen through four checks, with a screenshot for each:**

      1. **Layout** at **1440**, **768** and **375** px wide. Resize the window; do not trust one width. In the page, check `document.documentElement.scrollWidth > window.innerWidth` (horizontal page scroll) and look for overlapping or clipped elements, text cut off with no way to read it, buttons pushed off-screen, dialogs taller than the viewport with no scroll, tables or charts that break the page instead of scrolling inside their container.
      2. **Matches the design:** the design's layout, components, hierarchy, states, entry points and copy are there — fields and labels, table columns, filters, actions, empty and error states. List every visible deviation from what the design states explicitly, except the divergences the tech design lists (the spec wins there). Compare layout, components, states and copy — **not** the data in the mock: example numbers, names and values in a frame are placeholders, never a finding. Visual polish may differ; missing content or behaviour may not.
      3. **Consistent with the system:** shared components from the project's component library used, not look-alikes (tables, page headers, badges, empty states, confirm dialogs, form fields); numbers, dates, times and money formatted the same way as on sibling screens (the shared formatters, and the rules of the project's `DESIGN.md` when the design source is one); spacing, headings and button placement the same as the sibling screen.
      4. **Text, states and access:**
         - no raw i18n keys (`something.like_this`), no "translation missing", no placeholder text; if the app offers more than one language, switch to another one: nothing left untranslated, nothing overflowing because the other language is longer — then switch the account back to the language you found it in before you log out, since the choice may be saved on a shared account;
         - if the app offers a dark theme (or follows the OS colour scheme): switch once; everything legible, no white-on-white or invisible borders/icons;
         - **empty**, **loading** and **error** states: provoke each one that the screen can have (no rows, slow response, a validation error, a permission refusal) — every refusal must be **shown to the user** in words, not swallowed;
         - long real-world values (a long name, a large amount or count, a long email) do not break the layout;
         - every control reachable and operable by keyboard with visible focus; fields labelled; disabled controls look disabled; text contrast at the WCAG 2.1 AA ratio.

      **Blocking** — any one → **REJECTED**, even when every AC is observed:
      - the layout breaks on a card screen at any of the three widths (horizontal page scroll, overlap, clipped or unreachable control);
      - a raw i18n key, a "translation missing", placeholder text or an untranslated string shown to the user;
      - an error or refusal that the user is not shown;
      - unreadable in a theme or language the app offers;
      - the screen contradicts something the design or the spec states explicitly;
      - against a linked design: a different layout, a different component, a state the design shows that the screen does not have, or a field, action or state the design has and staging lacks without a listed divergence;
      - a hand-built look-alike where a shared component exists for the same job;
      - an accessibility failure (unreachable by keyboard, an unlabelled field, contrast below AA).

      **Not blocking** — record, do not reject: a cosmetic deviation from the linked design in spacing, colour or copy (**file it as a bug** in Backlog, citing the design and the screenshot), spacing or alignment nits, a deviation where the design is silent, and anything that was already wrong on a screen **this card did not touch** (mark it `pre-existing`; the card is not rejected for someone else's screen).

      **Report:** in the `verify_report` (or `verify_findings`), a **UI** table — one row per screen × check: width / theme / language → what you saw → screenshot → `ok` / `blocking` / `note`, with a screenshot pair (staging, design) per screen that has a linked design. Blocking UI findings go into `verify_findings` numbered like any other, reproducible from a cold start, with the width, theme and language that shows them.

      ## The PR's CI run is read before you accept

      An accepted walk on staging is not evidence that the branch is green: the walk and the checks prove different things, and the sha the CI gate resolved against may predate a later push. Immediately before you write the verdict — and again immediately before a merge — read the `CI_CHECK_NAME` conclusion for the PR's **current head sha**:

      ```
      gh pr checks <pr-number>
      gh api repos/{owner}/{repo}/commits/<head-sha>/check-runs
      ```

      - `success` → continue.
      - `failure` / `cancelled` / `timed_out` / `action_required` → **do not move the card to Done and do not merge.** `verify_findings` naming the failing job and the head sha, card to **Implementation**, and say the card was accepted on staging but its PR checks are red. This is not Blocked: the branch is red and it has an owner.
      - `queued` / `in_progress` → wait for it to resolve (`gh run watch`) rather than accepting against an unknown result.
      - no run for the head sha at all → not green. Say so; a missing run is never success.

      Record the conclusion and the head sha in the `verify_report`.

      ## Your report is the evidence

      There is no mechanical done gate. When you move a card to **Done**, the `verify_report` must say:

      - **where the capability is reachable from** — a route and a link, or the entrypoint and its caller if it has no HTTP surface;
      - **what actually exercised it, and on which environment.** A unit test is not a traversal. The home page returning 200 is not the card's surface;
      - **what you could not drive, and why** — unexercised, named, not quietly omitted;
      - for a card with **no runtime at all** (docs, a guard, a lint rule): say so plainly rather than dressing it up as a traversal.

      If you cannot state one of those honestly, **do not move it to Done** — leave the card in Implementation with the gap named.

      ## Then

      **ACCEPTED** means every acceptance criterion and every `## Edge cases` item is observed — or unexercised for a reason this text allows (unreadable mail, a service not sandboxed on staging, a device-only criterion, a design you could not open), named in the report — and no blocking UI finding. **ACCEPTED / nothing to test** → read the PR's CI conclusion per the section above → `verify_report` (URL, live sha and the card's merge sha it contains, one row per AC and edge case: role → what you did → what you saw → screenshot, **the UI table from the UI check**, the PR CI conclusion and head sha, the reachability and traversal statements above, the `ops_done` comment id when there was a runbook, and the PR's fate: merged into `{{inputs.integration_branch}}`, or open for a person) → land it per `PR_MERGE_POLICY` (below) → 2–3 lines as a reply in the card's source thread, if it has one → **Done**. Done is terminal; no tag marks it.

      **Landing, by policy:**
      - `PR_MERGE_POLICY` = `agent` → land it through one merge:
        1. **Planning status** (`PLANNING_DIR` set): in one commit on the PR branch, set `review → done` on this story's key in `PLANNING_DIR/sprint-status.yaml`, plus the epic rollup line — `done` only when **every** story of that epic is `done`, counted from the story headings in `PLANNING_DIR/epics.md`, not only from the keys already in the yaml (a story in `epics.md` with no key has not been built yet, so the epic stays `in-progress`); any story of the epic not `done` while the line reads `done` → `in-progress`; else leave — and `last_updated`. Fetch first; never regenerate the file from `epics.md`, never touch other stories' lines. This is the only write to `sprint-status.yaml` in this stage. `PLANNING_DIR` unset → the board alone is the plan; write nothing.
        2. Re-read `CI_CHECK_NAME` for the head sha you are about to merge (a status commit moves it; red → `verify_findings` → **Implementation**, pending → wait).
        3. Merge the PR into `{{inputs.integration_branch}}` with the merge style the repository documents (`CLAUDE.md` / `CONTRIBUTING.md`; none documented → `gh pr merge --merge`); never rebase onto or force-push the integration branch. Delete the branch after it merges — the code is in `{{inputs.integration_branch}}`, nothing is lost. A conflict with `{{inputs.integration_branch}}` → do not resolve it here: `verify_findings` saying the card is accepted on staging but unlanded, card to **Implementation**. Under this policy Done means merged, so stacked branches never reach this stage.
      - `PR_MERGE_POLICY` = `human` → merge nothing and write nothing to the repository: leave the PR open and say in the `verify_report` and the thread that the PR waits for a person. A card in Done may then still have an unmerged PR; that is expected under this policy.
      - Nothing here touches `main` / the production branch, which is released only by a human.

      **REJECTED** (a failed AC, a failed edge case, **or a blocking UI finding**) → `verify_findings`, numbered and reproducible from a cold start, described as a user → one line as a reply in the card's source thread, if it has one → **Implementation**. Nothing to revert: only acceptance lands anything.

      **`ops_runbook` without a later `ops_done`, or hand-run data missing** → `verify_blocked` → **After Deploy (Human action)**.

      **Missing credential, access grant, a login challenge you cannot complete, or a human decision** → `blocked` comment + escalation (card id, title, what is missing, what you tried, who from) → **Human-gated**.

      **BLOCKED** (staging unreachable, an external service not available or not sandboxed on staging) → `blocked` comment + escalation → **Blocked**.

      Never leave the card in Verify with the verdict written — that state is indistinguishable from one nobody started.

      ---

      **A defect goes straight to Backlog; only a decision goes to Human-gated.**

      A non-blocking finding stays in your own comment: debt, a copy nit, a deviation the spec is silent on. That is enough in most cases. If it deserves its own card, decide which kind it is.

      **A. A bug.** Behaviour that contradicts an acceptance criterion or the spec, an unmet AC, a failing or flaky test, a missing translation, a crash, a wrong figure, a cosmetic deviation from the linked design, or a request `{{inputs.product_owner}}` already made in writing that the code does not meet. Nobody has to decide anything; someone has to fix it.
      1. Create it in **Backlog** with `board_create_task`. Title: `<key> follow-up: <what>`, where `<key>` is the tracker key, else the story id (`E.S`) from `PLANNING_DIR`, else the card id. `task_type: bug`. Tags: `follow-up` and `bug`, plus the epic and area. Leave `assignee_id` empty: the Planner assigns an agent when it releases the card. The description is the bug form: **What's wrong / Where** (route, file:line) **/ Evidence** (steps, screenshot, the card and comment it came from) **/ Done when**.
      2. **Leave it in Backlog.** The Planner releases it like any other Backlog card. Do not move it to Human-gated and do not release it yourself.

      **Small decisions: apply your own recommendation.** When a finding needs a choice, you can name the options and you would recommend one, check whether the choice touches any of these:
      1. legal, compliance, consent or agreement text, disclosures, privacy or data-retention terms, or anything a user signs;
      2. money: billing, pricing, plans, fees, refunds, what anyone is charged or paid;
      3. something `{{inputs.product_owner}}` decided in writing, or an approved design, that your recommendation would contradict or narrow;
      4. a credential, vendor account, access grant, role or permission model, or production infrastructure;
      5. deleting or irreversibly changing real data;
      6. the scope of an epic: a new ticket or story, or dropping or weakening an acceptance criterion.

      **None of them → it is a small decision. Do not file a card.** Take your recommendation as an assumption, carry on with your work on it, and post a comment tagged `assumption` on the card you are working: the question in one line, the options with their cost, what you chose and why, and what reversing it would take. A change to how an AC is worded is recorded in that comment, not by editing the AC. If you are unsure whether it is small: it is small when reversing it later would be an ordinary bug card. Examples of small: a layout or wrapping choice, a label's length, a default sort or count rule, whether an empty value is shown, a browser-native vs custom confirm, which existing component to reuse.

      **Any of them → kind B below.**

      **Look it up before kind B. A question the spec or the docs already answer is not a decision.** Before you file a kind B card, search these four, in this order, and quote what you find:
      0. **The product spec in the repository**, read on `{{inputs.integration_branch}}` (a spec change that is only on `{{inputs.staging_branch}}` is not in force yet): the path is the config item `SPEC_PATH`, and the planning artefacts in `PLANNING_DIR` (`epics.md`) when set. Unset, `unset`, or the file missing → write `spec: not available` and go on to 1. Read each requirement together with every dated `[AMENDED]` / `[NEW]` block under it — a later block beats the text above it; an open question recorded in the spec is not an answer.
      1. The tracker ticket (when the card carries a key and a tracker tool is available), its parent epic and its linked tickets — description, acceptance criteria and comments.
      2. The repository's own docs: `CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md`, `docs/`, the architecture docs.
      3. The board: `decision` comments on the card you are working, on its parent and intake cards, and on the cards it cites. A later comment beats an earlier one; a product decision by `{{inputs.product_owner}}` beats an engineering ruling.
      If any of them answers the question there is no card: post a comment tagged `decision` on the card you are working — the question in one line, the answer, and **Source:** the ticket key and field, or the file and section, or the comment id — and carry on under that answer. An acceptance criterion that contradicts a later documented product decision is applied as the decision says, and the AC change is recorded in that same comment. Only a question none of the four answers is kind B.

      **B. A decision a person must take.** A product decision (`{{inputs.product_owner}}`) or scope choice, a legal or security question, a credential or access grant (`{{inputs.delivery_lead}}`), or a change the spec would have to make first. The answer *is* the deliverable.
      1. Create it in **Backlog** with the same title form. Tags: `follow-up` and `needs-human-decision`. The description states the evidence, the card and comment it came from, the options and what each costs. It also says which of the four sources above you searched and why none of them answers; a kind B card without that line is sent back.
      2. Move it to **Human-gated** in the same session. A person decides there: they move it to Backlog, or archive it.

      A finding that is both (a bug whose fix needs a product choice) is filed as B, and the description says so. Never release a follow-up to Tech Design yourself and never leave one parked anywhere but Backlog (bug) or Human-gated (decision). Say in your comment which follow-up cards you created, by id and kind (bug or decision).
    agent: uat_tester
    tools:
    - board_get_board_info
    - board_get_task
    - board_get_comments
    - board_get_task_assets
    - board_add_comment
    - board_update_task
    - board_move_task
    - board_attach_asset
    - board_manage_tags
    - board_create_task
    - chat_post_message
    - promote_asset
    mcp_servers:
    - playwright
    config_items:
    - STAGING_BASE_URL
    - HEALTH_PATH
    - STAGING_DEPLOY_WORKFLOW
    - CI_CHECK_NAME
    - SPEC_PATH
    - PLANNING_DIR
    - DESIGN_SOURCE
    - PR_MERGE_POLICY
    - ESCALATION_CHANNEL
    - INTAKE_CHANNEL
    - UAT_LOGIN
    - UAT_PASSWORD
    - UAT_ADMIN_LOGIN
    - UAT_ADMIN_PASSWORD
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
    sub_steps:
    - name: 'Triage: is there a UI or API surface to test?'
      instructions: |-
        No UI and no API surface — a background job, a workflow definition, a migration, an architecture guard, a lint rule, a refactor — means nothing to test here. Short `verify_report` naming the absence and where each criterion's proof lives, then close it out (sub-step 7) and **Done**. Any doubt → it has a surface: open the browser.
      required: true
    - name: Check hand-run ops are done, then prove the live commit
      instructions: |-
        **Ops first.** An `ops_runbook` counts as done only when an `ops_done` comment was posted after it. No later `ops_done` → `verify_blocked` naming the outstanding entries → **After Deploy (Human action)**, and stop. When `ops_done` reports a deviation, walk against what was actually done.

        Then prove the card is live: the card's staging merge sha (from the `deploy` comment, or a later `sweep` comment that names one) must be an ancestor of the head sha of the latest green `STAGING_DEPLOY_WORKFLOW` run on `{{inputs.staging_branch}}` (`git merge-base --is-ancestor <merge-sha> <deployed-sha>`); also `STAGING_BASE_URL` + `HEALTH_PATH` = 200. Later deploys of other cards are a match, not a mismatch. Not contained → `verify_blocked` naming both shas → **Merge and deploy to staging**. Staging unreachable → **Blocked**. Never treat a missing run as green.
      required: true
    - name: Read the credentials from config items
      instructions: |-
        `UAT_LOGIN` / `UAT_PASSWORD` and `UAT_ADMIN_LOGIN` / `UAT_ADMIN_PASSWORD`, plus any `UAT_<ROLE>_LOGIN` / `UAT_<ROLE>_PASSWORD` the team added, and the card's `credentials` comments. Missing what the walk needs → `blocked` comment naming the item + escalation → **Human-gated**. Never guess or substitute a credential. A login challenge you cannot complete with the provided credentials is BLOCKED (Human-gated), not a defect; mail the walk cannot read makes that criterion **unexercised**, not failed.
      required: true
    - name: Set up the data through the UI, then walk each acceptance criterion and edge case per role
      instructions: |-
        Prepare the data **through the UI, as a user would**, namespaced to this card; use the tech design's Verification plan when there is one. Walk every AC by real navigation (Playwright MCP) as the role it names; roles are set up through the UI with the admin account, never a DB edit; permission ACs get the allowed role **and** at least one refused role. Data-isolation check when the card touches an organisation/account boundary. Screenshot each criterion with `board_attach_asset`, quoting the on-screen text; API-only → request and response pasted. Observed or unexercised with the reason. Walk every `## Edge cases` bullet and `edge-case` comment the same way; a failed edge case is a failed criterion; new ones found here are bugs, not additions. Record broken copy, raw keys and 500s; check the error tracker if one is configured. Delete nothing, touch no other card's data or shared account settings, never complete a real external side effect.
      required: true
    - name: 'UI check: design source, layout, consistency, text, states and access'
      instructions: |-
        On every screen the card adds or changes (skip only for no UI), after the AC walk. Compare against, in order: the linked screen in the design source (`DESIGN_SOURCE`) and the `design` / `design_approved` comments; the component library and current screens; one sibling screen. Layout at 1440, 768, 375 px; design (layout, components, states, copy — never the mock's example data); consistency (shared components, formatters, spacing); text and states (raw keys, other language and back, dark theme, empty/loading/error, refusals in words, long values, keyboard, labels, AA contrast). Blocking → **REJECTED**: layout break, raw key or placeholder, swallowed error, unreadable theme or language, contradiction of the design or spec, wrong component/layout or missing state against a linked design, look-alike component, accessibility failure. Cosmetic design deviation → a `bug` card in Backlog. Linked design not accessible → `unexercised`, not a rejection. Put the UI table in the report.
      required: true
    - name: Post the verdict comment
      instructions: |-
        **Accepted / nothing to test** → `verify_report`: URL, live sha and the merge sha it contains, one row per AC and edge case (role → what you did → what you saw → screenshot asset), the UI table, the PR CI conclusion and head sha, reachability and traversal statements, anything unexercised with its reason, the `ops_done` id when there was a runbook. **Rejected** → `verify_findings`: numbered, each reproducible from a cold start (URL, role, steps, what was promised, what appeared, screenshot, width/theme), described as a user, not as a patch.
      required: true
    - name: 'Close out: PR CI re-check, land per PR_MERGE_POLICY, report short in the thread'
      instructions: |-
        Accepted or nothing-to-test only. Run no suite. **0.** Read `CI_CHECK_NAME` for the PR's CURRENT head sha (`gh pr checks <n>`): red → `verify_findings` naming the job and sha → **Implementation**; pending → wait; no run → not green. **1.** The report states reachability, what exercised it where, and what was not driven — else leave the card in Implementation with the gap named. **2.** `PR_MERGE_POLICY` = `agent` → when `PLANNING_DIR` is set, one commit on the PR branch setting the story `done` (and the epic rollup, `last_updated`) in `sprint-status.yaml`; re-read the CI check for the new head; merge into `{{inputs.integration_branch}}` with the repository's documented merge style; delete the branch; conflict → Implementation. `human` → merge and write nothing, the PR stays open; say so. **3.** Card came from a chat message and `INTAKE_CHANNEL` is set → two or three lines as a thread reply: card id, key and title, verdict, what now exists with the staging URL, the PR link and whether it is merged. No thread → no chat post.
      required: false
    - name: Move the card
      instructions: |-
        Last action, after the comment, the assets and the landing. **Accepted, or no UI/API surface** → **Done** (terminal, no tag). **Rejected** → **Implementation**, one line in the source thread if it has one. **Stale live commit** → **Merge and deploy to staging**. **`ops_runbook` without a later `ops_done`, or hand-run data missing** → **After Deploy (Human action)**. **Missing credential, access, an uncompletable login challenge or a human decision** → `blocked` + escalation → **Human-gated**. **Staging unreachable or an un-sandboxed external service** → `blocked` + escalation → **Blocked**. Escalations go to `ESCALATION_CHANNEL` when set, otherwise the board only. Never leave the card in Verify with the verdict written.
      required: true
    - name: |-
        Follow-ups: a bug goes to Backlog, a small decision is your assumption, a big one goes to Human-gated
      instructions: |-
        Non-blocking findings stay in your comment unless they deserve a card. **Bug** → Backlog, title `<key> follow-up: <what>`, `task_type: bug`, tags `follow-up` + `bug` + epic/area, no assignee, bug-form description; leave it in Backlog. **Small decision** (touches none of: legal/consent, money, a written product-owner decision or approved design, credentials/permissions/production, irreversible data, epic scope) → apply your recommendation, `assumption` comment, no card. **Before a kind B card** search the spec at `SPEC_PATH` (and `PLANNING_DIR`) on `{{inputs.integration_branch}}`, the tracker ticket, the repository docs, the board's `decision` comments; an answer → `decision` comment with its Source. **Decision** → Backlog with tags `follow-up` + `needs-human-decision`, evidence, options and costs, the sources searched → **Human-gated** in the same session. Never release a follow-up yourself; name the cards you created by id and kind.
      required: true
- key: blocked_sweep
  name: Blocked Sweep → After Deploy
  description: |-
    Manual, human-started, unbound. Sweeps every non-archived card in Blocked and Human-gated and classifies it: needs a hand-run step on staging (→ After Deploy (Human action) with an `ops_runbook`), blocked only by the staging deploy (→ Verify / After Deploy if already live on staging, else Merge and deploy to staging), blocker already cleared with a citation (→ the column it was blocked in, or Backlog if never started), misfiled (engineering work parked in Human-gated or a procure-and-configure card → Backlog; a person-gated card in Blocked → Human-gated), or still blocked (retryable / work-gated / human-gated — untouched, blocker named). Without an input asset it only reports; run it again with the reviewed report attached as `sweep-approved.md` to apply exactly the rows in that file.
  base:
    repositories:
    - app
  steps:
  - key: classify_and_apply_moves
    name: Classify Blocked & Human-gated, then apply the approved moves
    instructions: |-
      ## Your Task

      The board has an **After Deploy (Human action)** column for stories that are deployed to staging but need a hand-run step on the environment before they can be verified. Some cards in **Blocked** and **Human-gated** are there only because a seed or script had to be run, or because the staging deploy itself was unavailable at the time; others are there although their blocker has already cleared, or are in the wrong one of the two columns. Find them all and propose one move per card. A human started this run and a human approves the moves.

      **Mode.** Look in `/workspace/assets/` for a file named `sweep-approved.md` (it is optional and usually absent). Present → **APPLY**: execute exactly the rows in that file, nothing else. Absent → **REPORT**: classify every card, write the report, **move and comment on nothing**.

      ## Inputs

      Every card in **Blocked** and **Human-gated** — skip any card whose `archived` flag is set, before counting anything. For each: description, tags, the full comment thread (`blocked`, `deploy`, `verify_*`, `implementation`, `credentials`, `decision`, `watchdog`, `unblock_validation`), gates (`board_list_gates`), its column history, and the sessions that blocked it (`session_list` / `session_log`) when the comments do not say why. If the card title carries a tracker key (`PROJ-123`) and a tracker tool is available in the session, read the ticket, its parent epic and its links too — read-only; you never write to the tracker. When `PLANNING_DIR` is set, `sprint-status.yaml` there is read-only for you.

      The project repository at `/workspace/repo`: `{{inputs.integration_branch}}`, `{{inputs.staging_branch}}`, and `gh run list --branch {{inputs.staging_branch}} --workflow "<STAGING_DEPLOY_WORKFLOW>"` for what staging (`STAGING_BASE_URL`) is actually running. Follow the repository rules in `CLAUDE.md`, `AGENTS.md` and `CONTRIBUTING.md` at the repository root — whichever exist; they are binding.

      ## The test that sorts the two columns

      **Blocked** holds only cards that come back on their own: *retryable* (the cause was the environment — an expired machine window, an unusable clone, a run that died, staging briefly unreachable; back to the column it was blocked in, capped at 2 retries per blocker) and *work-gated* (the blocker is code that does not exist yet and another card owns it; a `watchdog` comment names that card, and the card returns when it reaches Done). **Human-gated** holds cards whose answer comes from a person: a product decision (`{{inputs.product_owner}}`), a missing credential or access grant (`{{inputs.delivery_lead}}`), a permission the pipeline deliberately lacks. Apply it literally: not "is this blocked?" but "would the unblocking answer come from a person or from a merge?" A card that is only *partly* human-gated is split, not parked. **Procure-and-configure cards** — real work once a credential exists — belong in **Backlog** as release candidates.

      ## Categories — exactly one per card

      - **A · Needs a hand-run step.** The only remaining blocker is a seed, backfill, one-off task or script that must run on the deployed environment (or infrastructure a person must create). Destination: **After Deploy (Human action)** — only if the story's `{{inputs.staging_branch}}` merge is contained in the sha of the latest *successful* `STAGING_DEPLOY_WORKFLOW` run (`git merge-base --is-ancestor <merge-sha> <deployed-sha>`). Not yet on staging → **Merge and deploy to staging** (it will route to After Deploy itself).
      - **B · Deploy-only.** The blocker was the staging deploy itself — a failed or missing deploy run on `{{inputs.staging_branch}}`, staging unreachable, a stale staging sha — and nothing else. Story already on staging per the test above → **Verify** (or **After Deploy** if it also needs a hand-run step — then it is A+B, say so). Not on staging → **Merge and deploy to staging**. A deploy-era blocker for work that is not yet built → the column it was blocked in.
      - **C · Blocker cleared.** The thing it waited on now exists or was decided — **with a citation a person can open**: a card + comment id, a `decision` comment, a tracker ticket or comment, or `file:line` @ sha on `{{inputs.integration_branch}}` (or `{{inputs.staging_branch}}`). Destination: the column it was blocked in (from history / the `blocked` comment); never started (blocked from Backlog, or no branch) → **Backlog**; a decision that disposes of the question with nothing to build → **Done**. Suspected but not citable → it is E.
      - **D · Misfiled.** In the wrong column by the test above. Ordinary engineering work parked in Human-gated (a render gap, a docs sweep, missing test coverage, a defect already fixed — cite the fix) or a procure-and-configure card → **Backlog**. A card in Blocked whose answer would come from a person (no retry cleared it, no card owns the work) → **Human-gated**. A card that is partly both → propose the split in the evidence column; the card itself stays.
      - **E · Still blocked.** Anything else, in the right column. Name the blocker in one clause and its kind — *retryable* (and the attempt count against the cap of 2), *work-gated* (the owning card; flag a missing `watchdog` or an owner card that is missing, archived or Done), or *human-gated* (who answers). Never moved by this sweep; retries and watchdogs stay with the Planner.

      Commands in old comments: write the exact command a person would run on staging (the repository's documented command, on the service or one-off task the repository's docs name). If you cannot state it with confidence, write it as-is and flag `needs-translation`.

      ## Output

      `/workspace/outputs/blocked-sweep-report.md`: summary counts per category and per column, then one table per category sorted by card id — `id | title | column | category | evidence (quote + comment id / file:line) | destination | runbook entries (A only)`. For A, include the full draft `ops_runbook` text per card (exact command, where it runs, expected output, done-when, variable names only — never values). For E, list Human-gated cards with the person who answers, so nothing there goes invisible. End with: *"To apply, delete the rows you don't want and re-run this workflow with this file attached as a run input asset named `sweep-approved.md`."*

      ## APPLY mode

      Per row, in this order — comment first, move last:
      - Re-check each row's card is still in the column the file says and still not archived; changed → skip it and say so. Rows for category E are never applied.
      - A → post the `ops_runbook` comment (the draft from the file) ending with *"When done, post `ops_done` and move the card to Verify"*, then move.
      - B / C / D → one comment tagged `sweep` (≤ 8 lines): category, the evidence and citation, destination, and that the old blocker text is superseded. For C and D cards going to Backlog, prepend a `## Decision — <date> (sweep)` block to the description and move stale blocker text under `## Superseded (kept for history)`; delete nothing; remove the gating tag the evidence clears. A D card moved to Human-gated names who answers and is escalated: one message to the escalation channel (`ESCALATION_CHANNEL`) when it is set — otherwise the board only, and "message not sent" is not a finding. A human's answer reaches the board only through Chat Intake (a message containing `triage`) or when a person moves the card.
      - Moving into Merge and deploy to staging, Verify or Implementation fires that workflow immediately — the card must be complete first (branch, PR and the comments that stage reads). A card moved into Needs Planning needs an assignee or its workflow never starts.
      - Never write a secret, never invent a credential, never touch the repository or the tracker; this sweep only comments, tags, edits descriptions and moves cards.
      - Append an **Applied** section to the report: per row, done / skipped + why.
    agent: planner_sm
    tools:
    - board_get_board_info
    - board_list_tasks
    - board_get_task
    - board_get_comments
    - board_get_task_assets
    - board_add_comment
    - board_update_task
    - board_move_task
    - board_manage_tags
    - board_list_gates
    - session_list
    - session_log
    - chat_post_message
    config_items:
    - STAGING_DEPLOY_WORKFLOW
    - STAGING_BASE_URL
    - PLANNING_DIR
    - ESCALATION_CHANNEL
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
- key: task_qa
  name: Task Q&A
  description: |-
    Manual only — a manual column trigger (a run button on the card) on each column that has no automation (Backlog, Blocked, Human-gated, After Deploy (Human action)). Opens an interactive session on one card: reads the card, its tracker ticket when the title carries a key, its comments, its gates and its assets, then verifies every claim against the spec hierarchy and the code on `{{inputs.integration_branch}}` before answering. Answers what the card is, what is actually missing, and which of the board's blocker kinds applies — work-gated, human-gated, retryable, or simply unstarted. Read-only: it never moves a card, never edits one, and never releases work. Leaves a `question_answer` comment only when asked.
  base:
    repositories:
    - app
  steps:
  - key: answer_questions
    name: Answer questions about the card
    instructions: |-
      ## Your Task

      Answer questions about the card this run was started from. Deliver a complete, standalone briefing first, then stay available for follow-up questions.

      **The briefing has to stand on its own.** This run may be started by someone who then asks nothing — so never open with "what would you like to know?" and never wait for input before doing the work. Produce the full answer, then invite questions.

      ## The briefing

      Read the card, its comments, its gates (`board_list_gates`) and its attached assets, then its spec: if the card title carries a tracker key (`<KEY>`) and a tracker tool is available in the session, the tracker ticket — description, acceptance criteria, parent epic, links — is the spec; otherwise the card description is the spec. Then check what the card claims against the tree. Cover:

      - **What the card is** — the ask in one or two sentences, in plain terms.
      - **Where it sits** and how it got there — its column, and what its comments say happened. In After Deploy: whether its `ops_runbook` has a later `ops_done`.
      - **What is actually missing** — the verified answer, and which blocker kind applies: nothing (already done), work-gated, human-gated, retryable, or unstarted.
      - **Anything in the card that is no longer true.** State it explicitly, with what you checked.
      - **What it would take to finish** — concretely, in the order it would have to happen.

      Then invite follow-up questions and answer them until the user is done.

      ## Verify before you answer

      The card's text is a claim. Check it against `{{inputs.integration_branch}}` (and `{{inputs.staging_branch}}`, for what is deployed) in the mounted project repository — `git log`, `git show <ref>:<path>`, `git ls-files`, `rg` for the named constant, service, table or column. When a card says something is missing, look for it: cards regularly claim something is missing that has already shipped, wait on a blocker another card has already discharged, or name a card that never existed.

      Corroborating sources, when the card points at them, in this order: (1) the spec at `SPEC_PATH` and, when `PLANNING_DIR` is set, `epics.md`, `story-dependency-graph.md` and `sprint-status.yaml` for the story id (`E.S`), plus the open questions recorded in the spec; (2) the tracker ticket, its epic and links; (3) the repository's own docs — `CLAUDE.md`, `AGENTS.md`, `docs/`, architecture docs; (4) `decision` comments on this card and linked cards. A product decision by `{{inputs.product_owner}}` beats an engineering ruling. A ticket or story marked done whose code you cannot find is a discrepancy — report it as one.

      If the card names a related card or ticket, read it too rather than trusting the reference.

      **Blocker kinds:** *work-gated* — code that does not exist yet (name the card that owns it, or say none does); *human-gated* — the answer comes from a person, not a merge (say whose: `{{inputs.product_owner}}` or `{{inputs.delivery_lead}}`); *retryable* — the environment (the Planner retries, max 2 per blocker); *unstarted*. A Blocked card waiting on a person belongs in Human-gated; a Human-gated card that is ordinary engineering work belongs in Backlog — say so.

      ## Output

      The briefing and the answers live in the conversation. Say what you verified and how, and name what you could not verify instead of filling the gap.

      Leave a `question_answer` comment on the card **only if the user asks you to** — then only the verified findings, not the transcript.

      You have no tool to move or edit a card, which is deliberate. If the answer is that the card should move, be re-scoped or be closed, say so and let the user do it.
    agent: card_analyst
    tools:
    - board_get_board_info
    - board_list_tasks
    - board_get_task
    - board_get_comments
    - board_get_task_assets
    - board_add_comment
    - board_list_gates
    config_items:
    - SPEC_PATH
    - PLANNING_DIR
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
- key: chat_intake
  name: Chat Intake
  description: |-
    Triggered by a message containing the word `triage` in the intake channel (`INTAKE_CHANNEL`). Reads the message, its thread and attached files, checks them against every column of the board, the spec at `SPEC_PATH`, the planning artefacts in `PLANNING_DIR` when set, the tracker ticket when a key is given and the shipped code on `{{inputs.integration_branch}}`, then does the smallest correct thing: answer in the thread, comment on an existing card, unblock a Blocked or Human-gated card (a `decision`, a design, a design-review verdict), record `ops_done` for an After Deploy card, file a reproducible bug or a small story-shaped ask as a Backlog card and release it, or park an unclear bug or a feature of real size in Needs Planning for Scope Change. Never collides with work in flight. Read-only on the repository and the tracker; always replies in the thread.
  base:
    repositories:
    - app
  steps:
  - key: triage_message_and_act
    name: Triage message & act
    instructions: |-
      ## Archived cards

      Ignore archived cards: drop any board row with `archived: true` before acting on it, and if the card this run was started for is archived, do nothing and end with a one-line report. Duplicate checks are the exception: look with `include_archived: true` — archiving is a person's "not doing this", so an archived card for the same work means create nothing; name it in the report.

      ## Task

      A message containing the word `triage` arrived in the intake channel (`INTAKE_CHANNEL`). Work out what
      it asks for, then do the **smallest correct thing** — which is often not a new card. Read-only on the
      repository and on the tracker: you never push, and you never comment on or transition a ticket.

      **One word, one door.** Only messages containing `triage` reach you; a reply to an escalation without
      it does not. If someone asks why nothing happened, tell them to say it again with `triage`. You never
      post in the escalation channel (`ESCALATION_CHANNEL`), but read the escalation's thread when a message
      here answers it, and say which escalation it clears.

      **Reply in the thread** of the triggering message (`chat_post_message` into that thread). Never start a
      new top-level message.

      ## Board

      `Backlog → Needs Planning → Tech Design → [Design] → Implementation → CI check → Code Review → Merge and
      deploy to staging → [After Deploy (Human action)] → Verify → Done`, with **Blocked** and **Human-gated**
      off to the side. **Needs Planning** holds asks too large to build as-is and bugs that need triage
      (Scope Change). **After Deploy (Human action)** holds deployed cards waiting for a person to run their
      `ops_runbook`. **Done** is terminal; with `PR_MERGE_POLICY` `human` its PR may still be open.

      ## 1. Establish what exists

      **Start in `/workspace/input/`**: attached files are downloaded there (`Workspace Input Index` lists
      them). **A message that is only the trigger word plus a few words while that directory holds files is not
      empty — the ask is in the files.** If the directory is empty, say that you checked it.

      Read the message **and its whole thread** (`chat_read_thread`) — the reply that matters is often three
      messages down. Then, in order:

      1. The open cards in **every** column, including Needs Planning, Blocked, Human-gated, After Deploy
         (Human action) and Done — their `implementation`, `deploy`, `ops_runbook`, `verify_report`,
         `blocked` and `decision` comments say what was built, what shipped and what stalled.
      2. The product spec at `SPEC_PATH`, read on `{{inputs.integration_branch}}` (`unset` → skip), and,
         when `PLANNING_DIR` is set, `epics.md` and `sprint-status.yaml` there (a planned story is planned
         work even without a card).
      3. The tracker ticket, when the message or a card names a key (`<KEY>`) and a tracker tool is in the
         session — read-only.
      4. The shipped code on `{{inputs.integration_branch}}`. Code only on `{{inputs.staging_branch}}` is not
         shipped — it counts only if a card in the pipeline carries it.

      Only then decide.

      ## 2. Route it — exactly one

      **Question, opinion, FYI** → answer in the thread from what you found. Create nothing. This is the most
      common outcome and a success. Design questions are answered from the design source (`DESIGN_SOURCE`).

      **Already covered** by an open card, a planned story or ticket, a parked ask, the spec or shipped code
      → say so with the link; add the message's detail as a comment there if it adds anything. Never a second
      card for the same thing. A case a card in flight must handle → an `edge-case` comment on it plus a
      bullet under `## Edge cases` in its description (marked `chat intake`).

      **Credentials or access for a blocked card** → section 3.

      **An answer to a Blocked or Human-gated card** — a decision, an access grant, a design for a
      `design-needed` card, a verdict on a design review → section 3b.

      **Hand-run ops reported done** for a card in After Deploy (Human action) → section 3a.

      **A clear, reproducible bug** (what happens, where, what was expected, evidence given) or **a small,
      story-shaped ask** (one surface, one done-when, no new dependencies) → create a card (section 4) and
      release it.

      **A feature of real size** — needs its own acceptance criteria across several surfaces, a product
      decision, or dependency links to account for it — **or a bug you cannot reproduce from what was given**
      → create the card **in Backlog** (section 4), then move it to **Needs Planning**, and say in the thread
      that Scope Change triages it first. A card created directly in Needs Planning never starts Scope
      Change: the column's workflow fires only on a move *into* it, and only for a card that has an assignee.

      **Genuinely ambiguous** → one sharp clarifying question in the thread, then stop. A guess becomes a
      vague card and a wasted Tech Design session.

      ## 3. Credentials onto a blocked card

      Prefer a config item: if the value belongs in one (a staging account — `UAT_*`, a new role as
      `UAT_<ROLE>_LOGIN` / `UAT_<ROLE>_PASSWORD` — or a token the pipeline reads by name), say which config
      item a project admin should set and do not ask for the value in chat. When the card itself must carry
      it, comment tagged `credentials`: what was provided, which service, **which environment** (staging and
      production values look identical), client-side or server-side — a server-side secret in a comment is
      replayed into every later session on that card, so say it must be rotated once the card lands. Then move
      the card back to the column it was blocked in and confirm both in the thread.

      Never paste a credential into the thread yourself. If a person posted one in the channel, say so in
      your reply so they can rotate it.

      ## 3a. Hand-run ops done for a card in After Deploy

      A person says they ran the steps from a card's `ops_runbook` (the card must be in **After Deploy
      (Human action)**). Match what they report against the runbook entry by entry.

      - **Every entry reported, output as expected** → comment tagged **`ops_done`**: what was run, where,
        the observed output as they gave it, any deviation from the runbook, and a link to the thread → move
        the card to **Verify** → confirm both in the thread.
      - **Some entries missing, or the output does not match the runbook's done-when** → do not post
        `ops_done` and do not move the card. Reply naming exactly which entries are still outstanding or look
        wrong.
      - **The runbook failed because the script itself is wrong** → comment quoting the failure, move the
        card to **Implementation**, say so in the thread.

      Never write `ops_done` for steps nobody said they ran.

      ## 3b. Answers for Blocked and Human-gated cards

      Find the card and read its `blocked` comment and history: which column parked it, and why.

      - **A decision or a grant** — product questions are `{{inputs.product_owner}}`'s, delivery, access and
        credentials `{{inputs.delivery_lead}}`'s → comment tagged `decision`: the ruling, who made it, when,
        the thread link. Move the card back to the column it was parked from (a ruling that leaves nothing to
        build → **Done**). Leave the assignee as it was.
      - **A design for a `design-needed` card** → comment tagged `design` with the link, attach any files
        (`board_attach_asset`), card back to **Design**.
      - **A verdict on a Human-gated design review** → approved: comment tagged `design_approved`, card to
        **Implementation**; changes requested: comment tagged `design_feedback` quoting it, card back to
        **Design**.
      - **A retryable or work-gated Blocked card** is the Planner's (next cycle, or its `watchdog` card). Add
        anything new as a comment; do not move it.

      Reply naming the card, the comment and the column.

      ## 4. Creating a card

      **`board_create_task` targets Backlog** — never a column with a workflow bound to it, and not Needs
      Planning either. Entry into an automated column fires that workflow immediately, against whatever the
      card holds at that instant. Create it, fill it in, then move it.

      **Assignment — every card you create gets one**: a card entering an automated column without an
      assignee never starts. Candidates are the project's agent members (`board_list_members`). Rotation:
      after the most recently created card with an agent assignee, the next agent in id order, wrapping, down
      the batch. Skip an agent whose latest runs failed with "Quota exceeded" or "login has expired" until a
      later run succeeds; all failing → rotate anyway and say so. No agent members → create it unassigned in
      Backlog, do not move it, and say nothing will run until one is added.

      **Content:** title naming the thing being changed, not the mechanism it resembles (prefix the tracker
      key when one is named). Then *where* (route, screen, service, file),
      *evidence* (quote the message, link the thread, add what you found in the code), *done when*, the design
      link if the message gives one, known edge cases in a `## Edge cases` block (each bullet marked `chat
      intake`), and tags: `change` for an ask, `bug` + `bug-report` for a bug, `story-<id>` when
      `PLANNING_DIR` is set and the ask maps to a story (`E.S`) there.

      **A bug card**, `task_type: bug`: **What's wrong** (quoted) / **Where** (route, screen, role) /
      **Steps to reproduce** / **Expected** / **Evidence** (files from `/workspace/input/` attached with
      `board_attach_asset`, thread link) / **Done when**. A defect in a card still in flight → evidence on that
      card, no second card; a regression in a Done card → new card with `Fixes #<card>`.

      Several asks in one message → several cards, or one Needs Planning item. Never one mushy card.

      **Before releasing:** in flight (Tech Design to Verify) at `{{inputs.wip_cap}}` or more → leave it in
      Backlog for the Planner. Then compare its footprint with every card in flight, in After Deploy (Human
      action) and, with `PR_MERGE_POLICY` `human`, every Done card whose PR is open — the `paths:` line in its
      `branch` comment, else its description. Same files → leave it in Backlog and say so. Otherwise
      **Backlog → Tech Design**.

      **Your authority ends there.** Never move a card already in Tech Design, Design, Implementation, CI
      check, Code Review, Merge and deploy to staging, Verify or Done. The exceptions are moving a card *out
      of* Blocked or Human-gated (section 3b) and *out of* After Deploy (Human action) (section 3a).

      ## 5. Always reply

      Every run ends with a thread reply: what you did and why, links to anything created or updated, who
      each new card went to — including the runs where you created nothing. If a write failed, say which and
      finish the session as failed.
    agent: intake_triager
    tools:
    - board_get_board_info
    - board_list_tasks
    - board_get_task
    - board_get_comments
    - board_get_task_assets
    - board_add_comment
    - board_update_task
    - board_move_task
    - board_attach_asset
    - board_manage_tags
    - board_create_task
    - board_list_members
    - chat_post_message
    - chat_read_thread
    - promote_asset
    config_items:
    - SPEC_PATH
    - PLANNING_DIR
    - PR_MERGE_POLICY
    - INTAKE_CHANNEL
    - ESCALATION_CHANNEL
    - DESIGN_SOURCE
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
    sub_steps:
    - name: Create every card in Backlog, then move it and check it moved
      instructions: |-
        Before any `board_create_task` call:
        1. The target column is **Backlog**, always — including a card meant for Needs Planning or Tech Design. Never create a card in a column with a workflow bound to it, and never in Needs Planning.
        2. The assignee is an active agent member of the project (`board_list_members`), in the rotation from section 4. No agent members → leave it unassigned in Backlog and say so in the thread.
        3. Only after the card is created, filled in and its evidence attached, move it to its target column with `board_move_task`.
        4. For every card you moved, check it: it must now be in the target column, and if the target is Needs Planning or Tech Design a workflow run must have started on it (`board_get_task` → recent workflow runs). Say in the thread reply that you checked.
      required: true
- key: progress_report
  name: Progress Report
  description: |-
    Scheduled twice a week, unbound. Reads the code on `{{inputs.integration_branch}}`, the board, the staging deploy history and — when `PLANNING_DIR` is set — the planning artefacts, cross-checks the status file against the code, and compiles a stakeholder snapshot for {{inputs.product_owner}} and the team: what changed since the previous report, the plan for the week, what is live and accepted, how it was built where it matters, a completion figure with its counting method, what remains as counts, and what needs a decision or an action from whom. Delivered as a short message plus one self-contained HTML document: attached to a `Progress report <date>` card on the board, and posted to the intake channel (`INTAKE_CHANNEL`) when one is set. Read-only on the repository.
  base:
    repositories:
    - app
  steps:
  - key: compile_progress_report
    name: Compile & deliver the progress report
    instructions: |-
      ## Task

      Compile the progress report and deliver it as **a short message plus one self-contained HTML document**: attached to a report card on the board, and posted to the intake channel (`INTAKE_CHANNEL`) when one is set. Audience: the stakeholders — {{inputs.product_owner}} and the team — at programme-management level. They want to know where the programme stands, what is live, how it was built where the approach carries a consequence, how far along the whole programme is, and what needs a decision or an action from them. **Read-only on the repository.**

      This step runs on a schedule, **twice a week**. The HTML report is a **snapshot, not a diff**: describe the programme as it stands at this moment. Never compute a window and never narrate a period — no `--since` / `--after` on git (except for the two blocks below), no "since the last report", no "N stories moved", no comparison against an earlier report. Someone who has read none of the previous reports must get a complete and correct picture from this one alone; someone who reads them all sees the movement by comparing two snapshots.

      **Two exceptions**, both for the reader who wants to read the update in two minutes and know where we are, what changed and where we are headed: the update opens with **what changed since the previous report** (what reached staging or was accepted since the date of the latest `Progress report <date>` card in Done — none → the last seven days — taken from the board's `deploy` and `verify_report` comments with those timestamps) and carries **the plan for the week**. Everything else stays a snapshot.

      ## Writing for the stakeholders

      - Plain product language. No internal column names ("Human-gated", "After Deploy"), no agent, workflow or pipeline vocabulary, no commands. Name the feature and the screen ("the checkout page's total line", "the list's top strip"), not the card: a card id, tracker key or PR link may follow a line in brackets, but the line must stand without it — {{inputs.product_owner}} may not open the board, and a bare number means nothing to a reader who cannot.
      - Describe how a thing works today and what we are adding, as the plan it is. Never write "gap", "known issue", "deferred", "blind spot", "bug count" or defect statistics. A problem that stops progress is named as *what we need* and *from whom*, not as a fault.
      - No effort or duration estimates, ever. Dates come only from an agreed plan — the spec at `SPEC_PATH` or the planning artefacts in `PLANNING_DIR` — never from your own forecast.
      - "Needs a decision or an action" lists, first, what {{inputs.product_owner}} owes (decisions) and what {{inputs.delivery_lead}} owes (access, credentials, accounts, documents), each with the date it was first asked; then what the team is doing about anything else that blocks progress.
      - No brand voice, no marketing register, no project-specific wording: plain and declarative.

      ## Sources, in order of authority

      1. **The code on `{{inputs.integration_branch}}` as it stands now** — ground truth. `git log --first-parent -n 40` for the current tip of the merge history, `git show <ref>:<path>` / `git ls-files` to confirm a thing really exists, `git diff --stat` against a named ref for scale. `{{inputs.staging_branch}}` carries the same work earlier, before acceptance.
      2. **The merged PRs behind those commits**, with the cards they came from (`gh pr list --state merged --base {{inputs.integration_branch}}`, `gh pr view`).
      3. **The board** — where every non-archived card sits **now**: Done, Blocked, Human-gated, After Deploy (Human action), Needs Planning, or an automated column. The `tech_design`, `implementation`, `review_findings`, `deploy`, `ops_runbook`, `ops_done`, `verify_report`, `decision` and `assumption` comments carry the *how*, already written by the agents that did the work; a card that was sent back is visible as its current column plus its findings comments. Cards tagged `report` are earlier reports: leave them out of every list and every count.
      4. **The staging deploy history** — `gh run list --workflow <STAGING_DEPLOY_WORKFLOW> --branch {{inputs.staging_branch}}`: which sha is live, when it went out, whether the latest run is green; staging (`STAGING_BASE_URL`) answering at `HEALTH_PATH`. A missing run is never green.
      5. **The planning artefacts, when `PLANNING_DIR` is set** — `sprint-status.yaml` (the status line per story), `epics.md` (every story and its epic: the denominator), `story-dependency-graph.md` (waves, critical path — what the completed work has unblocked and what the next wave is waiting on). When unset, the board alone is the plan: count by cards.
      6. **The tracker, when a card title carries a tracker key and a tracker tool is available** — the ticket's status, epic and links, read only. Never write to the tracker.
      7. **The spec at `SPEC_PATH`, when set** (read on `{{inputs.integration_branch}}`) — the open questions recorded there that still gate work.

      **Cross-check 5 against 1.** A story marked `done` whose code you cannot find on `{{inputs.integration_branch}}` is a discrepancy, not a completion — report it and count it as not done. Likewise a Done card whose PR is neither merged nor open. When the board and the code disagree, the code wins and you say the board was wrong.

      **Deployed is not accepted.** A story merged into `{{inputs.staging_branch}}` and deployed there is live but may still be walking in Verify — or waiting in After Deploy (Human action) for a hand-run step before Verify can walk it. A card in Done has been accepted in a browser (its `verify_report`). Whether accepted also means merged depends on `PR_MERGE_POLICY`: `agent` — Verify merged the PR into `{{inputs.integration_branch}}`, so Done means merged and landed; `human` — the PR may still be open for a person, so write "accepted, awaiting merge" and count it as accepted but not landed. Say which of those states anything you name is in, and never call something accepted without evidence: a `verify_report` on the card, or a check you performed in this run.

      ## Completion figure

      State the method inline: *"~18% — 26 of 145 stories done, counted by story, not weighted by size."* With `PLANNING_DIR` set, count the stories of `epics.md` against `sprint-status.yaml` cross-checked with the code; without it, count non-archived cards in Done against all non-archived cards (`report` cards excluded) and say so. Use the same method every run so consecutive snapshots are comparable; if it has to change, say so and give both numbers. Per-epic breakdown for the epics on the critical path (without planning artefacts: per epic or theme as the board groups them). Say what the number does not capture. **Never present an estimate as a measurement** — if the status file and the code disagree enough that the number is unreliable, give a range and say why.

      ## The report

      English. Sections, in this order:

      - **Headline** — one sentence on where the programme stands today.
      - **What you can do now that you couldn't at the last report** — first, at the top, the same items as the message's first block (see Deliver), expanded: for each one, who it is for (which user role), where it is (the screen, reached how), what it did before, what it does now, and **how to try it on staging** in one or two plain steps (which test role — an ordinary user or an administrator, the roles the `UAT_*` config items define — which menu, what to click, what to look for; never a credential). Say whether it is accepted or on staging and still being checked. Nothing new → say so in one line and name what is in progress.
      - **This week** — the plan for the week (see Deliver, block 3), expanded: each item in product terms with where it stands now (in progress, on staging being checked, accepted ✓), and what each one depends on if it depends on something. Then **On deck after that** — what the pipeline takes up next, in dependency order.
      - **What is live** — deployed and accepted on staging, in product terms rather than ticket titles, grouped by epic. Aggregate at capability level; do not re-list every completed story every time.
      - **Latest work landed** — the most recent 5–8 merges as the log reads right now (a fixed count off the tip, not a date range), one line each in product terms, PR linked, with anything deployed but not yet accepted called out as such.
      - **How it was built** — only where the approach carries a consequence: a trade-off taken, a dependency added, a deviation and why, an infrastructure change, a small decision an agent settled itself (`assumption` comment). Drawn from the cards' own comments, not re-derived. Skip the section rather than padding it.
      - **Deployed** — what is live and where: the staging URL (`STAGING_BASE_URL`), the deployed sha and the time of the last green `STAGING_DEPLOY_WORKFLOW` run, verified in this run.
      - **Progress** — the figure, its method, the per-epic breakdown, what the completed work unblocked.
      - **Remaining work** — what is still to be delivered, as **counts, never time**: stories (or cards) not yet accepted out of the total (same method as the completion figure), split into *in progress now* (in an automated column or on staging awaiting acceptance), *waiting on a person* (Blocked, Human-gated, After Deploy) and *not started yet*; then one line per epic that still has open stories — the epic in product terms and "N of M stories left". Name the biggest remaining capabilities in a short list. Never a date, a duration, a velocity or a forecast of when the rest will land.
      - **Questions for you** — every open question to {{inputs.product_owner}} as a **numbered list**, the same list as the message (see Deliver). Then **Needs a decision or an action** — every card in Blocked and Human-gated: what is missing, from whom ({{inputs.product_owner}} for a decision, {{inputs.delivery_lead}} for access or a credential, the team for anything else), and how long it has been in that state; every card in **After Deploy (Human action)**: the hand-run step it waits on (from its `ops_runbook`, in plain terms, no commands) and how long it has waited; and the open questions in the spec that still gate work. None → one line saying so.
      - (No separate "Next" section: the plan for the week and "On deck after that" at the top carry it.)

      Nothing has changed state → say that plainly in one short report and explain why: work in progress, blocked, or idle. A quiet period is a valid report — give the snapshot anyway and never manufacture movement to fill it.

      ## Style

      One self-contained HTML document: styles inline, no external stylesheet, no CDN, no remote fonts or images. Keep the same template every run, so the series reads as one publication rather than a new design each time. Colour carries meaning, one meaning per use: a neutral accent by default; a success token where an epic or milestone stands complete; a problem token where something is unhealthy right now — a failed deploy, a regression, a card waiting on a person; a single-action token only when the report contains exactly one thing a stakeholder must act on, and then nothing else on the page competes with it. When the design source (`DESIGN_SOURCE`) is a `DESIGN.md` with documented tokens, take those roles from it; otherwise, or when it is unreachable, use a plain neutral style and say so in one line — never guess at a palette.

      ## Deliver

      Save the document as `/workspace/outputs/progress-report.html` (the step's output asset), then:

      1. **The board, always.** Create a card titled `Progress report <date>` in Backlog with `board_create_task`, tag it `report` with `board_manage_tags`, put the short message (below) in its description, attach the HTML with `board_attach_asset`, and move it to Done with `board_move_task`. Done is terminal and runs no automation; the `report` tag marks the card as a report, not delivered work. One card per run; never edit an earlier report card — it is the previous snapshot.
      2. **The intake channel, when `INTAKE_CHANNEL` is set.** Post the short message once with `chat_post_message`, the HTML attached, and stop there — never post it to the escalation channel (`ESCALATION_CHANNEL`) or anywhere else. When `INTAKE_CHANNEL` is unset, the board is the delivery; do not report "message not sent" as a finding.

      The message is the stakeholders' update, readable on a phone in two minutes without opening the file, in this order (headers in bold as the chat product renders it):

      1. `*Progress report <Weekday, Mon D>*` and the headline sentence.
      2. `*What you can do now that you couldn't at the last report:*` the plain-language summary **in user terms, not story numbers**: what the reader can now do, see or test that they could not before. Up to 6 bullets, each one sentence or two: who and where (screen), what is new, and how to see it — e.g. "As an administrator, open a record from the list: its details now open in a panel over the list, so you keep your place — try it on any row" — an example of the form only, never a line to copy. Group several small changes to one screen into one bullet. Mark anything not yet accepted "(on staging, being checked)". Source: what reached staging or was accepted since the previous report. Internal-only work (tests, infrastructure, tooling) appears only through what it lets the reader do, or not at all. Nothing to try → one line saying what is in progress instead.
      3. `*This week:*` **what we expect to complete by the end of this week (Friday)**, up to 5 bullets in product terms, each with its state now: "in progress", "on staging, being checked" or "done ✓". Take it from work already moving — cards in the automated columns, on staging awaiting acceptance, and what the Planner releases next in dependency order — never from wishes. On Saturday and Sunday it is next week's plan. Keep the same items all week and tick them off, so the reader sees the week close; an item that did not complete is carried with what it is waiting on, in plain terms and with no fault wording. Then `*On deck after that:*` one or two lines naming what comes next. No dates per item, no hours or effort, no percentages of completion per item: this is a plan of named work, not an estimate.
      4. `*Progress:*` the completion figure with its method in five words.
      5. `*Remaining:*` one line of counts: "N of <total> stories left — X in progress, Y waiting on a person, Z not started". Counts only: no dates, durations or forecasts.
      6. `*Questions for you:*` a **numbered list**, one question per line, every open question to {{inputs.product_owner}} (none → omit the block). Each line must make sense to someone who cannot open the board and has read no earlier report:
         - the question itself, in plain words, answerable with a short reply (e.g. "Which price should the checkout page show: the discounted one or the list price?"), not a topic ("Fee wording");
         - in brackets, what the answer unlocks, in product terms, and the date it was first asked: "(unlocks the fee disclosure · asked <Mon D>)" — examples of the form only, never questions to copy;
         - a request for an account, a document or access is written as the action and addressed to {{inputs.delivery_lead}}: "Add the sandbox API key as a config item".
         Sources: cards whose latest `owner_question` comment has no later comment tagged `decision`, plus Blocked and Human-gated cards waiting on {{inputs.product_owner}}. Merge duplicates into one question; never include internal follow-up decisions (cards tagged `follow-up` or `needs-human-decision` without an `owner_question`) — those are the team's, not the product owner's. Order by what unblocks the most work first. More than 8 → list the 8 that unblock the most and end with "+ N more in the attached report", where the HTML lists all of them.

      - No Markdown twin, no second copy as message text, no separate deck. The HTML carries the full snapshot; the message does not repeat it beyond those lines.
      - Chat unreachable → keep the compiled HTML on the report card and say in a comment on that card that chat delivery failed; never discard a compiled report, and never fall back to posting it as plain text.
    agent: progress_reporter
    tools:
    - board_get_board_info
    - board_list_tasks
    - board_get_task
    - board_get_comments
    - board_get_task_assets
    - board_add_comment
    - board_update_task
    - board_move_task
    - board_attach_asset
    - board_manage_tags
    - board_create_task
    - chat_post_message
    - promote_asset
    - share_asset
    config_items:
    - SPEC_PATH
    - PLANNING_DIR
    - STAGING_BASE_URL
    - STAGING_DEPLOY_WORKFLOW
    - INTAKE_CHANNEL
    - HEALTH_PATH
    - DESIGN_SOURCE
    - PR_MERGE_POLICY
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
- key: unblock_digest
  name: Unblock Digest
  description: |-
    Scheduled daily, unbound. Works only the Human-gated column: re-reads every non-archived card's full history, checks whether the blocker was already answered (sibling cards, the spec at `SPEC_PATH`, shipped code) and cites it, posts or updates `owner_question` comments — decisions for {{inputs.product_owner}}, access and credentials for {{inputs.delivery_lead}} — validates only answers explicitly marked as such (tagged `decision`) in `unblock_validation` comments, reconciles the description, and routes a card to Backlog or Done only when every blocker is cleared. Delivers one digest, grouped by owner and oldest first, to the intake channel (`INTAKE_CHANNEL`) when set, otherwise as comments on the cards. Read-only on the repository.
  base:
    repositories:
    - app
  steps:
  - key: triage_human_gated_and_follow_up
    name: Triage Human-gated & follow up
    instructions: |-
      ## Task

      One daily cycle: scan **Human-gated** only, work the cards blocked on a **person's decision or access**, check whether the answer already exists, post or update questions on the card, validate explicitly marked answers, route a card only when **every** blocker is gone, and deliver one short digest — to the intake channel (`INTAKE_CHANNEL`) when it is set, otherwise as comments on the board. **Read-only on the repository.**

      Re-read each card from scratch every run. Comments, tags, column transitions and sessions (`session_list`, `session_log`) are the source of truth; do not carry state between runs.

      Who answers what: **{{inputs.product_owner}}** makes product, scope and policy decisions; **{{inputs.delivery_lead}}** answers delivery questions and provides access, credentials and accounts. A product decision by {{inputs.product_owner}} beats an engineering ruling.

      ## Scope — what you touch

      **Column:** Human-gated only. Never act on any other column, except the destination of a card you route out of Human-gated.

      **In scope** — the card waits on something a person outside the pipeline must give:
      - a **decision** for {{inputs.product_owner}}: product or scope choice, legal or policy wording, "which option", approval to proceed (tags such as `human-action`, `blocked-on-decision`, `needs-product-decision`, or `blocked` comments that name a decision);
      - an **access or credential** for {{inputs.delivery_lead}}: a secret, a config item, an account, a permission the pipeline deliberately lacks (`credential-gated`, `externally-gated`, comments naming a missing key or grant). Credential-only cards get no decision questions: you ask {{inputs.delivery_lead}} once for the missing item, by name, then only list the card under *Still waiting* until it is provided. Agents never invent a secret; a missing `UAT_*` or other config item is provided by a person as a config item, never as a comment value.

      **Out of scope** — skip silently:
      - **Archived cards.** Every task carries an `archived` flag. An archived card is out of scope whatever its column, tags or comments say: do not count it, triage it, comment on it, route it or name it in the digest — not even under Skipped. Filter on `archived` before anything else, including before you count what is in scope.
      - **Internal follow-ups.** A card tagged `follow-up` (or `needs-human-decision` with a `follow-up:` title) is an internal team decision on a non-blocking finding from Tech Design, Design, Implementation, Code Review or Verify. Never post an `owner_question` on it, never count it as waiting on {{inputs.product_owner}}; list those ids in one digest line ("internal follow-ups awaiting a team decision: ids"), nothing more.
      - Every other column.

      **Misfiled cards.** Nothing else on the board ever picks a card up from Human-gated, so a misfiled one is invisible forever. Apply the test literally: *would the unblocking answer come from a person, or from a merge?* Ordinary engineering work parked here (a render gap, a docs sweep, missing tests, a defect already fixed) → **Backlog** with a comment saying why it does not belong here. A blocker that is code another card owns belongs in **Blocked** as work-gated, not here → move it there with a comment naming the owning card. A card that is only partly human-gated: name the split in `unblock_validation` and leave it for the Planner or a person to split; do not create cards yourself.

      **Mixed blockers** — a card can wait on both a decision **and** a credential. Engage on each; validate answers; **never move** while any blocker remains. Say in `unblock_validation` what is satisfied and what is not.

      ## Multi-blocker checklist (per in-scope card)

      From the full comment thread and the description, list every open blocker:
      - `decision:` the ruling or choice needed, and from whom ({{inputs.product_owner}});
      - `credential:` the secret, config item or access still missing ({{inputs.delivery_lead}});
      - `spec:` an open question recorded in the spec (`SPEC_PATH`), when the card says the answer lives there.

      Route only when the checklist is empty — and an item belongs on the checklist only if it is a **blocker**: **a decision or an access this pipeline cannot obtain for itself, held by a person outside it, which must come *before* the work can start.** Two things are routinely recorded as remaining and are **not** blockers:

      - **A parallel open item.** Where {{inputs.product_owner}} has said to build while something stays open — "don't wait on the legal review", "build it and keep it disabled until it is approved", "default every option to off and we'll switch them on" — the open item runs beside the work rather than in front of it. Name it under *Still open, and whose* and route the card. A review that will outlive the build is not a gate on starting it.
      - **A team deliverable.** The team's own owed work — a spec entry to write, a recommendation owed, a mechanism to build — is the work, not a gate on it, and is a reason to send the card to **Backlog** so the Planner sequences it. Holding it here makes the team's own commitments invisible.

      So for each remaining item ask two questions — *who must act*, and *must they act first*. Only "someone outside this pipeline, before the work can start" keeps a card in Human-gated. Everything else is named and released.

      ## Before you ask: has this already been answered?

      Run this **before** posting or re-posting an `owner_question`, and before concluding a card is still waiting. A gate card is often already unblocked and nobody noticed: the answer was given on a sibling card, recorded in the spec, or an implementation landed that settles it or makes it moot. Re-asking an answered question spends the product owner's patience, and it is the failure mode this column is most prone to — the answer arrives once, on one card, while others go on waiting for it. **Never re-ask a question already answered on the board or in the spec — cite it.**

      For each in-scope card, derive a handful of **search keys** from its blocker: the requirement, story (`E.S` from `PLANNING_DIR`) or tracker-key ids it names, the card ids it references, and two or three domain nouns from the decision itself. Run these lookups and stop at the first that yields a citable answer:

      1. **Sibling cards** (non-archived only). Search the board for other cards whose title or description carries the same keys — including cards in Backlog, Tech Design and Done, where a settled version of the question usually sits. Read comments only on the cards that hit, and within them only `decision`, `unblock_validation` and `## Decision` blocks.
      2. **The spec and the plan.** The spec at `SPEC_PATH` (read on `{{inputs.integration_branch}}`) — **a question recorded there as answered is answered**; cite the section and line — and, when `PLANNING_DIR` is set, `epics.md` and `sprint-status.yaml`. The tracker ticket, its epic and links, when the card carries a tracker key and a tracker tool is available — read only, never write.
      3. **What shipped since the blocker was raised.** The git log on `{{inputs.integration_branch}}` and Done cards that landed after the blocker's date and touch the same area. Two outcomes count: the thing waited on **was built**, or it was built **differently**.

      Cap the effort: a handful of sibling cards per gate card, and stop as soon as you have a citation. This is a lookup, not an investigation.

      **Three outcomes, each handled differently.**

      - **Answered elsewhere.** Post `unblock_validation` on this card citing the source exactly — card id plus comment id, or `file:line` plus commit — restate the ruling in the decider's own words, reconcile the description, and route by the rules below. Do not re-ask, and do not ask anyone to repeat an answer already given.
      - **Made moot by an implementation.** Say what shipped and cite it. Route to **Done** where nothing is left to build, or to **Backlog** where the shipped work changed what remains rather than removing it.
      - **Premise contradicted.** The shipped code does the opposite of what the card assumes, so the question as written can no longer be answered honestly. This is **not** an unblock. Post `unblock_validation` saying the premise changed, cite the code, rewrite the question against what is actually there, and keep the card in Human-gated. A stale question answered literally is worse than no question.

      **Never route on an inferred unblock.** An answer found elsewhere must carry a citation a person can open — a comment id or a `file:line`. "It looks decided" is not a finding. Where you suspect a card is unblocked but cannot cite it, the card stays, and `unblock_validation` says what you suspected and what you could not confirm.

      ## Questions — on the card

      When a blocker is open and no acceptable answer exists:

      1. Check whether your latest `owner_question` comment still matches the blocker. Unchanged → do not duplicate.
      2. Blocker changed or the prior question is stale → post a new comment tagged `owner_question`.
      3. Each question comment: card id and title, whom it is for ({{inputs.product_owner}} for a decision, {{inputs.delivery_lead}} for access or a credential), the decision or item needed, why it blocks work, numbered questions, and what a sufficient answer must contain. Ask for the reply **on this card**, explicitly marked as the answer (starting `Decision:` or `Answer:`, or tagged `decision`).

      One question set per card per cycle. English only.

      ## Recognising an answer

      A comment counts as the answer only when it **explicitly marks itself** as answering a posted question — it is tagged `decision`, starts with `Decision:` or `Answer:`, or states "this answers your question of …". Ordinary discussion without that marking is not an answer. A question answered in a meeting with no recorded decision is not answered.

      Validate every marked answer in a new `unblock_validation` comment: sufficient / insufficient, what was accepted, what is still missing (including credentials). When a sufficient answer is not itself tagged `decision`, tag it `decision` with `board_manage_tags` — the Planner and Scope Change read the latest `decision` comment of a card, so the ruling must carry that tag.

      ## Reconcile the description before you route

      The Planner and Tech Design judge a card by its **description** first. A card whose description still says "blocked on a product decision", "needs product input" or "Human-gated: who this needs" stays stuck however clear the answer in the comments is. So, for every card you are about to move out of Human-gated:

      1. **Prepend** a block to the description (never replace it):

         ## Decision — <date> (<decider>; comments <decision id>, <unblock_validation id>)
         **Ruling:** one or two sentences, the decider's words where possible.
         **What this settles:** the items now closed.
         **Still open, and whose:** each remaining item → the team / {{inputs.product_owner}} / {{inputs.delivery_lead}} / nobody.
         ## What this card must do now — the work as it stands after the ruling, numbered.
         ## Acceptance criteria — only where the ruling changes or adds them (Given / When / Then).
         ## Footprint (estimated) — only where the premise changed.

      2. Move the text that described the cleared blocker under `## Superseded (kept for history)` — verbatim. Delete nothing; leave evidence sections and any `## Edge cases` block where they are.
      3. **Tags:** remove the gating tag the ruling cleared (`needs-product-decision`, `needs-product-input`, `ux-decision`, `blocked-on-decision`, `human-gated`, `design-needed` once the design exists in the design source; `credential-gated` only when nothing is awaited from anyone). Keep or add `human-action` when a person must still act before the pipeline can — and say in the block who and what.
      4. Say in the `unblock_validation` or routing comment that the description was reconciled.

      Only then move the card. Ten lines of Decision are enough; the comments carry the detail.

      ## Routing — only when every blocker is cleared and the card is complete

      | Situation | Move to |
      |-----------|---------|
      | Work is defined (a ruling creates or confirms work) | **Backlog** — the Planner sequences and releases it |
      | The decision disposes of the question; nothing to build | **Done** |
      | The ruling changes the product's scope or the spec itself | **Needs Planning** — Scope Change owns the spec |

      Never move a card straight into an automated column: entering Tech Design or any later bound column fires its workflow immediately against whatever the card holds. A card ready to build goes to Backlog, and the Planner releases it under the WIP cap ({{inputs.wip_cap}}) and the dependency rules. Unsure whether the card is complete enough → leave it in Human-gated and say why in `unblock_validation`.

      Add a brief routing comment naming every blocker that was cleared and the citation for each.

      ## Digest

      One digest per run. Fixed sections, one line per item, omit empty sections; inside each section **group by owner** ({{inputs.product_owner}}, {{inputs.delivery_lead}}), oldest first:

      1. **In scope** — card ids triaged this cycle, with the count.
      2. **Questions posted** — id → one-line summary of each new or updated `owner_question`, and for whom.
      3. **Answers validated** — id → sufficient / insufficient + what remains.
      4. **Still waiting** — id → the open decision or credential, whose, and days since the question was first asked.
      5. **Released** — id → destination column and why every blocker cleared.
      6. **Unblocked elsewhere** — id → the sibling card, spec line or commit that settled it, with the citation, and which outcome it was (answered / moot / premise contradicted). Cite rather than summarise: this section is how anyone sees the sweep earning its keep.
      7. **Misfiled** — id → where it went and why (Backlog / Blocked).
      8. **Assumptions taken in the last 24 hours** — one line per comment tagged `assumption` created in the last 24 hours on any non-archived card (Tech Design, Design, Implementation, Code Review and Verify settle small decisions themselves and record each one that way): card id and title, the question, the choice, a link to the comment. None → one line saying so. This section is for the team's review — {{inputs.delivery_lead}} reverses any they disagree with by a `decision` comment; it is not a question to {{inputs.product_owner}}.
      9. **Internal follow-ups** — one line of ids.
      10. **Skipped** — id → why — only if notable. Never list archived cards.

      Quiet day → one line: no in-scope cards, or nothing changed.

      **Delivery.** `INTAKE_CHANNEL` set → post the digest once with `chat_post_message`, one message, and nowhere else. Unset → no chat: leave a short digest comment (its *Still waiting*, *Questions posted* or *Released* line) on each card the cycle touched or found still waiting, at most one per card per run, and do not report "message not sent" as a finding. Either way, save the same digest body to `/workspace/outputs/unblock-digest.md`. An answer given in chat does not reach a card by itself: it reaches the board through Chat Intake (a message containing `triage` naming the card) or by a person posting it on the card — say so in the digest when asking.
    agent: unblock_coordinator
    tools:
    - board_get_board_info
    - board_list_tasks
    - board_get_task
    - board_get_comments
    - board_get_task_assets
    - board_add_comment
    - board_update_task
    - board_move_task
    - board_manage_tags
    - board_list_members
    - chat_post_message
    - session_list
    - session_log
    config_items:
    - SPEC_PATH
    - INTAKE_CHANNEL
    - PLANNING_DIR
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
    sub_steps:
    - name: Scan Human-gated
      instructions: |-
        List all non-archived cards in Human-gated and note the count. Filter `archived` first. Do not act on other columns.
      required: true
    - name: Deep-read card history
      instructions: |-
        For each card: description, tags, all comments in order, column transitions, and recent sessions via `session_list` / `session_log`. Build the multi-blocker checklist (`decision:`, `credential:`, `spec:`), each item with its owner.
      required: true
    - name: Filter and sort the cards
      instructions: |-
        Keep cards waiting on a person: decisions for {{inputs.product_owner}}, access or credentials for {{inputs.delivery_lead}}. Skip `follow-up` cards (one id line in the digest). Misfiled cards (the answer would come from a merge) → Backlog or Blocked with a comment saying why.
      required: true
    - name: Check for answers elsewhere
      instructions: |-
        Before asking: sibling cards (`decision`, `unblock_validation`, `## Decision`), the spec at `SPEC_PATH` and its open questions, `PLANNING_DIR` when set, the tracker (read only), what shipped on `{{inputs.integration_branch}}`. Answered / moot / premise contradicted — cite it, or keep the card. Never route on an inferred unblock.
      required: true
    - name: Post questions
      instructions: |-
        Post or update `owner_question` comments in English, addressed to {{inputs.product_owner}} or {{inputs.delivery_lead}}. No duplicate when the open question is unchanged; never re-ask an answered one. Ask for the reply on the card, marked as the answer.
      required: false
    - name: Validate marked answers
      instructions: |-
        Only explicitly marked answers count. Post `unblock_validation` with sufficient / insufficient and what remains; tag a sufficient answer `decision`. Decision satisfied but a credential missing → say so and do not move.
      required: false
    - name: Route fully unblocked cards
      instructions: |-
        Only when every blocker is cleared and the card is complete: reconcile the description first (`## Decision` block on top, cleared text under `## Superseded (kept for history)`, gating tags removed), then move to Backlog, or straight to Done when the answer disposes of the question. Never into an automated column.
      required: false
    - name: Deliver the digest
      instructions: |-
        One digest, grouped by owner, oldest first, including "Assumptions taken in the last 24 hours". `INTAKE_CHANNEL` set → one `chat_post_message`; unset → one comment per touched card. Save the same body to `/workspace/outputs/unblock-digest.md`.
      required: true
- key: plan_bootstrap
  name: Plan Bootstrap
  description: |-
    Manual, one-off. Turns the product spec at SPEC_PATH into the planning artefacts the pipeline runs on, in PLANNING_DIR: epics.md with stable E.S ids and Given/When/Then acceptance criteria, the story dependency graph (machine-readable CSV, waves, critical path, keystone ranking, verified acyclic) and sprint-status.yaml with everything at backlog; every story traced to its requirement ids, gated by any open question recorded in the spec, and mapped to design-source screens when DESIGN_SOURCE is set. Missing prerequisites become human-action cards in Human-gated. Lands through a PR into the integration branch. Refuses when SPEC_PATH or PLANNING_DIR is unset. Run once, after the repository exists and the spec is committed; re-run only to regenerate.
  base:
    repositories:
    - app
  steps:
  - key: build_plan_from_spec
    name: Build epics, graph and sprint status from the spec
    instructions: |-
      ## Archived cards

      Ignore archived cards: drop any board row with `archived: true` before acting on it, and if the card this run was started for is archived, do nothing and end with a one-line report. Duplicate checks are the exception: look with `include_archived: true` — archiving is a person's "not doing this", so an archived card for the same work means create nothing; name it in the report.

      ## Task

      The specification already exists: the product spec / PRD at `SPEC_PATH` in the project repository
      (`/workspace/repo`), read on `{{inputs.integration_branch}}`, with any companion files it links. **Do not
      rewrite the spec.** Derive the plan from it: the planning artefacts the pipeline runs on, in
      `PLANNING_DIR`. Run once, after the repository exists and the spec is committed; re-run only to
      regenerate.

      **Refuse when the inputs are missing.** `SPEC_PATH` is `unset`, or the file is missing on
      `{{inputs.integration_branch}}` → post a board comment saying the spec is required (set `SPEC_PATH`,
      commit the spec) and stop. `PLANNING_DIR` is `unset` → the same: the board alone is the plan and there
      is nothing to bootstrap; say so and stop. Write nothing in either case.

      Read `CLAUDE.md`, `AGENTS.md` and `CONTRIBUTING.md` at the repository root — whichever exist — before
      changing anything; they are binding. Never write to the tracker.

      ## Steps

      1. **Slice the spec into epics and stories.** Group the requirements into epics by the capability they
         deliver; slice each epic into stories that are independently buildable. Every story carries:
         acceptance criteria (Given/When/Then), the spec requirement ids it realises, `Depends on`, a
         `Gated by:` line listing every open question recorded in the spec that the requirement cites and that
         is still open (none → `Gated by: none`), and, when `DESIGN_SOURCE` is set, a
         `Design source screens:` line naming the screens of the design source the story builds (`none` for a
         story with no UI). Screens in the design source that map to no story are listed in the closing
         message. Respect the spec's withdrawn requirements and anything it marks as a candidate rather than a
         requirement: neither becomes a story.
      2. **Write `PLANNING_DIR/epics.md`** with stable ids (`E.S`, epic number then story number). Ids are
         labels the board, `sprint-status.yaml` and every later comment refer to; once landed they are never
         renumbered.
      3. **Write `PLANNING_DIR/story-dependency-graph.md`**: a machine-readable `story,depends_on,cross_epic`
         CSV (edge `A → B` means B depends on A; the column is the dependency, not the dependent), the waves,
         the critical path and a keystone ranking (stories by how many others transitively depend on them).
         Verify it is acyclic and say so.
      4. **Write `PLANNING_DIR/sprint-status.yaml`** with every story and every epic at `backlog`. From then on
         only Implementation and Verify write it.
      5. **Readiness check** over the result: every requirement covered by a story or explicitly withdrawn,
         every story with acceptance criteria and a place in the graph, no dangling `Depends on`. Missing
         prerequisites the pipeline needs — an architecture doc, the repository's testing conventions, a
         `CLAUDE.md` / `AGENTS.md` — are reported, not invented: create one card for each in **Backlog**
         (`board_create_task`), tagged `human-action`, saying what is missing and who provides it, and move it
         to **Human-gated**.
      6. **Land it.** Before the first file change, a comment tagged `branch`: `branch: scope/plan-bootstrap`,
         `base: {{inputs.integration_branch}} @ <sha>`, `stage: Plan Bootstrap`, `paths: <PLANNING_DIR>/…`.
         Commit on `scope/plan-bootstrap` (`docs(plan): bootstrap epics, graph and sprint status from the
         spec`), push, `gh pr create --base {{inputs.integration_branch}}`. When `PR_MERGE_POLICY` is `agent`:
         merge once `CI_CHECK_NAME` is green for the PR's current head sha (`gh pr checks <n>`; a missing run
         is never green), or when the repository has no CI yet — say so. A failing job that names a file you
         wrote is yours to fix on the branch; one you cannot get green → `blocked` comment + escalation, stop.
         When the policy is `human`: leave the PR open for a person and say so. Never push to
         `{{inputs.integration_branch}}`, `{{inputs.staging_branch}}` or `main` directly; never force-push.
      7. **Close with one message** to the escalation channel (`ESCALATION_CHANNEL`; `unset` → a board comment
         on the card that started this run, and do not report "message not sent" as a finding): the counts
         (epics, stories, gated stories and the questions gating them, waves), the PR link and whether it is
         merged, the `human-action` cards created, unmapped design-source screens, and what the Planner will
         release first (the first-wave stories with no gate, ranked by keystone).

      **Formalise, never invent:** every story traces to a spec requirement. A requirement too vague to slice
      is listed in the message as a question for `{{inputs.product_owner}}`, not guessed.
    agent: scope_manager
    tools:
    - board_get_board_info
    - board_list_tasks
    - board_add_comment
    - board_create_task
    - board_move_task
    - board_manage_tags
    - chat_post_message
    - promote_asset
    config_items:
    - SPEC_PATH
    - PLANNING_DIR
    - DESIGN_SOURCE
    - CI_CHECK_NAME
    - PR_MERGE_POLICY
    - ESCALATION_CHANNEL
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
