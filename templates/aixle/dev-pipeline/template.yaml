- key: design
  name: Design
  description: |-
    Bound to the Design column. Two steps. The first produces a concrete UI/UX spec as a `design` comment from the design source (`DESIGN_SOURCE`) — a design file, a deployed reference build of the UI, or, when unset, the existing component library and current screens — draws the screens the design source lacks as attached mockups where the rules allow, and never moves the card (it has no `board_move_task` and states its verdict as a `routing:` line in its comment). The second runs the design sync when one is configured for the project and is the sole mover, moving the card unconditionally — to Implementation by default; to Human-gated for a design review of newly drawn screens (tag `design-review`), a missing design (tag `design-needed`) or a decision {{inputs.product_owner}} must take; to Blocked only on an explicit blocked routing — whether its sync succeeded, failed or was skipped.
  base:
    repositories:
    - app
  steps:
  - key: produce_ui_spec
    name: Produce UI/UX spec
    instructions: |-
      ## Archived cards

      Ignore archived cards: drop any board row with `archived: true` before acting on it, and if the card this run was started for is archived, do nothing and end with a one-line report. Duplicate checks are the exception: look with `include_archived: true` — archiving is a person's "not doing this", so an archived card for the same work means create nothing; name it in the report.

      Produce a concrete UI/UX spec for the attached card and attach it as a comment tagged `design`. Inputs: the card and all its comments (the `tech_design` comment with its `## Design source screens` section, any `design_feedback` or `design_approved` comment); the spec — the product spec at `SPEC_PATH` and the planning artefacts in `PLANNING_DIR` when set, the tracker ticket when the card title carries a tracker key and a tracker tool is in the session (otherwise the card description), the repository's own docs, `decision` comments; the design source (`DESIGN_SOURCE`); and the existing design system — the component library and the current screens in the project repository at `/workspace/repo`, read on `{{inputs.integration_branch}}`. Read `CLAUDE.md`, `AGENTS.md` and `CONTRIBUTING.md` at the repository root — whichever exist — first; they are binding. Reuse existing components; do not design a new visual language. Playwright is attached for opening screens, Context7 for library documentation; use the project's skills, if any are attached. Agents never write to the tracker.

      Treat the tech design's screen list and its gaps as claims and check them on the design source yourself.

      ## The design source — three modes

      `DESIGN_SOURCE` says where the UI contract lives. Establish which mode applies before you design anything, and say so in the `design` comment.

      **A design file** (a Figma file or similar). Find the link on the card, in the tracker ticket and its parent epic, or in a linked design ticket. A usable link points at a specific **frame or screen**, not at the whole file. Read it through the design tools attached to this step when there are any; otherwise use the frame exports attached to the card or the ticket. **No access** to a linked frame (no design tools, no exports) → say so in the `design` comment and do not guess what it shows: for a **big** change that counts as *no design* (`routing: human-gated — design needed: <the frame link>`); for a small change, design from the design system and record it as an `assumption`. A big change with no linked frame at all → do not design it: `routing: human-gated — design needed: <the screen or flow, what must be decided>`. A person provides the design and moves the card back here.

      **A deployed reference build of the UI** (a URL). The product's design already exists as a running build; the job is first to establish whether the story's screens are in it, and only where they are not, to draw the missing ones so that nobody could tell they were added later — same components, layout grid, spacing, type scale, colours, copy tone and states as the screens around them. Open it with Playwright — read and navigate only: never create an account on it and never submit a form that changes its data. If a login page appears, use `UAT_LOGIN` / `UAT_PASSWORD` (or the role's `UAT_<ROLE>_LOGIN` / `UAT_<ROLE>_PASSWORD`); refused → `routing: blocked — reference build login refused` naming the missing login, never a guess; unreachable → `routing: blocked — reference build unreachable: <URL>`. Walk each screen and state the acceptance criteria need (empty, loading, error, success, each role's view) and screenshot it. A screen or state counts as **designed** when the build shows it with the fields, columns, actions and states the story needs; a different label or copy is a divergence, not a gap. It counts as **missing** when the build has no such screen, or the screen lacks a part the story needs that changes its layout (a new section, table, form block, dialog or state). Everything designed → the `design` comment lists each screen with its URL and screenshot, and those screens, with the spec's divergences named, are the contract. Something missing → draw it (below).

      **A `DESIGN.md` path** in the repository is a written rulebook, read on `{{inputs.integration_branch}}` before anything else: its tokens, layouts, components, patterns, copy and formats, accessibility rules, and the defects it says not to copy. Rules it marks **Proposed** are applied and named in your comment; its decisions section overrides them once a person has decided. Compose every screen from it and model new ones on the nearest screen it documents; otherwise this is the `unset` mode.

      **`unset`.** The design source is the existing component library in the repository and the current screens of the app on staging (`STAGING_BASE_URL`, logged in with the `UAT_*` credentials, read and navigate only — missing credentials → `routing: human-gated — decision: staging credentials missing`, never a guess). Read the components and one sibling screen of the same kind before you write the spec. A big change has no design here by definition: draw it from the existing components and the neighbouring screens (below) and send it for review — do not invent a new visual language.

      **Precedence:** the spec (and the open questions it records) first, then the decisions a person recorded (`decision` and `design_approved` comments, the rulebook's decisions section), then the design source, then the existing screens, then your own judgement. Where the design source contradicts the spec, follow the spec and name the divergence. A feature the design source has and the spec does not is not in scope — note it, do not build it. A requirement gated by an open question in the spec is not designed past the gate: `routing: human-gated — decision: <the question>`.

      ## Classify the change before you design it

      - **Big:** a new screen or panel; a new pattern or component the design system does not have; a change to navigation or to a flow (its steps, or which roles see it).
      - **Small:** a new state (empty, loading, error) of an existing screen; copy; a column, field or control inside an existing component.

      **Small** → decide yourself from the design source where it shows the screen and from the design system otherwise; record each choice as an `assumption` comment. **Big with a design** (a linked frame, or a screen the reference build has) → design to it; every place you deviate from it is stated with the reason. **Big without a design** → in design-file mode do not design it: `routing: human-gated — design needed: …`; in reference-build or `unset` mode draw it and `routing: design-review`.

      ## Draw what is missing — the neighbouring screens are the guideline

      For every missing screen or state in the reference-build or `unset` mode:
      1. **Take the guidelines from what exists, don't invent them.** Compose the screen only from the design system's tokens (every colour a token; it must work in every theme the product has), layouts, components and patterns, with its copy and formats and its accessibility rules — from the `DESIGN.md` rulebook when there is one, else from the two or three closest existing screens. Model it on the nearest existing screen and open that screen to match its structure. Never copy a defect the rulebook lists. Something the rulebook does not cover: measure it from the nearest existing screen (computed styles) and propose it as a new pattern with its reason.
      2. **Build the mockup from them.** A self-contained HTML page per screen, in the product's default colour scheme, that reuses the project's own stylesheet and markup patterns where you can reach them (the component library in the repository) and copies the computed values where you cannot. Real copy for every visible string, in the spec's words; realistic data, including a long value. Render it with Playwright and screenshot it at 1440, 768 and 375 px, plus each state.
      3. **Show it is consistent.** For each new screen attach one screenshot pair: the mockup next to the existing screen it is modelled on.

      Attach the screenshots and the HTML files to the card with `board_attach_asset`. A drawn screen is a proposal until a person approves it: its mockups in the `design` comment, with the corrections of the latest `design_approved` comment, are then the contract for that screen exactly as a screen in the design source is.

      ## Back from review

      A card arriving with a `design_feedback` comment newer than your last `design` comment: change exactly what it asks, keep what it did not mention, post a new `design` comment naming what changed and attaching the new mockups, and end it with `routing: design-review` again. A card arriving with a `design_approved` comment newer than your last `design` comment: post a short `design` comment restating the contract (the approved mockups plus the corrections) and `routing: implementation`.

      ## Edge cases are part of the contract until Code Review

      Edge cases live in the **card description** under a `## Edge cases` heading — one bullet each: the case, the expected behaviour, and `— added by <stage>`. When you find one the acceptance criteria do not cover, **append** it there with `board_update_task` (add the heading at the end of the description if it is missing; append only — never reword, reorder or delete an existing AC or bullet) **and** post a comment tagged `edge-case` with the same text.

      Edge cases added up to and including **Code Review** belong to this card: Implementation builds and tests every one of them, Code Review checks each is handled, Verify walks each. An edge case found **after** Code Review (in Verify or later) does not enter the contract — it is a bug card.

      List in the `design` comment the edge cases each screen must handle (empty, loading and error states, long values, the role that sees less) and append the ones the ACs do not cover.

      ## What the `design` comment contains

      Verdict first — `no UI`, `designed` (every screen exists in the design source), `partly` or `not designed` (screens drawn) — with the link or URL of every screen that exists. Then **User flow**; **Screens / components** (per screen: the frame or reference screen it follows, or the existing screen it is modelled on); **States** (empty, loading, error, success, long values); **Interactions**; **Responsive / accessibility** (labels, focus, contrast); **Design-system mapping**; the open points a reviewer should decide; and per screen a short **Design system** block:
      - the existing components it uses; a new component or a one-off variant only with a written reason;
      - the **one** primary action and what it does; every other action secondary, ghost or link;
      - the copy for every visible string, in the user's words;
      - help and disabled reasons as visible helper text, never tooltip-only;
      - how numbers, money and dates are shown (through the project's formatting helpers, never ad-hoc formatting);
      - what each role sees where the screen differs by role;
      - the layout at 375, 768 and 1440 px, and the empty, loading and error states;
      - for a drawn screen: the attachment names, the rulebook's Proposed rules it relies on, and any new pattern proposed with its reason.

      A spec that cannot follow the existing design system says where and why; that line is a decision for a human, and the routing rules below apply.

      ## This step never moves the card

      Producing the spec is the whole job. **Do not move the card to another column, under any circumstance** — not to Implementation, not to Human-gated, not to Blocked, not back. You do not have `board_move_task` and you must not reach for another route to the same effect. The *Design sync & route* step that follows is the only mover in this workflow, and it moves the card whether it succeeds or fails.

      Do not post a chat escalation either; the second step owns that too, so the board and the chat channel never disagree about where the card went.

      ## Say where it should go, in the comment

      End your `design` comment with a single explicit routing line so the next step does not have to guess:

      - `routing: implementation` — the normal outcome: no UI, every screen designed, or a small change. Prefer a stated assumption over blocking.
      - `routing: design-review — <the screens drawn>` — you drew or redrew a screen; a person must approve it before it is built.
      - `routing: human-gated — design needed: <what>` — a **big** change with no design, in design-file mode (see *The design source*).
      - `routing: human-gated — decision: <the decision, who owns it>` — only for a decision that genuinely needs {{inputs.product_owner}} (legal or privacy copy, a product choice, a gated requirement) with no defensible assumption, or a missing credential. Check the card's existing comments first; the answer is often already there.
      - `routing: blocked — <what is unreachable>` — the reference build or staging unreachable, or its login refused.

      If you cannot finish the spec, still post a comment saying how far you got and what stopped you, with a routing line. A missing comment leaves the next step routing blind.

      ---

      **A defect goes straight to Backlog; only a decision goes to Human-gated.**

      A non-blocking finding stays in your own comment: debt, a copy nit, a deviation the spec is silent on. That is enough in most cases. If it deserves its own card, decide which kind it is. Before filing either kind, check that no existing card or tracker ticket already covers it; if one does, cite it in your comment instead of filing.

      **A. A bug.** Behaviour that contradicts an acceptance criterion or the spec, an unmet AC, a failing or flaky test, a missing translation, a crash, a wrong figure, or a requirement already written in the spec that the code does not meet. Nobody has to decide anything; someone has to fix it.
      1. Create it in **Backlog**. Title: `<tracker key, story id or card id> follow-up: <what>`. `task_type: bug`. Tags: `follow-up` and `bug`, plus the epic and area. Leave `assignee_id` empty: the Planner assigns an agent when it releases the card. The description is the bug form: **What's wrong / Where** (route, file:line) **/ Evidence** (steps, screenshot, the card and comment it came from) **/ Done when**.
      2. **Leave it in Backlog.** The Planner releases it under rung 1. Do not move it to Human-gated and do not release it yourself.

      **Small decisions: apply your own recommendation.** When a finding needs a choice, you can name the options and you would recommend one, check whether the choice touches any of these:
      1. legal, compliance, privacy or consent text, disclosures, or anything a user accepts;
      2. money: pricing, billing, plan limits, fees, what anyone is charged or paid;
      3. something {{inputs.product_owner}} decided in writing — in the spec, the tracker ticket or a `decision` comment — or an approved design, that your recommendation would contradict or narrow;
      4. a credential, vendor account, access grant, or production infrastructure;
      5. deleting or irreversibly changing real data;
      6. the scope of an epic: a new story or ticket, or dropping or weakening an acceptance criterion.

      **None of them → it is a small decision. Do not file a card.** Take your recommendation as an assumption, carry on with your work on it, and post a comment tagged `assumption` on the card you are working: the question in one line, the options with their cost, what you chose and why, and what reversing it would take. A change to how an AC is worded is recorded in that comment, not by editing the AC. If you are unsure whether it is small: it is small when reversing it later would be an ordinary bug card. Examples of small: a layout or wrapping choice, a label's length, a default sort or count rule, whether an empty value is shown, a browser-native vs custom confirm, which existing component to reuse.

      **Any of them → kind B below.**

      **Look it up before kind B. The product is built as the spec and the repository's docs say; a question they already answer is not a decision.** Before you file a kind B card, search these four, in this order, and quote what you find:
      0. **The product spec** at `SPEC_PATH` and the planning artefacts in `PLANNING_DIR`, read on `origin/{{inputs.integration_branch}}` (a spec change that is only on `{{inputs.staging_branch}}` is not in force yet). Unset, or the file missing there → write `spec: not available` and go on to 1. Read each requirement together with every `[AMENDED <date>]` / `[NEW <date>]` block under it; a later block beats the text above it. An open question recorded in the spec that the story cites and that is still open is a gate, not a decision for you to take.
      1. The tracker ticket (the key in the card title, when a tracker tool is in the session): description and acceptance criteria, its parent epic and its linked tickets. A card with no key: its description. Search by the words of the question.
      2. The repository's own docs on `{{inputs.integration_branch}}`: `CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md`, `docs/`, the architecture docs.
      3. The board: `decision` comments on the card you are working, on its parent and intake cards, and on the cards it cites. A later comment beats an earlier one; a product decision by {{inputs.product_owner}} beats an engineering ruling.
      If any of them answers the question there is no card: post a comment tagged `decision` on the card you are working — the question in one line, the answer, and **Source:** the requirement id with its amendment date, the tracker key and field, the file and section, or the comment id — and carry on under that answer. An acceptance criterion that contradicts a later recorded decision is applied as the decision says, and that same comment states that the AC in the spec or the ticket needs updating by a human (agents never write to the tracker). Only a question none of the four answers is kind B.

      **B. A decision a person must take.** A product or scope choice, a legal or compliance question, a credential or access grant, or a change the spec would have to make first. The answer *is* the deliverable.
      1. Create it in **Backlog** with the same title form. Tags: `follow-up` and `needs-human-decision`. The description states the evidence, the card and comment it came from, the options and what each costs, and who decides (product questions: {{inputs.product_owner}}; delivery, access and credential questions: {{inputs.delivery_lead}}). It also says which of the four sources above you searched and why none of them answers; a kind B card without that line is sent back.
      2. Move it to **Human-gated** in the same session. A person decides there: they move it to Backlog, or archive it.

      A finding that is both (a bug whose fix needs a product choice) is filed as B, and the description says so. Follow-ups go only to Backlog (and, for kind B, Human-gated). Never release a follow-up to Tech Design yourself. Say in your comment which follow-up cards you created, by id and kind (bug or decision).
