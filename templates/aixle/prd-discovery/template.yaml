    name: B12 PRD validation
    instructions: |-
      ## Ground rules
      Not bound to a board: never call board tools. Inputs in `/workspace/assets/` (input assets selected at run start plus every earlier step's outputs). Write only to `/workspace/outputs/` with the exact file names below. Write documents in the `LANG:` from `track.md`; talk to the user in the language they write in, whatever other settings say. Do only this step. Required step; the user may still say 'skip validation': then write `/workspace/outputs/step-B12.done` with `skipped: by user` and end the step as the *Session start and end* checklist item says.

      ## Goal
      BMAD `bmad-prd` validate mode: an independent quality gate on `prd.md`. You are not the author; be critical.

      ## Rubric (cite FR and section ids)
      - **Traceability**: every FR realizes a UJ; every SM validates named FRs; counter-metrics exist; vision and scope match `product-brief.md`.
      - **FR quality**: capability not implementation; testable consequences; no vague words without numbers; no duplicate or conflicting FRs; stable numbering; every FR has `src:` and `Confirmation:`; nothing marked Confirmed without a written client confirmation.
      - **Decisions**: no high-impact item (reversed or locked decision, pricing, legal or licence, safety or compliance, removed component, scope change, commitment, anything owned by a named person) is presented as settled when it rests only on an accepted recommendation (`ACCEPTED-REC`) without its owner's confirmation; each such item has a Q-id with its owner.
      - **Glossary**: terms verbatim, no synonyms, new nouns defined.
      - **Scope**: non-goals and MVP in/out explicit and consistent.
      - **Completeness**: NFRs, constraints, integrations, compliance covered where sources or research show they matter; no requirement from `source-digest.md` silently dropped (list any).
      - **Honesty**: assumptions tagged and indexed; open questions that block UX/architecture flagged; 'Not assessed' matches what was really not seen or skipped.

      ## Do
      1. Walk the rubric. Fix mechanical issues directly in `prd.md` (numbering, glossary, cross-references; set `status: reviewed`). Do not change product decisions.
      2. Show the user the verdict and every critical/high finding that needs a decision, one at a time; apply their decisions. If a decision changes the brief, update `product-brief.md` in `/workspace/outputs/` and log it in `brief-decisions.md`.

      ## Output
      Updated `/workspace/outputs/prd.md`; `/workspace/outputs/prd-validation.md`: verdict (READY FOR UX/ARCHITECTURE/EPICS or NEEDS DECISIONS), findings by severity, what you changed, decisions the user made, counts (FRs total / Confirmed / Assumed / Open). Then end the step as the *Session start and end* checklist item says, and state the verdict in your closing message. Say plainly that the current PRD is now this step's `prd.md` (`status: reviewed`); the `prd.md` from B11 in the run's file list is the earlier draft.
