  - key: b09_product_brief
    name: B09 Product brief
    instructions: |-
      ## Ground rules
      Not bound to a board: never call board tools. Inputs in `/workspace/assets/` (input assets selected at run start plus every earlier step's outputs), code in `/workspace/repo/`. Write only to `/workspace/outputs/` with the exact file names below. Write documents in the `LANG:` from `track.md`; talk to the user in the language they write in, whatever other settings say. INTERACTIVE: ask, then wait. Do only this step. Required step (not skippable). Source hierarchy: client written confirmation > the user > documents (newer wins) > observed as-is (code, mockups) > your inference.

      ## Goal
      BMAD `bmad-product-brief`, interactive (coaching) mode, never headless: an honest, right-sized picture of problem, solution, users, scope and success, built from evidence and the user's own answers.

      ## Do
      1. Read `source-digest.md`, `brainstorm.md`, `idea-pressure-test.md` and every `research-*.md` present. Put what is established, what is still thin and which research was skipped into the session opening from the checklist item; do not open a second time.
      2. Offer the mode and wait: **Fast path** (remaining gaps in 1-2 consolidated questions, full draft with `[ASSUMPTION]` tags, user reviews) or **Coaching path** (section by section, 1-3 pointed questions each; push back on thin answers: 'who is the first user?', 'what do they do today?', 'what does failure look like?').
      3. Tag claims by basis: `[CLIENT-CONFIRMED]`, `[USER-DECIDED]`, `[DOC]`, `[RESEARCH]`, `[OBSERVED]`, `[ASSUMPTION]`. A 'yes' to a low-impact recommendation is `[USER-DECIDED]` (accepted recommendation), noted as such. **High-impact check.** A batch 'yes' never settles a high-impact item: reversing a recorded or locked decision, pricing or the commercial model, legal, licence, safety or compliance, removing a component, cutting or adding scope, commitments to dates or third parties, and anything the sources say a named person decides. Ask about each such item with its trade-off, as a choice answered with a letter, never with 'yes': '**<the item in one line>**: **A** - I decide this now · **B** - open for <the named person>', and end with 'Reply with A or B for each.' A reply of 'yes', 'ok', 'all good' or anything that does not give A or B for an item is not an answer for that item: ask again for those items only. A keeps it as a decision, tagged `[USER-DECIDED]` (confirmed in the high-impact check). B tags it `[ACCEPTED-REC]` and adds a Q-id with that owner to `questions-register.md`; it is not presented as decided. Cite research (`research-market.md §3`). Never fabricate moats, users or numbers.
      4. Log each decision in `brief-decisions.md` (decision, reason). New questions go to `questions-register.md` (Q-001.., stable ids, owner, status).
      5. After the draft ask 'anything in your head that is not in here?' and apply it. Finish only when the user confirms the brief reads as theirs.

      ## Structure
      Executive Summary · The Problem · The Solution · What Makes This Different · Who This Serves · Success Criteria · Scope (in / explicitly out) · Vision · Existing system (migration/extension only) · Open Questions · Assumptions Index · Not assessed (sources not seen, research skipped).

      ## Output
      `/workspace/outputs/product-brief.md` (frontmatter: title, created, status: draft), `brief-decisions.md`, `questions-register.md`, optional `brief-addendum.md` (rejected alternatives, detailed personas, sizing). Then end the step as the *Session start and end* checklist item says.
