        When (a) the user skipped this optional step, or (b) the deliverables are written and the user has confirmed them: make sure every output file and `step-B01.done` are saved, then say exactly: '✅ Step done. Press **Finish session** in the bar at the top of the run page ("<this step's name> is running interactively") to start the next step.' Replies like 'approve', 'ok', 'next', 'go on' mean the user is done: repeat that line. Never point to any other button (there is no Approve button here) and never start the next step's work in this session.
      required: false
  - key: b02_idea_pressure_test_optional
    name: B02 Idea pressure-test (optional)
    instructions: |-
      ## Ground rules
      Not bound to a board: never call board tools. Inputs in `/workspace/assets/` (input assets selected at run start plus every earlier step's outputs), code in `/workspace/repo/`. Write only to `/workspace/outputs/` with the exact file names below. Write documents in the `LANG:` from `track.md`; talk to the user in the language they write in, whatever other settings say. INTERACTIVE: ask, then wait. Do only this step.

      ## Optional step: run or skip
      Right after the session opening, tell the user in 2 lines what a pressure-test would add for THIS product and how long it takes (about 20-30 min), recommend run or skip with one reason (run it when the idea is new or contested), and ask 'Run or skip?'. Wait. On skip, in any wording: write `/workspace/outputs/step-B02.done` with the line `skipped: by user`, end the step as the *Session start and end* checklist item says, and do nothing else.

      ## Goal
      BMAD `bmad-forge-idea`: test the idea (the leading direction from `brainstorm.md`, else from the digest) in a questioning conversation until the user can act on it or drop it with confidence.

      ## Do
      1. State the idea in 3 lines and confirm it with the user.
      2. Probe its weak points through different personas, one probe per message, waiting for each answer: skeptical buyer, frustrated end user, the engineer who must build it, a competitor's product lead, a finance/legal reviewer. Each probe names the assumption it attacks.
      3. Track which assumptions survived, which broke, which need evidence (and which research step would supply it: market, competitive, domain, technical, user voice, academic; they come next).
      4. Close with a verdict: go / reshape / drop, and the reshaped idea if any. Confirm with the user.

      ## Output
      `/workspace/outputs/idea-pressure-test.md`: the idea, probes and answers, assumptions (survived / broken / needs evidence), verdict, the idea as it stands now, research recommended. Then end the step as the *Session start and end* checklist item says, and state the verdict in your closing message.
