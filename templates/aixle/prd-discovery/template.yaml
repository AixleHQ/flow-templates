        'We are still working on the PRD for <product, one line>. Route: 00 load assets ✓ → F1 grill ✓ → F2 PRD ✓ → **F3 issues**. This session: **<this step's name>**: <its goal in one line>. Plan: <2-4 bullets from the step instructions>. Output: <file names>.'
        Then go straight into the work.

        ## Session end
        In an interactive run you have NO tool that ends the step: `finish_session` exists only in non-interactive runs, so do not try to load it. The step ends when the user presses **Finish session** in the bar at the top of the run page that says '"<this step's name>" is running interactively.' The run then completes and every file from `/workspace/outputs/` is kept as a run output.

        When the deliverables are written and the user has confirmed them: make sure every output file is saved, then say exactly: '✅ Step done. Press **Finish session** in the bar at the top of the run page ("<this step's name> is running interactively") to finish the run.' Replies like 'approve', 'ok', 'next', 'go on' mean the user is done: repeat that line. Never point to any other button (there is no Approve button here).

        If `finish_session` IS in your tool list (non-interactive run), call it instead, with a short note.
      required: false
- key: prd_full_discovery
  name: PRD Full Discovery
  description: 'Standalone, always-interactive, not bound to a board. Full discovery
    to PRD, built on the BMad Method. Before starting, upload documents, PDFs and
    code archives to the project''s Assets and select them under Input assets; during
    the run you can paste text and images. 00 digest and choice of optional steps
    -> optional brainstorming, pressure-test, research (market, competitive, domain,
    technical, user voice, academic) -> product brief -> optional PRFAQ -> PRD ->
    validation -> optional UX, architecture -> epics and stories -> optional readiness
    check. Optional steps dropped in step 00 are skipped automatically (skip policy
    ''if outputs exist'' + step-<ID>.done markers); kept ones still ask ''run or skip?''.
    Figma is optional and off by default: to analyse mockups, attach a Figma MCP server
    to steps 00 and B13. Independent workflow, not affiliated with or endorsed by
    BMad Code, LLC.'
  base:
    tools:
    - promote_asset
  steps:
  - key: x_00_load_assets_and_plan_the_route
    name: 00 Load assets and plan the route
    instructions: |-
      ## Ground rules (whole workflow)
      This workflow is NOT bound to a board card: never call board tools. Inputs: `/workspace/assets/` (the project assets the user selected under *Input assets* when starting the run), repositories in `/workspace/repo/`, and what the user pastes in chat. Write deliverables only to `/workspace/outputs/`, with exactly the file names given. INTERACTIVE: you ask, the user answers, you wait. Do only this step. The workflow is project-agnostic: take every project specific (names, terms, domain) from the assets and the user, never assume one.
      Language: talk to the user in the language they write in, whatever other settings say. Write every file in the document language the user chooses in item 3.

      ## Goal
      Collect every asset, turn it into one digest, agree which optional BMAD steps to run, and pre-skip the rest.

      ## Do
      1. Open in 3 lines: this workflow runs full BMAD discovery to a PRD, epics and stories; optional steps can be dropped now or skipped when they come up; first you need the assets.
      2. List what is in `/workspace/assets/` and `/workspace/repo/`. Ask whether anything is missing and tell the user exactly how it can be added **during this run**:
         - **Text** (notes, emails, meeting notes, links): paste it into this chat.
         - **Images** (screenshots, mockups): paste or drop them into this terminal; each arrives as a file path in the chat, read it from there.
         - **Documents, PDFs, spreadsheets, archives**: these cannot be added during a run. They must be uploaded to the project's **Assets** first and selected under **Input assets** when a run is started. Offer two options: continue now with what is here (the missing files go under `Not seen`), or stop, upload them, and start a new run.
         **Name clash check:** if any input asset has the same name as a file this workflow writes (`source-digest.md`, `figma-digest.md`, `track.md`, `brainstorm.md`, `idea-pressure-test.md`, any `research-*.md`, `product-brief.md`, `brief-decisions.md`, `brief-addendum.md`, `prfaq.md`, `prd.md`, `prd-addendum.md`, `prd-decisions.md`, `prd-validation.md`, `questions-register.md`, `DESIGN.md`, `EXPERIENCE.md`, `architecture.md`, `epics.md`, `readiness-report.md`, any `step-*.done`), warn the user: in later steps it would replace the workflow's own fresh file (for example an old `prd.md` would replace the validated one). Ask them to start a new run without it; if it is needed as a source, rename it in Assets first (for example `prd-previous.md`).
         In the same message ask: **'Are there Figma mockups that should also be analysed? If yes, paste the Figma file or frame links.'** Wait. Zero files is allowed only if the user confirms; then the digest is built from the chat.
      3. Ask three short questions in one message and wait: (a) is this a NEW product, a MIGRATION/rebuild of an existing system, or an EXTENSION of one; (b) which language the documents should be written in (default: the language the user writes in); (c) the **product folder** name where this run's files will be saved in the project's Assets: propose a short slug from the product name (lowercase letters, digits and dashes, for example `calm-day`) and let the user confirm or change it.
      4. Read the assets. Per source: what it is and the facts it states (goals, users and stakeholders, problems, requirements, constraints, integrations, named competitors, metrics, decisions already made), with pointers `file -> section/page`. Mockups: screens, flows, readable UI copy. Code: stack, modules, data model, what the product visibly does today.
         **Archives and repositories:** unpack archives once into a scratch directory (never into `/workspace/outputs/`). Do not try to read everything: first map the structure (top-level directories, README and docs, manifests, main modules, entry points, routes, schema or models), then read only the parts that bear on requirements (data model, routes and screens, roles and permissions, integrations, configuration that changes behavior). List what you skipped under `Not seen`. Later steps work from `source-digest.md` and open the code only for a specific question.
         Tag every fact `[STATED]` or `[ASSUMPTION]`; list contradictions between sources; list everything you could not open or read under `Not seen`.
      5. Figma (see the section below), only if the user gave links.
      6. Show a readback of at most 12 lines: what the product is, what the assets settle, the biggest unknowns. Ask the user to confirm or correct it. If you propose a source precedence (for example 'document A supersedes document B'), ask it as its own question.
      7. Show the optional steps as one numbered list, each with a one-line 'run / skip' recommendation specific to this product: B01 Brainstorming, B02 Idea pressure-test, B03 Market research, B04 Competitive research, B05 Domain research, B06 Technical research, B07 User-voice research, B08 Academic literature, B10 PRFAQ, B13 UX specification, B14 Architecture, B16 Readiness check. Ask: 'Which of these should I drop now? Dropped steps are skipped automatically, with no session; the ones you keep will each still ask "run or skip?" when they come up. Reply e.g. "drop 3, 8, 10", "keep all", or "as recommended".' Wait. Required steps (B09 brief, B11 PRD, B12 validation, B15 epics) cannot be dropped.
         **Read the answer literally.** 'As recommended' means your list as shown. Any other reply that does not decide every optional step (for example 'do market and competitor research'): show your reading as 'keep: … / drop: …' and ask again. Never fill the gaps with your own recommendation.
      8. Write the skip markers (section below), then show the route in one line, e.g. 'Route: 00 -> B03 -> B04 -> B09 -> B11 -> B12 -> B15', and ask the user to confirm.

      ## Skip markers (how steps get skipped without a session)
      A later step is skipped automatically, with no session and no click, when a file named `step-<ID>.done` already exists in the run's outputs. For every optional step the user dropped, write `/workspace/outputs/step-<ID>.done` containing one line: `skipped by step 00: <reason>`. Use exactly these IDs: B01, B02, B03, B04, B05, B06, B07, B08, B10, B13, B14, B16. Never write a marker for a step on the route, and never for B09, B11, B12, B15.

      ## Figma (optional, off by default)
      - This workflow ships without a Figma connection. Figma tools exist in this session only if a project admin has attached a Figma MCP server to this step and to step B13.
      - Use Figma tools only if the user said there are Figma mockups and gave links, and only on those links. Do not browse other files, teams or projects.
      - If the user gave Figma links but no Figma tools are available, or they fail (missing or invalid token, no access): say in one line that Figma is not connected for this project, and recommend: 'A project admin can add a Figma MCP server from the connector catalog (for example the Framelink Figma-Context-MCP connector), store the Figma token as a project secret, attach the server to the steps "00 Load assets and plan the route" and "B13 UX specification", then start a new run.' Meanwhile offer the fallback: export the key frames as PNG and paste or drop them here. Continue with what you have and list the Figma links under `Not seen`.
      - When the tools work, extract per frame: screen name and purpose, the flow it belongs to, UI copy, components and states (empty, error, loading), data shown, open questions the design raises, and the frame link. Download frame images only when the visual matters. Mark what the design decides as `[DESIGN]`; note where design and documents disagree.

      ## Output
      - `/workspace/outputs/source-digest.md`: Sources · Project in one paragraph · Goals · Users and stakeholders · Problems · Requirements and wishes · Constraints · Integrations · Named competitors · Metrics · Decisions already made · Design (summary, if any) · Contradictions · Not seen · Draft glossary.
      - `/workspace/outputs/figma-digest.md`, only when Figma was analysed: per frame as above, plus a flow map.
      - `/workspace/outputs/track.md`, exactly:
        line 1 `TRACK: bmad`
        line 2 `PROJECT_TYPE: new | migration | extension`
        line 3 `LANG: <document language>`
        line 4 `FIGMA: no` or `FIGMA: yes <links separated by spaces>` (yes only if Figma was actually analysed)
        line 5 `ROUTE: <step IDs on the route, space separated>`
        line 6 `FOLDER: <product folder slug confirmed in item 3>`
        then up to 5 lines of context (product in one sentence, stakes, source precedence the user confirmed).
      - The `step-<ID>.done` markers for dropped steps.
      Then end the step as the first checklist item says.
    agent: prd_bmad_analyst
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: false
    bmad_enabled: false
