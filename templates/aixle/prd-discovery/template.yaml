  - key: b11_prd
    name: B11 PRD
    instructions: |-
      ## Ground rules
      Not bound to a board: never call board tools. Inputs in `/workspace/assets/` (input assets selected at run start plus every earlier step's outputs), code in `/workspace/repo/`. Write only to `/workspace/outputs/` with the exact file names below. Write documents in the `LANG:` from `track.md`; talk to the user in the language they write in, whatever other settings say. INTERACTIVE: ask, then wait. Do only this step. Required step (not skippable). Source hierarchy: client written confirmation > the user > documents (newer wins) > observed as-is (code, mockups) > your inference.

      ## Goal
      BMAD `bmad-prd`, interactive mode, never headless: write the PRD together with the user. You facilitate and draw the thinking out; you do not do it for them.

      ## Inputs
      Required `product-brief.md` (if it is missing, say in one line that the brief step did not run, write no PRD, and end the step). Also `source-digest.md`, `brief-decisions.md`, `questions-register.md`, and whichever exist: `brainstorm.md`, `idea-pressure-test.md`, `research-*.md`, `prfaq.md`.

      ## How to run it
      1. Put what the brief and research settle, the stakes (internal / launch / regulated) and the right depth into the session opening from the checklist item (do not open a second time), then offer the mode and wait:
         - **Fast path**: remaining gaps in 1-2 consolidated questions, full draft with `[ASSUMPTION]` tags, user reviews.
         - **Coaching path**: in order, 1-3 questions per message, showing each part before moving on: vision and target users with JTBD; key user journeys UJ-1..N (entry, path, climax, resolution); glossary; features and FRs; non-goals and MVP scope; success metrics and counter-metrics; NFRs, constraints, compliance as the product needs.
      2. For every FR ask 'how would we test this?' until it has testable consequences. Challenge vague words ('fast', 'simple') for numbers. Ask what is explicitly NOT in v1.
      3. Volunteered technical depth and rejected alternatives go to `prd-addendum.md` as you go. Log each decision in `prd-decisions.md` (decision, reason, basis: `USER-DECIDED`, `ACCEPTED-REC`, `ASSUMPTION`, `DOC`). **High-impact check.** A batch 'yes' never settles a high-impact item: reversing a recorded or locked decision, pricing or the commercial model, legal, licence, safety or compliance, removing a component, cutting or adding scope, commitments to dates or third parties, and anything the sources say a named person decides. Ask about each such item with its trade-off, as a choice answered with a letter, never with 'yes': '**<the item in one line>**: **A** - I decide this now · **B** - open for <the named person>', and end with 'Reply with A or B for each.' A reply of 'yes', 'ok', 'all good' or anything that does not give A or B for an item is not an answer for that item: ask again for those items only. A keeps it as a decision, tagged `[USER-DECIDED]` (confirmed in the high-impact check). B tags it `[ACCEPTED-REC]` and adds a Q-id with that owner to `questions-register.md`; it is not presented as decided. If a decision here changes the brief (users, scope, success criteria, positioning), update `product-brief.md` in `/workspace/outputs/` and log it in `brief-decisions.md`.
      4. At the end: list Open Questions and `[ASSUMPTION]` tags; resolve those that block UX/architecture one at a time; defer the rest with owner. Ask 'anything in your head or in the sources that is not in the PRD?' and reconcile against the digest and the brief. Finish only when the user confirms.

      ## Discipline
      Capabilities, not implementation. FRs globally numbered and stable (FR-1..N): actor + capability + conditions, `Realizes UJ-n`, 2-4 testable consequences, and `src:` (file §section or Q-id) plus `Confirmation:` (Confirmed only if the client confirmed in writing; Assumed; Open with its Q-id). Glossary terms verbatim. Every SM-n names the FRs it validates; counter-metrics SM-Cn. Length scales with stakes.

      ## Structure
      0 Document Purpose · 1 Vision · 2 Target Users (JTBD, non-users, UJ-1..N) · 3 Glossary · 4 Features (FRs nested) · 5 Non-Goals · 6 MVP Scope · 7 Success Metrics · 8 NFRs and Constraints · 9 Integrations and Dependencies · 10 Compliance (if any) · 11 Open Questions (mark **blocks UX/architecture**) · 12 Assumptions Index · 13 Not assessed (sources not seen, research skipped).

      ## Output
      `/workspace/outputs/prd.md` (frontmatter: title, created, status: draft, method: bmad), `prd-addendum.md`, `prd-decisions.md`, updated `questions-register.md`, and `product-brief.md` / `brief-decisions.md` if the brief changed. Then end the step as the *Session start and end* checklist item says.
