  - key: f3_fast_track_issues_to_issues
    name: 'F3 Fast track: issues (to-issues)'
    instructions: |-
      ## Ground rules
      Not bound to a board: never call board tools and never publish to a tracker; issues are written as files. Inputs in `/workspace/assets/` (`prd.md`, `grill-log.md`, `design-tree.md`, `source-digest.md`, `track.md`, uploaded assets), code in `/workspace/repo/`. Write only to `/workspace/outputs/`. Do only this step.
      Language: `LANG:` in `track.md` is the language of every file you write. Talk to the user in the language they write in, whatever other settings say.

      If `prd.md` is missing, the PRD step did not finish properly: say so in one line, tell the user to restart the run, and do nothing else.

      ## Goal
      The grill-me method's `to-issues`: break the PRD into independently grabbable issues using **tracer-bullet vertical slices**.

      ## Vertical slice rules
      - Each issue is a thin vertical slice through ALL layers end to end (data, API, UI, tests), never a horizontal slice of one layer.
      - A completed slice is demoable or verifiable on its own.
      - Each slice is small enough for one agent to build in one fresh session (one context window); split anything bigger.
      - Prefactoring ('make the change easy, then make the easy change') comes first, as its own issue.
      - A wide refactor (one mechanical change with a big blast radius) is sliced expand -> migrate in batches -> contract instead.

      ## Do
      1. If code exists, explore it for the current state and prefactoring opportunities. Use the project vocabulary.
      2. Draft the slices. Present them as a numbered list: **Title**, **Blocked by**, **User stories covered** (numbers from `prd.md`).
      3. Ask: does the granularity feel right (too coarse / too fine)? Are the dependencies right? Merge or split anything? Iterate until the user approves.
      4. Check coverage: every user story in `prd.md` is covered by at least one slice or explicitly deferred.

      ## Output
      `/workspace/outputs/issues.md`: the approved slices in dependency order (blockers first), each with this body:
      ```
      ## <ID>. <Title>
      ### What to build
      End-to-end behavior of this slice, not layer by layer. No file paths or code.
      ### Acceptance criteria
      - [ ] ...
      ### User stories covered
      ### Blocked by
      <IDs, or 'None - can start immediately'>
      ```
      plus a coverage table (user story -> issue IDs) at the end.

      **Saving to the project:** read the product folder from line 6 of `track.md` (`FOLDER: <slug>`; if it is missing, use a lowercase dashed slug of the product name). Call `promote_asset` with `name: "prd.md"` and `folder: "<slug>"` (it comes from the previous step, so it is already a run file and can be copied; the folder keeps this product's files apart from other products' files of the same name). `issues.md` is written in this session and becomes a run file only after the session ends, so it cannot be copied from here. In your closing message tell the user, in one line: 'To keep every file of this run in the project's Assets, including issues.md: open the run page, Assets tab, press **Promote all to project** and enter `<slug>` in the Folder field.' (If the user asks for share links, `share_asset` works only for files from previous steps.)
      Then end the step as the *Session start and end* checklist item says, and state in your closing message the issue count and the first issues that can start immediately.
    agent: prd_fast_pm
    depends_on:
    - f2_fast_track_prd_to_prd
