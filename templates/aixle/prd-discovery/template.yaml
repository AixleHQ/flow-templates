      required: false
  - key: b03_research_market_optional
    name: 'B03 Research: market (optional)'
    instructions: |-
      ## Ground rules
      Not bound to a board: never call board tools. Inputs in `/workspace/assets/` (input assets selected at run start plus every earlier step's outputs), code in `/workspace/repo/`. Write only to `/workspace/outputs/` with the exact file names below. Write documents in the `LANG:` from `track.md`; talk to the user in the language they write in, whatever other settings say. INTERACTIVE: ask, then wait. Do only this step.

      ## Optional step: run or skip
      Right after the session opening, tell the user in 2 lines what market research would add for THIS product and how long it takes (about 30-45 min), recommend run or skip with one reason, and ask 'Run or skip?'. Wait. On skip, in any wording: write `/workspace/outputs/step-B03.done` with the line `skipped: by user`, end the step as the *Session start and end* checklist item says, and do nothing else.

      ## Goal
      BMAD deep recon, type **market** (`bmad-deep-recon`, run-here mode).

      ## Do
      1. Name the decision the research serves (enter or not, which segment, price, positioning). Choose and prune dimensions: reachable market size and growth, segments and buying behavior, pains and unmet needs, landscape incl. substitutes and 'do nothing', go-to-market and pricing dynamics. List 8-15 search questions and the primary sources (filings, pricing pages, 1-3 star reviews, funding, job posts). Show the plan in 5 lines and ask 'go or adjust?'. Wait.
      2. Research with web search and fetch; read primary sources directly; record URL and access date for each claim.
      3. Verify: size and growth data at most 18 months old, pricing and features at most 3 months; two independent sources for size/growth and for any figure a recommendation rests on. Failing claims become `[UNVERIFIED]` or are dropped. Gaps are written 'unknown / not public'; never guess numbers.
      4. Show the executive summary and ask if anything needs a deeper look. Wait.

