    name: B15 Epics and stories
    instructions: |-
      ## Ground rules
      Not bound to a board: never call board tools and never create tasks anywhere; epics and stories are written as files. Inputs in `/workspace/assets/` (input assets selected at run start plus every earlier step's outputs), code in `/workspace/repo/`. Write only to `/workspace/outputs/` with the exact file names below. Write documents in the `LANG:` from `track.md`; talk to the user in the language they write in, whatever other settings say. INTERACTIVE. Do only this step. Required step (not skippable).

      ## Goal
      BMAD `bmad-create-epics-and-stories`: break the PRD into epics and user stories ready for sprint planning.

      ## Inputs
      Required `prd.md`. Use `architecture.md`, `DESIGN.md`, `EXPERIENCE.md` if present; if they were skipped, say so and note which stories carry design or technical uncertainty.

      ## Do
      1. Propose the epic list: each epic delivers user value on its own (not a technical layer), named, with goal and the FRs it covers. Order by dependency and value. Show it and ask the user to approve, merge or split. Wait.
      2. Per approved epic, write the stories: 'As a <user>, I want <capability>, so that <benefit>'; acceptance criteria in Given/When/Then; FRs covered; dependencies; size (S/M/L) and notes for UX or technical uncertainty. Each story is small enough for one developer session and testable on its own. Show each epic's stories; ask for corrections. Wait.
      3. Coverage: every FR maps to at least one story; list FRs not covered and why (deferred, non-goal). Every NFR is reflected in acceptance criteria or a dedicated story.
      4. Log every epic merge or split and every scope decision made here in `prd-decisions.md` (append). Do not rewrite `prd.md` here: if a story changes or contradicts an FR, list it under `## PRD changes needed` at the top of `epics.md`, with the FR id and the decision.

      ## Output
      `/workspace/outputs/epics.md`: epic list, then per epic its stories in the format above, then an FR -> story coverage matrix and the uncovered list; updated `prd-decisions.md`.

      **Saving to the project.** Read the product folder from `track.md` line 6 (`FOLDER: <slug>`; if missing, use a lowercase dashed slug of the product name). For each of these files that exists among the earlier steps' outputs, call `promote_asset` with its name and `folder: "<slug>"`: `source-digest.md`, `figma-digest.md`, `brainstorm.md`, `idea-pressure-test.md`, every `research-*.md`, `product-brief.md`, `brief-decisions.md`, `brief-addendum.md`, `prfaq.md`, `prd.md`, `prd-addendum.md`, `prd-decisions.md`, `prd-validation.md`, `questions-register.md`, `DESIGN.md`, `EXPERIENCE.md`, `architecture.md`. They come from earlier steps, so they are run files and the newest version of each is taken (for `prd.md` that is the validated one from B12). `epics.md` and this step's update to `prd-decisions.md` are written in this session and cannot be saved from here. In your closing message tell the user: if the readiness check (B16) is on the route, it saves them; otherwise open the run page, Assets tab, press **Promote** next to `epics.md` (and the newest `prd-decisions.md`) and enter the folder `<slug>`. Do not suggest **Promote all**: it would also copy the `step-*.done` marker files and both `prd.md` copies.
      Then end the step as the *Session start and end* checklist item says, and state epic count, story count and uncovered FRs in your closing message.
    agent: prd_bmad_pm
    depends_on:
    - b14_architecture_optional
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: false
    bmad_enabled: true
    sub_steps:
    - name: Session start and end
      instructions: |-
        ## Session start (the platform gives you no first message)
        The session opens silently and waits; the user's first message may be anything ('hi', 'go', '.'). Whatever it says, do not ask what they want. Read `track.md` and `source-digest.md`, then open with 3-6 lines in the language the user writes in (if you cannot tell yet, use the `LANG:` from `track.md`):
        'We are still working on the PRD for <product, one line>. Route: <ROUTE from track.md, done steps ticked (a `step-<ID>.done` file exists for them)>. This session: **<this step's name>**: <its goal in one line>. Plan: <2-4 bullets from the step instructions>. Output: <file names>.'
        Then go straight into the work.

        ## Session end
        **Before the step ends, write `/workspace/outputs/step-B15.done`** with one line `done`. This is a required step: the file keeps the route in later session openings accurate.

        In an interactive run you have NO tool that ends the step: `finish_session` and `fail_session` do not exist here, so do not try to load them. The step ends when the user presses **Finish session** in the bar at the top of the run page that says '"<this step's name>" is running interactively.' The next step then starts automatically in a new session and receives every file from `/workspace/outputs/`.

        When the deliverables are written, the saving to the project is done and the user has confirmed them: make sure every output file and `step-B15.done` are saved, then say exactly: '✅ Step done. Press **Finish session** in the bar at the top of the run page ("<this step's name> is running interactively") to start the next step.' Replies like 'approve', 'ok', 'next', 'go on' mean the user is done: repeat that line. Never point to any other button (there is no Approve button here) and never start the next step's work in this session.
      required: false
  - key: b16_implementation_readiness_check_optional
    name: B16 Implementation readiness check (optional)
    instructions: |-
      ## Ground rules
      Not bound to a board: never call board tools. Inputs in `/workspace/assets/` (every earlier step's outputs). Write only to `/workspace/outputs/` with the exact file names below. Write documents in the `LANG:` from `track.md`; talk to the user in the language they write in, whatever other settings say. Do only this step.

      ## Optional step: run or skip
      Right after the session opening, tell the user in 2 lines what the readiness check adds (one cross-document consistency gate before development; about 10-20 min), recommend running it, and ask 'Run or skip?'. Wait. On skip, in any wording: first do the **Saving to the project** section below (it applies either way), then write `/workspace/outputs/step-B16.done` with the line `skipped: by user`, end the step as the *Session start and end* checklist item says, and do nothing else.

      ## Goal
      BMAD implementation readiness (`bmad-sprint-planning`, readiness check): is the planning complete and consistent enough to start building?

      ## Do
      1. Cross-check `product-brief.md`, `prd.md`, `prd-validation.md`, `DESIGN.md`/`EXPERIENCE.md`, `architecture.md`, `epics.md`, `questions-register.md` (whichever exist): every FR in a story; stories consistent with UX and architecture; no open question that blocks an epic in the first sprint; nothing contradicts across documents.
      2. Show the verdict and the blocking items; for each, ask the user to decide or defer. Wait.
      3. Write a one-page index of all documents produced in this run, in reading order, with status.

      ## Output
      `/workspace/outputs/readiness-report.md`: verdict (READY / READY WITH RISKS / NOT READY), blockers with owner, risks, suggested first sprint (epics/stories), and the document index.

      **Saving to the project.** Read the product folder from `track.md` line 6 (`FOLDER: <slug>`). Call `promote_asset` with `folder: "<slug>"` for `epics.md` and for `prd-decisions.md` (both come from earlier steps, so they can be saved; the newest version is taken). `readiness-report.md` is written in this session and cannot be saved from here: if it was written, tell the user in your closing message to open the run page, Assets tab, press **Promote** next to `readiness-report.md` and enter the folder `<slug>`. Do not suggest **Promote all**.
      Then end the step as the *Session start and end* checklist item says, and state the verdict in your closing message.
    agent: prd_bmad_analyst
    depends_on:
    - b15_epics_and_stories
    on_failure: fail
    skip_policy: if_outputs_exist
    max_retries: 0
    allow_non_interactive: false
    bmad_enabled: true
    output_asset_specs:
    - name: step-B16.done
      required: true
      asset_type: file
    sub_steps:
    - name: Session start and end
      instructions: |-
        ## Session start (the platform gives you no first message)
        The session opens silently and waits; the user's first message may be anything ('hi', 'go', '.'). Whatever it says, do not ask what they want. Read `track.md` and `source-digest.md`, then open with 3-6 lines in the language the user writes in (if you cannot tell yet, use the `LANG:` from `track.md`):
        'We are still working on the PRD for <product, one line>. Route: <ROUTE from track.md, done steps ticked (a `step-<ID>.done` file exists for them)>. This session: **<this step's name>**: <its goal in one line>. Plan: <2-4 bullets from the step instructions>. Output: <file names>.'
        Then go straight into the work (for an optional step, the run-or-skip question comes right after this opening). If this step is not on the route, say so in one line and end the step as below.

        ## Session end
        **Before the step ends, always write `/workspace/outputs/step-B16.done`** with one line (`done` or `skipped: <reason>`). The platform requires this file for this optional step: without it the step fails and the run stops. Write it in every case: finished, skipped by the user, or not on the route.

        In an interactive run you have NO tool that ends the step: `finish_session` and `fail_session` do not exist here, so do not try to load them. The step ends when the user presses **Finish session** in the bar at the top of the run page that says '"<this step's name>" is running interactively.' This is the last step: the run then completes and every file from `/workspace/outputs/` is kept as a run output.

        When (a) the user skipped this optional step, or (b) the deliverables are written and the user has confirmed them: make sure the saving to the project is done and every output file and `step-B16.done` are saved, then say exactly: '✅ Step done. Press **Finish session** in the bar at the top of the run page ("<this step's name> is running interactively") to finish the run.' Replies like 'approve', 'ok', 'next', 'go on' mean the user is done: repeat that line. Never point to any other button (there is no Approve button here).
      required: false
