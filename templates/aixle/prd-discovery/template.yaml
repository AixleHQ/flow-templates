    - name: Session start and end
      instructions: |-
        ## Session start (the platform gives you no first message)
        The session opens silently and waits; the user's first message may be anything ('hi', 'go', '.', a question). Whatever it says, do not ask what they want: start item 1 of the step instructions immediately (say what this workflow does and ask for the assets).

        ## Session end
        In an interactive run you have NO tool that ends the step: `finish_session` and `fail_session` do not exist here, so do not try to load them. The step ends when the user presses **Finish session** in the bar at the top of the run page that says '"<this step's name>" is running interactively.' The next step then starts automatically in a new session and receives every file from `/workspace/outputs/`.

        When the outputs and skip markers are written and the user has confirmed the route, say exactly: '✅ Step done. Press **Finish session** in the bar at the top of the run page ("<this step's name> is running interactively") to start the next step.' Replies like 'approve', 'ok', 'next', 'go on' mean the user is done: repeat that line. Never point to any other button (there is no Approve button here) and never start the next step's work in this session.
      required: false
  - key: b01_brainstorming_optional
    name: B01 Brainstorming (optional)
    instructions: |-
      ## Ground rules
      Not bound to a board: never call board tools. Inputs in `/workspace/assets/` (input assets selected at run start plus every earlier step's outputs), code in `/workspace/repo/`. Write only to `/workspace/outputs/` with the exact file names below. Write documents in the `LANG:` from `track.md`; talk to the user in the language they write in, whatever other settings say. INTERACTIVE: ask, then wait. Do only this step.

      ## Optional step: run or skip
      Right after the session opening, tell the user in 2 lines what this step would add for THIS product and how long it takes (about 20-40 min), recommend run or skip with one reason (skip when the solution shape is already fixed by the assets), and ask 'Run or skip?'. Wait. On skip, in any wording: write `/workspace/outputs/step-B01.done` with the line `skipped: by user`, end the step as the *Session start and end* checklist item says, and do nothing else.

      ## Goal
      BMAD brainstorming session (`bmad-brainstorming`): widen the solution space before it narrows.

      ## Do
      1. Read `source-digest.md`; state the brainstorm focus in one line and confirm it with the user.
      2. Offer 3-4 fitting techniques (e.g. How Might We, SCAMPER, role storming, first principles, reverse brainstorming, What If) and let the user pick or let you choose.
      3. Facilitate: one prompt at a time, build on the user's ideas, add your own clearly labelled. Aim for quantity first, then cluster.
      4. Converge: group ideas into themes, ask the user to pick the top 3-5, note quick wins vs bigger bets.

      ## Output
      `/workspace/outputs/brainstorm.md`: focus, techniques used, all ideas by theme, the user's top picks with reasons, quick wins, bigger bets, questions raised. Then end the step as the *Session start and end* checklist item says, and state the top picks in your closing message.
    agent: prd_bmad_analyst
    depends_on:
    - x_00_load_assets_and_plan_the_route
