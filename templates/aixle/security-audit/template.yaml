workflows:
- key: repository_security_audit
  name: Repository security audit
  description: 'White-box security audit of the project repository: recon/threat model
    and deterministic scanners in parallel, three parallel vulnerability hunts, independent
    skeptic verification, then a report and one Fix Backlog card per confirmed finding.
    Starts when an audit card enters Auditing.'
  base:
    tools:
    - board_get_task
    - board_get_comments
    - board_add_comment
    skills:
    - security_finding_rubric
    repositories:
    - target
  steps:
  - key: recon_and_threat_model
    name: Recon and threat model
    instructions: |-
      Map the target repository (see "Target repository" in `security-finding-rubric`) for the security audit. This is read-only: change no code, run nothing against external systems.

      Read the audit card first (`board_get_task`). Its description may set **scope** (paths to include or exclude), **depth** (quick / standard / deep; default standard) and context about how the system is deployed. Respect it.

      Use the `audit-context-building` and `security-threat-model` skills as your method.

      Write to `/workspace/outputs/`. Write each document **section by section**, per "Engagement context" in the rubric: create the file with its first section, then append each following section as a separate edit. Keep the threat model descriptive and defensive: it names weaknesses and where they are, not how to exploit them.

      1. **`threat-model.md`**
         - System summary: stack, frameworks, and the deployable units (web app, API, workers, CLI).
         - Assets: data and capabilities that need protecting, such as PII, credentials, money, admin actions and tenant data.
         - Actors and privilege levels: anonymous, user, admin, other tenant, service.
         - Trust boundaries, and how data crosses each one.
         - Security mechanisms, precisely:
           - how authentication happens (file:line)
           - how authorization is enforced (file:line)
           - where input is validated
           - how output is encoded
           - how secrets are loaded
         - STRIDE table: one row per trust boundary, each row pointing at the code it concerns. Keep cells short.
         - Assumptions and unknowns.
         - Top 10 hotspots: the files or areas most likely to hold serious bugs, and why.
      2. **`entry-points.md`**: a table of every externally reachable entry point. Find them from the framework's routing (route files, decorators, controller and handler registration), not by grepping for handlers. Columns: method + path (or trigger), handler file:line, auth required (none / user / admin), and the authz check it applies (or "NONE FOUND"). Group the table by component. Include webhooks, file uploads, websocket handlers, background jobs that consume external data, and GitHub Actions workflows.

      Depth:
      - quick: top 3 components only.
      - standard: everything in scope.
      - deep: also trace which helper each route actually calls for authz.

      If a write is interrupted, follow the rubric's retry rule. Fail the step only when a required section is still missing after two attempts, and say which section.

      Finish by commenting on the audit card: a 5-line summary, the entry-point count, and the hotspot list.
    agent: recon_analyst
    skills:
    - audit_context_building
    - security_threat_model
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
  - key: run_scanners
    name: Run scanners
    instructions: |-
      Collect deterministic scanner evidence for the audit of the target repository (see "Target repository" in `security-finding-rubric`).

      1. Follow the `security-scanners` skill exactly:
         - install the pinned, checksum-verified scanners
         - run gitleaks, osv-scanner, trivy, and zizmor (zizmor only if `.github/workflows` exists)
         - write the raw output to `/workspace/outputs/scanners/`
      2. Normalize the results into `/workspace/outputs/scanner-findings.json` and `/workspace/outputs/scanner-summary.md`, as the skill describes.
      3. Add a short supply-chain section to `scanner-summary.md` covering:
         - direct vs transitive dependencies for each vulnerable package
         - packages that look abandoned or typosquatted
         - dependencies with install scripts
         - GitHub Actions not pinned to a SHA
         - tools downloaded without an integrity check (`curl | sh`, unpinned `latest`)
      4. Respect scope exclusions from the audit card (`board_get_task`).

      Do not judge exploitability here. Record what the tools say; the hunt and verify steps decide what matters. Secret values must never appear in any output or comment (gitleaks `--redact` is mandatory).

      Finish by commenting on the audit card with the table of counts per tool and per category, plus any scanner that was unavailable.
    agent: vulnerability_hunter
    skills:
    - security_scanners
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
  - key: hunt_access_control_and_business_logic
    name: 'Hunt: access control and business logic'
    instructions: |-
      Hunt for **authentication, authorization and business-logic** vulnerabilities in `/workspace/repo`. This hunt is read-only.

      Inputs (in `/workspace/assets/`): `threat-model.md`, `entry-points.md`, `scanner-findings.json`. Read the audit card for scope (`board_get_task`).

      Method (use the `security-review` skill's authn/authz, business-logic and session references):
      1. Walk `entry-points.md` row by row. For each handler, decide:
         - Is authentication enforced, or can the route be reached anonymously when it should not be?
         - Is the object loaded scoped to the caller? Look for IDOR / BOLA: a client-supplied id loaded without an ownership or tenant check.
         - Is there function-level authz? Look for admin-only actions that are missing the role check.
         - Is there mass assignment? Look for role, owner or price fields accepted from the request.
      2. Authn internals:
         - password reset and token flows (predictability, expiry, reuse)
         - JWT handling (alg none, weak secret, unverified claims)
         - session fixation
         - OAuth `state` and redirect_uri checks
         - 2FA bypass
      3. Business logic:
         - state machines that can be skipped (checkout, approval)
         - negative quantities and prices
         - race-prone balance or coupon updates
         - trust in client-computed values
      4. Where one route has a check and a sibling route lacks it, that is a candidate.

      Output `/workspace/outputs/candidates-access.json`: an array in the `security-finding-rubric` candidate schema, with ids `H-ACCESS-NNN`. Include candidates with confidence ≥ 0.5 only. Every candidate needs a traced path with file:line per hop. Apply the hard exclusions.

      Depth from the card: quick = top 20 routes by risk; standard = all; deep = all, plus every helper they call.
    agent: vulnerability_hunter
    skills:
    - security_review
    depends_on:
    - recon_and_threat_model
    - run_scanners
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
  - key: hunt_injection_and_data_flow
    name: 'Hunt: injection and data flow'
    instructions: |-
      Hunt for **injection and unsafe data-flow** vulnerabilities in `/workspace/repo`. This hunt is read-only.

      Inputs (in `/workspace/assets/`): `threat-model.md`, `entry-points.md`, `scanner-findings.json`. Read the audit card for scope (`board_get_task`).

      Method (use the `security-review` skill's injection, XSS, SSRF, deserialization and file-handling references). Trace from every source in `entry-points.md` to these sinks:
      - **SQL / NoSQL / ORM injection**: raw queries, string-built where-clauses, `$where`, and operator injection from JSON bodies.
      - **OS command and code injection**: `exec`/`spawn`/`system`/backticks, `eval`/`Function`, template injection (SSTI).
      - **XSS**:
        - stored, reflected and DOM
        - places that turn off auto-escaping (`html_safe`, `raw`, `dangerouslySetInnerHTML`, `bypassSecurityTrust*`, `v-html`)
        - unsafe `href`/`src` with `javascript:`
      - **SSRF**: server-side fetch of a user-supplied URL, including redirects, DNS rebinding, and cloud metadata.
      - **Path traversal and file upload**: user-controlled paths, zip-slip, content-type trust, uploads served from the app origin.
      - **Unsafe deserialization**: YAML/pickle/Marshal/`node-serialize`, XXE in XML parsers.
      - **Open redirect, header or CRLF injection, prototype pollution**: deep merge of request JSON.

      Prefer a full source → sink trace over sink grepping. A sink with no reachable attacker-controlled source is not a candidate.

      Output `/workspace/outputs/candidates-injection.json`: an array in the `security-finding-rubric` candidate schema, with ids `H-INJ-NNN`, confidence ≥ 0.5, and file:line per hop. Apply the hard exclusions.
    agent: vulnerability_hunter
    skills:
    - security_review
    depends_on:
    - recon_and_threat_model
    - run_scanners
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
  - key: hunt_secrets_crypto_config_and_supply_chain
    name: 'Hunt: secrets, crypto, config and supply chain'
    instructions: |-
      Hunt for **secrets, cryptography, insecure configuration and CI/supply-chain** vulnerabilities in the target repository, and triage the scanner results. This hunt is read-only.

      Inputs (in `/workspace/assets/`): `threat-model.md`, `entry-points.md`, `scanner-findings.json`, `scanner-summary.md`. Read the audit card for scope (`board_get_task`).

      Method:
      1. **Scanner triage.** Apply "Scanner evidence joins a finding" in `security-finding-rubric`. Turn every scanner entry that is exploitable in this code into a candidate, with `related_scan_ids` set. Collapse several entries with one root cause into one candidate. Decide exploitability this way:
         - **Secrets:** it is exploitable if it is real and usable, not a placeholder or test fixture. Say whether it is in shipped code or only in history, and what an attacker could do with it.
         - **Dependency CVEs:** it is exploitable if the vulnerable function or feature is actually used. Cite the call site.
         - **trivy misconfigurations:** they count only if the Dockerfile or IaC is actually deployed.
         - **zizmor:** it counts if the workflow is triggered by untrusted input.
         Leave the rest out, and list what you dropped and why in `/workspace/outputs/scanner-triage-config.md`.
      2. **Crypto:**
         - hand-rolled crypto, ECB, static IVs, MD5/SHA1 for passwords, missing salt, low bcrypt cost
         - `Math.random` / `rand` used for tokens
         - non-constant-time secret comparison
         - JWT signing with a hardcoded or weak key
      3. **Insecure defaults** (`insecure-defaults` skill):
         - debug mode in production config
         - permissive CORS with credentials
         - CSRF disabled
         - cookies without Secure/HttpOnly/SameSite
         - default admin credentials
         - fail-open error handling
         - verbose stack traces returned to clients
      4. **CI and supply chain** (`gha-security-review` skill):
         - `pull_request_target` with a checkout of the PR head
         - expression injection of `${{ github.event.* }}` into `run:`
         - over-broad `GITHUB_TOKEN` permissions
         - actions not pinned to a SHA, when they run with secrets
         - secrets exposed to fork PRs

      Output `/workspace/outputs/candidates-config.json`: an array in the `security-finding-rubric` candidate schema, with ids `H-CFG-NNN` and `related_scan_ids` filled in. Never write a secret value; cite file, line, commit and rule only.
    agent: vulnerability_hunter
    skills:
    - security_review
    - insecure_defaults
    - gha_security_review
    depends_on:
    - recon_and_threat_model
    - run_scanners
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
  - key: verify_findings
    name: Verify findings
    instructions: |-
      Independently verify every candidate finding. Your job is to reject whatever the code does not prove. This step is read-only: nothing may be executed against live systems.

      Inputs (in `/workspace/assets/`):
      - `candidates-access.json`, `candidates-injection.json`, `candidates-config.json`
      - `threat-model.md`, `entry-points.md`, `scanner-findings.json`

      Method: use the `fp-check` skill and the verification standard in `security-finding-rubric`.
      1. Merge the three candidate files. Where candidates describe the same root cause, keep the best-evidenced one, mark the others `MERGED`, and join their `related_scan_ids`.
      2. **Scanner sweep.** Go through every critical and high entry in `scanner-findings.json`, plus every secret entry. Check that each one either belongs to a candidate or was left out for a stated reason. If an entry looks exploitable and no candidate covers it, add it as a candidate yourself (id `V-SCAN-NNN`). A scanner overlap is never a reason to exclude a candidate.
      3. For each candidate, re-read the code at every hop of its path yourself; do not trust the hunter's quotes. Then:
         - search for the guard the hunter missed (middleware, base-class hooks, default scopes, framework escaping, validation)
         - confirm the entry point is routed and reachable in the shipped configuration
         - write the one-line exploit sketch: input and observable result
      4. Give each candidate a verdict: `TRUE_POSITIVE`, `FALSE_POSITIVE`, `EXCLUDED` (hard exclusion) or `MERGED`, with a one-line reason. A TRUE_POSITIVE needs confidence ≥ 0.8.
      5. For each TRUE_POSITIVE:
         - assign severity per the rubric
         - write `remediation` (concrete, idiomatic for this framework) and a `regression_test`
         - run `variant-analysis`: search for the same pattern elsewhere, and emit each confirmed variant as its own verified finding with `variants_of` set
      6. Number the verified findings `SA-001…` in severity order.

      Outputs to `/workspace/outputs/`:
      - `verified-findings.json`: the TRUE_POSITIVE findings, in the rubric's verified schema
      - `rejected-candidates.json`: every other candidate, with its verdict and reason
      - `verification-stats.md`: candidates in / merged / true / false / excluded, per hunt plus the scanner sweep. This is how noisy each hunt was.

      Comment on the audit card with the stats table and the list of verified findings (id, severity, title).
    agent: skeptic_verifier
    skills:
    - fp_check
    - variant_analysis
    depends_on:
    - recon_and_threat_model
    - run_scanners
    - hunt_access_control_and_business_logic
    - hunt_injection_and_data_flow
    - hunt_secrets_crypto_config_and_supply_chain
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
  - key: report_and_create_fix_tasks
    name: Report and create fix tasks
    instructions: |-
      Turn the verified findings into a report and into fix tasks.

      Inputs (in `/workspace/assets/`):
      - `verified-findings.json`, `rejected-candidates.json`, `verification-stats.md`
      - `threat-model.md`, `entry-points.md`, `scanner-summary.md`

      1. Write **`/workspace/outputs/SECURITY-AUDIT.md`** with these sections:
         - **Executive summary**: 5 lines at most, covering the overall posture and counts by severity.
         - **Findings table**: id, severity, title, CWE, OWASP 2025, location.
         - **Findings**: one section per finding, with description, attack path, exploit sketch, remediation and regression test.
         - **Scope and method**: the commit SHA of the target checkout (`git -C <checkout> rev-parse HEAD`), scope, depth, tools and versions that ran, and coverage gaps (unavailable scanners, excluded paths, assumptions from the threat model).
         - **Appendix**: verification stats and rejected-candidate counts by reason (counts only, not the rejected details).
      2. **Create one fix task per verified finding** in the column **Fix Backlog**, exactly as the `security-fix-task` skill specifies (title format, priority, tags, assignee, description sections).
         - Check the existing cards first (`board_list_tasks`), so that a re-audit does not create duplicates.
         - If a finding matches an existing card, do not create a new card. Add a comment on the existing card saying this audit re-confirmed it.
      3. Once the report and every card are final, attach `SECURITY-AUDIT.md` to the audit card with `board_attach_asset`, **exactly once**. Do not attach drafts. If you already attached a version, do not attach another.
      4. Comment on the audit card with:
         - the executive summary
         - the fix cards created and re-confirmed, as id + title
         - the coverage gaps
      5. Move the audit card to **Audit Complete**.

      If `verified-findings.json` is empty, still write and attach the report (a clean result with its coverage gaps is a valid outcome), create no fix cards, and move the card.
    agent: security_reporter
    tools:
    - board_list_tasks
    - board_create_task
    - board_move_task
    - board_attach_asset
    - board_manage_tags
    skills:
    - security_fix_task
    depends_on:
    - recon_and_threat_model
    - run_scanners
    - verify_findings
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
- key: fix_security_finding
  name: Fix security finding
  description: 'Implements one Fix Backlog card: reproduces the finding with a regression
    test, applies the minimal root-cause fix, and opens a pull request (or attaches
    a patch when the repository is read-only). Starts when a card enters Fixing.'
  base:
    tools:
    - board_get_task
    - board_get_comments
    - board_add_comment
    - board_move_task
    - board_attach_asset
    - board_manage_tags
    skills:
    - security_fix_task
    - security_finding_rubric
    repositories:
    - target
  steps:
  - key: reproduce_fix_and_open_pr
    name: Reproduce, fix and open PR
    instructions: |-
      Implement the security fix described on this card, following the "Implementing a fix card" section of the `security-fix-task` skill.

      1. Read the card and its comments (`board_get_task`, `board_get_comments`). Read the repository's contributor guidance first (`CLAUDE.md`, `AGENTS.md`, `CONTRIBUTING.md`), and follow its conventions for tests, commits and branches.
      2. Re-check the finding against the current default branch in `/workspace/repo`. If it no longer reproduces, comment with the evidence, move the card to **Won't Fix**, and stop.
      3. Create branch `security/<card id>-<slug>`.
      4. Write the regression test from the card and run it. It must fail on the unfixed code.
      5. Apply the minimal root-cause fix, including the variants listed on the card. No unrelated changes.
      6. Run the regression test and the relevant part of the existing suite, and capture the output.
      7. Commit: `fix(security): <title> (<CWE>)`.
      8. Deliver the fix:
         - **The repository accepts pushes** (`git push --dry-run` succeeds) **and is private**: push the branch and open a PR with `gh pr create`. Use the card's Finding / Attack path / Fix sections plus "Test evidence" (before/after output) as the body.
         - **Read-only or public repository**: do not push. Write the fix with `git format-patch -1 --stdout > /workspace/outputs/fix-<card id>.patch`, attach it to the card with `board_attach_asset`, and say in a comment that a human must apply it through a private path.
      9. Comment on the card with a summary, the PR link or patch name, and the test evidence. Then move the card to **Fix In Review**.

      A leaked secret is fixed by rotation first. Say so on the card, and never put the value anywhere.
    agent: security_fix_engineer
    on_failure: fail
    skip_policy: never
    max_retries: 0
    allow_non_interactive: true
    bmad_enabled: false
triggers:
- kind: column
  workflow: repository_security_audit
  column: auditing
  trigger_mode: auto
  cooldown_seconds: 5
- kind: column
  workflow: fix_security_finding
  column: fixing
  trigger_mode: auto
  cooldown_seconds: 5
requires:
  repositories:
  - key: target
    purpose: The repository to audit. Read-only access is enough for the audit; the fix
      workflow opens pull requests only when the repository is private and writable,
      otherwise it attaches a patch to the fix card.
